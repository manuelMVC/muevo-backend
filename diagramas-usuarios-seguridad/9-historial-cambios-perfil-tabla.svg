<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="810" viewBox="0 0 1450 810"><defs></defs><rect width="1450" height="810" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Anatomía de profile_change_history y ejemplos de lo que registra</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Una fila por cambio. Los ejemplos salen de la prueba de punta a punta (test_profile_history.py), que corre dentro de una transacción que se revierte.</text><rect x="30" y="100" width="430" height="335" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><path d="M30,107 q0,-7 7,-7 h416 q7,0 7,7 v35 h-430 z" fill="#dc2626"/><text x="40" y="119" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">profile_change_history</text><text x="40" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#ffffffcc" font-weight="normal" text-anchor="start">solo lectura · sin llaves foráneas</text><rect x="38" y="148" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="50" y="158.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="68" y="159.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">id</text><text x="40" y="178.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">seq   (orden dentro de la transacción)</text><text x="40" y="197.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">changed_at   fecha y hora</text><text x="40" y="216.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">changed_by_user_id / _name / _email   PERSONA</text><text x="40" y="235.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">source   api | sistema</text><text x="40" y="254.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">entity_type   profile | permission | …</text><text x="40" y="273.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">change_type   permission_removed, …</text><text x="40" y="292.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">description   frase en español</text><text x="40" y="311.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">field_name</text><text x="40" y="330.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">old_value   VALOR ANTERIOR</text><text x="40" y="349.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">new_value   VALOR ACTUAL</text><text x="40" y="368.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">profile_id / profile_code   perfil afectado</text><text x="40" y="387.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">target_user_id / _email   usuario afectado</text><text x="40" y="406.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">company_id / company_name   alcance</text><text x="40" y="425.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">record_id · details (JSONB)</text><text x="40" y="461" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#475569" font-weight="normal" text-anchor="start">Índices: fecha, seq, perfil, usuario afectado, persona, tipo.</text><rect x="500" y="100" width="920" height="150" rx="9" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><path d="M500,109 q0,-9 9,-9 h902 q9,0 9,9 v24 h-920 z" fill="#c2410c"/><text x="514" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="start">Quitar un permiso a un perfil</text><text x="1408" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffffdd" font-weight="normal" text-anchor="end">permission_removed</text><text x="514" y="154" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Persona</text><text x="640" y="154" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">Admin Muevo (admin@muevo.app) · origen: api</text><text x="514" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Cambio</text><text x="640" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">Se quitó el permiso 'batches.edit' del perfil 'test_hist'</text><text x="514" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Valor anterior</text><text x="640" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">batches.edit</text><text x="514" y="217" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Valor actual</text><text x="640" y="217" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">—</text><rect x="500" y="270" width="920" height="150" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><path d="M500,279 q0,-9 9,-9 h902 q9,0 9,9 v24 h-920 z" fill="#2563eb"/><text x="514" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="start">Cambiar el alcance de una asignación</text><text x="1408" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffffdd" font-weight="normal" text-anchor="end">profile_assignment_changed</text><text x="514" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Persona</text><text x="640" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">Admin Muevo (admin@muevo.app) · origen: api</text><text x="514" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Cambio</text><text x="640" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">Se cambió el alcance (empresa) de viewer@muevo.app: LegalDocs Express LLC → todo el holding</text><text x="514" y="366" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Valor anterior</text><text x="640" y="366" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">LegalDocs Express LLC</text><text x="514" y="387" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Valor actual</text><text x="640" y="387" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">todo el holding</text><rect x="500" y="440" width="920" height="150" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.8"/><path d="M500,449 q0,-9 9,-9 h902 q9,0 9,9 v24 h-920 z" fill="#059669"/><text x="514" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="start">Cambiar un acceso a una empresa</text><text x="1408" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffffdd" font-weight="normal" text-anchor="end">company_access_changed</text><text x="514" y="494" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Persona</text><text x="640" y="494" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">Carlos (carlos@muevo.app) · origen: api</text><text x="514" y="515" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Cambio</text><text x="640" y="515" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">Se cambió el permiso de operar de operator@muevo.app en la empresa LegalDocs Express LLC</text><text x="514" y="536" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Valor anterior</text><text x="640" y="536" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">sí / no (según el caso)</text><text x="514" y="557" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#475569" font-weight="bold" text-anchor="start">Valor actual</text><text x="640" y="557" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="start">lo contrario</text><rect x="500" y="620" width="920" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="514" y="643" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">Cómo se lee una historia</text><text x="514" y="667" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Todo lo que le pasó a un perfil:   GET /admin/profile-history?profile_code=operator</text><text x="514" y="688" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Todo lo que le pasó a una persona:   GET /admin/profile-history?target_user_email=viewer@muevo.app</text><text x="514" y="709" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Todo lo que hizo una persona:   GET /admin/profile-history?changed_by_user_id=&lt;id&gt;</text><text x="514" y="730" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">En SQL:   SELECT changed_at, changed_by_email, description, old_value, new_value</text><text x="514" y="751" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">              FROM profile_change_history WHERE profile_code = 'operator' ORDER BY changed_at, seq;</text></svg>