<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="620" viewBox="0 0 1330 620"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1330" height="620" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 1 — El modelo de usuarios y seguridad de un vistazo</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Cinco preguntas que el sistema responde, en orden, cada vez que alguien usa el portal.</text><rect x="30" y="100" width="232" height="262" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><path d="M30,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#2563eb"/><circle cx="54" cy="128" r="13" fill="#0f172a"/><text x="54" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="76" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">¿QUIÉN ES?</text><text x="44" y="182" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">users</text><text x="44" y="218" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">La cuenta: correo y contraseña</text><text x="44" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">(cifrada con bcrypt).</text><text x="44" y="254" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">El login emite un token</text><text x="44" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">(JWT) válido por 24 horas.</text><polyline points="265,231.0 285,231.0" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="288" y="100" width="232" height="262" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><path d="M288,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#059669"/><circle cx="312" cy="128" r="13" fill="#0f172a"/><text x="312" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="334" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">¿DE QUÉ EMPRESA?</text><text x="302" y="182" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">holding_users</text><text x="302" y="204" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">holding_user_companies</text><text x="302" y="226" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start" font-style="italic">(holdings, companies)</text><text x="302" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">Pertenece a un holding y entra</text><text x="302" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">a una o varias empresas.</text><text x="302" y="298" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">Sin acceso (can_view) no entra.</text><polyline points="523,231.0 543,231.0" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="546" y="100" width="232" height="262" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><path d="M546,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#059669"/><circle cx="570" cy="128" r="13" fill="#0f172a"/><text x="570" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="592" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">¿CON QUÉ PERFIL?</text><text x="560" y="182" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">holding_user_profiles</text><text x="560" y="218" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">Se le asigna un perfil.</text><text x="560" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">company_id vacío = vale para</text><text x="560" y="254" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">todo el holding; con valor =</text><text x="560" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">solo para esa empresa.</text><polyline points="781,231.0 801,231.0" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="804" y="100" width="232" height="262" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><path d="M804,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#d97706"/><circle cx="828" cy="128" r="13" fill="#0f172a"/><text x="828" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="850" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">¿QUÉ PUEDE HACER?</text><text x="818" y="182" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">profiles</text><text x="818" y="204" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">profile_permissions</text><text x="818" y="226" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">permissions</text><text x="818" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start" font-style="italic">(modules, actions)</text><text x="818" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">El perfil agrupa permisos con</text><text x="818" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">forma "módulo.acción",</text><text x="818" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">por ejemplo batches.approve.</text><polyline points="1039,231.0 1059,231.0" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="1062" y="100" width="232" height="262" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/><path d="M1062,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#334155"/><circle cx="1086" cy="128" r="13" fill="#0f172a"/><text x="1086" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="1108" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">¿SOBRE QUÉ DATOS?</text><text x="1076" y="182" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">route_batches</text><text x="1076" y="204" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">route_headers</text><text x="1076" y="226" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">batch_clients</text><text x="1076" y="248" font-family="Consolas, 'Courier New', monospace" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">receptions  …</text><text x="1076" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">Las tablas de negocio llevan</text><text x="1076" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">company_id: cada empresa</text><text x="1076" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">solo ve y toca lo suyo.</text><rect x="30" y="392" width="1270" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="46" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#991b1b" font-weight="bold" text-anchor="start">Se registra solo</text><text x="46" y="433" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">audit_logs: quién cambió qué y cuándo (automático, en la misma transacción)  ·  notifications: a quién se le avisa de cada evento (campanita + email)</text><rect x="30" y="456" width="625" height="52" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/><text x="46" y="478" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#155e75" font-weight="bold" text-anchor="start">Portal del transportista</text><text x="46" y="497" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">users → transport_company_admins → transport_companies</text><rect x="675" y="456" width="625" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="691" y="478" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1e40af" font-weight="bold" text-anchor="start">App del conductor</text><text x="691" y="497" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">users → drivers → vehicles</text><rect x="30" y="520" width="1270" height="66" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="46" y="542" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#92400e" font-weight="bold" text-anchor="start">Tres atajos que hay que conocer</text><text x="46" y="561" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">•  super_admin del holding: salta los pasos 3 y 4, siempre pasa.      •  Sin ningún perfil asignado: también pasa ("fail-open", para no romper cuentas viejas).</text><text x="46" y="578" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">•  Recursos globales (tarifas, mensajes, tipos de incidencia, auditoría) solo aceptan un perfil asignado a TODO el holding, no a una empresa.</text></svg>