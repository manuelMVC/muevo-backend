<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1480" viewBox="0 0 1300 1480"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="1300" height="1480" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 7 — Cómo decide require_permission() si deja pasar o responde 403</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Función real de main.py. Se llama en cada endpoint de escritura protegido: require_permission(usuario, módulo, acción, company_id).</text><rect x="250" y="88" width="440" height="46" rx="23" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="470.0" y="106.91666666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#312e81" font-weight="bold" text-anchor="middle">require_permission(user, módulo, acción, company_id)</text><text x="470.0" y="123.41666666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#312e81" font-weight="normal" text-anchor="middle">code = "módulo.acción"   (ej. batches.approve)</text><polyline points="470,134 470,172" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polygon points="470,172.0 660.0,214 470,256.0 280.0,214" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="470" y="210.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿El usuario es un</text><text x="470" y="225.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">HoldingUser activo?</text><polyline points="660,214 920,214" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><text x="685" y="206" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" text-anchor="middle">no</text><rect x="920" y="190" width="360" height="48" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="1100.0" y="209.91666666666666" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#991b1b" font-weight="bold" text-anchor="middle">403  Usuario no pertenece</text><text x="1100.0" y="226.41666666666666" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#991b1b" font-weight="normal" text-anchor="middle">a ningún holding</text><polyline points="470,256 470,302" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><text x="486" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">sí</text><polygon points="470,302.0 660.0,344 470,386.0 280.0,344" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="470" y="340.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿hu.is_super_admin?</text><text x="470" y="355.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">(super_admin del holding)</text><polyline points="660,344 920,344" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar2)"/><text x="685" y="336" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857" font-weight="bold" text-anchor="middle">sí</text><rect x="920" y="320" width="360" height="48" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1100.0" y="339.9166666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#065f46" font-weight="bold" text-anchor="middle">✔ PASA</text><text x="1100.0" y="356.4166666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#065f46" font-weight="normal" text-anchor="middle">super_admin siempre pasa, sin excepción</text><polyline points="470,386 470,430" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><text x="486" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">no</text><rect x="260" y="430" width="420" height="50" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.6"/><text x="470.0" y="450.9166666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="middle">SELECT holding_user_profiles</text><text x="470.0" y="467.4166666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="middle">WHERE holding_user_id = hu.id</text><polyline points="470,480 470,522" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polygon points="470,522.0 660.0,564 470,606.0 280.0,564" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="470" y="560.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿Tiene al menos</text><text x="470" y="575.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">una asignación?</text><polyline points="660,564 920,564" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar2)"/><text x="685" y="556" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857" font-weight="bold" text-anchor="middle">no</text><rect x="920" y="540" width="360" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1100.0" y="563.9166666666666" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#065f46" font-weight="bold" text-anchor="middle">✔ PASA  ("fail-open")</text><text x="1100.0" y="580.4166666666666" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#065f46" font-weight="normal" text-anchor="middle">cuenta aún sin perfil: no se bloquea</text><polyline points="470,606 470,642" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><text x="486" y="628" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">sí</text><rect x="60" y="642" width="820" height="622" rx="12" fill="#fafafa" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="7,5"/><rect x="60" y="642" width="820" height="28" rx="12" fill="#6366f1"/><text x="74" y="661" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">Para cada asignación  a  (fila de holding_user_profiles) del usuario</text><polyline points="470,670 470,688" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polygon points="470,688.0 670.0,736 470,784.0 270.0,736" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="470" y="725.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿El recurso es GLOBAL?</text><text x="470" y="740.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">(company_id = None)</text><text x="470" y="755.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">ej. config, messages, audit</text><polyline points="270,736 250,736 250,832" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><text x="236" y="790" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">sí</text><polyline points="670,736 690,736 690,832" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><text x="704" y="790" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start">no · es de una empresa</text><polygon points="250,832.0 415.0,880 250,928.0 85.0,880" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="250" y="869.3333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿La asignación está</text><text x="250" y="883.8333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#7c2d12" font-weight="normal" text-anchor="middle">acotada a una empresa?</text><text x="250" y="898.3333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#7c2d12" font-weight="normal" text-anchor="middle">(a.company_id ≠ NULL)</text><polygon points="690,832.0 855.0,880 690,928.0 525.0,880" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="690" y="869.3333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿Está acotada a OTRA</text><text x="690" y="883.8333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#7c2d12" font-weight="normal" text-anchor="middle">empresa distinta a la del</text><text x="690" y="898.3333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#7c2d12" font-weight="normal" text-anchor="middle">recurso?  (≠ company_id)</text><polyline points="85,880 74,880 74,672" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round" opacity="1" stroke-dasharray="6,4" marker-end="url(#ar3)"/><text x="78" y="900" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="start">sí</text><text x="78" y="918" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#374151" font-weight="normal" text-anchor="start">se salta</text><text x="78" y="932" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#374151" font-weight="normal" text-anchor="start">(siguiente</text><text x="78" y="946" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#374151" font-weight="normal" text-anchor="start">asignación)</text><polyline points="855,880 866,880 866,672" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round" opacity="1" stroke-dasharray="6,4" marker-end="url(#ar3)"/><text x="836" y="900" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold" text-anchor="start">sí</text><polyline points="250,928 250,975 470,975" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1"/><text x="236" y="950" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">no</text><polyline points="690,928 690,975 470,975" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1"/><text x="704" y="950" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">no</text><polyline points="470,975 470,1002" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="265" y="1002" width="410" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="470.0" y="1025.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">¿El perfil de la asignación (a.profile_id) incluye el permiso?</text><text x="470.0" y="1041.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle">SELECT permissions ⨝ profile_permissions</text><text x="470.0" y="1057.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle">WHERE profile_id = a.profile_id AND code = 'módulo.acción'</text><polyline points="470,1072 470,1104" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polygon points="470,1106.0 610.0,1146 470,1186.0 330.0,1146" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="470" y="1150.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿Existe la fila?</text><polyline points="610,1146 920,1146" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar2)"/><text x="638" y="1138" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857" font-weight="bold" text-anchor="middle">sí</text><rect x="920" y="1118" width="360" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1100.0" y="1141.9166666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#065f46" font-weight="bold" text-anchor="middle">✔ PASA</text><text x="1100.0" y="1158.4166666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#065f46" font-weight="normal" text-anchor="middle">el perfil tiene 'módulo.acción'</text><polyline points="330,1146 74,1146 74,672" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round" opacity="1" stroke-dasharray="6,4" marker-end="url(#ar3)"/><text x="310" y="1138" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">no</text><text x="96" y="1170" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#374151" font-weight="normal" text-anchor="start">no → se prueba la siguiente asignación</text><polyline points="470,1264 470,1296" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><text x="482" y="1282" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#991b1b" font-weight="normal" text-anchor="start">se acabaron las asignaciones sin coincidencia</text><rect x="210" y="1296" width="520" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="470.0" y="1326.1666666666667" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#991b1b" font-weight="bold" text-anchor="middle">403  Sin permiso 'módulo.acción' para esta acción</text><rect x="920" y="690" width="360" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="934" y="714" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">Detalles que importan</text><text x="934" y="740" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start">Alcance de la asignación</text><text x="934" y="759" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">company_id = NULL → vale para</text><text x="934" y="778" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">todo el holding.</text><text x="934" y="797" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">company_id = X → solo la empresa X.</text><text x="934" y="816" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start"></text><text x="934" y="835" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start">Recurso GLOBAL</text><text x="934" y="854" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Solo cuenta una asignación de todo</text><text x="934" y="873" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">el holding. Un company_admin de una</text><text x="934" y="892" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">empresa NO puede tocar tarifas,</text><text x="934" y="911" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">mensajes ni auditoría, aunque su</text><text x="934" y="930" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">perfil lo incluya.</text><rect x="920" y="1200" width="360" height="250" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/><text x="934" y="1224" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9a3412" font-weight="bold" text-anchor="start">Compuerta previa: aprobar / anular lote</text><text x="934" y="1250" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="start">change_batch_status() NO llega</text><text x="934" y="1269" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="start">directo a esta función. Antes exige:</text><text x="934" y="1288" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="start">  super_admin  O  una fila en</text><text x="934" y="1307" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="start">  company_admins de esa empresa.</text><text x="934" y="1326" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="start">Solo después llama a</text><text x="934" y="1345" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="start">require_permission(batches, approve|cancel).</text><text x="934" y="1364" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9a3412" font-weight="normal" text-anchor="start"></text><text x="934" y="1383" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9a3412" font-weight="normal" text-anchor="start">Efecto hoy: sin esa fila legacy, un</text><text x="934" y="1402" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9a3412" font-weight="normal" text-anchor="start">perfil con batches.approve igual</text><text x="934" y="1421" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9a3412" font-weight="normal" text-anchor="start">recibe 403 "Sin acceso a este lote".</text></svg>