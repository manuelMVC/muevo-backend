<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="960" viewBox="0 0 1330 960"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect width="1330" height="960" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 3 — Anatomía de una fila de audit_logs, con ejemplos reales</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Una fila por cada insert, update o delete. La columna changes (JSONB) guarda la foto completa o solo la diferencia.</text><rect x="30" y="110" width="250" height="93" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,4"/><path d="M30,117 q0,-7 7,-7 h236 q7,0 7,7 v21 h-250 z" fill="#2563eb"/><text x="40" y="129" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">users</text><rect x="38" y="144" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="50" y="154.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="68" y="155.68" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start">id</text><rect x="38" y="163" width="24" height="14" rx="3" fill="#047857" fill-opacity="0.14"/><text x="50" y="173.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#047857" font-weight="bold" text-anchor="middle">UQ</text><text x="68" y="174.68" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start">email</text><text x="40" y="193.68" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start">full_name</text><rect x="30" y="300" width="250" height="74" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,4"/><path d="M30,307 q0,-7 7,-7 h236 q7,0 7,7 v21 h-250 z" fill="#7c3aed"/><text x="40" y="319" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">companies</text><rect x="38" y="334" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="50" y="344.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="68" y="345.68" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start">id</text><text x="40" y="364.68" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="start">name</text><rect x="340" y="110" width="400" height="202" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><path d="M340,117 q0,-7 7,-7 h386 q7,0 7,7 v35 h-400 z" fill="#dc2626"/><text x="350" y="129" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">audit_logs</text><text x="350" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#ffffffcc" font-weight="normal" text-anchor="start">Una fila por cambio</text><rect x="348" y="158" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="360" y="168.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="378" y="169.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">id                  uuid</text><text x="350" y="188.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">table_name          qué tabla cambió</text><text x="350" y="207.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">record_id           id de la fila afectada</text><text x="350" y="226.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">action              insert | update | delete</text><rect x="348" y="234" width="24" height="14" rx="3" fill="#1d4ed8" fill-opacity="0.14"/><text x="360" y="244.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#1d4ed8" font-weight="bold" text-anchor="middle">FK</text><text x="378" y="245.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">changed_by_user_id  → users  (NULL = sin token)</text><rect x="348" y="253" width="24" height="14" rx="3" fill="#1d4ed8" fill-opacity="0.14"/><text x="360" y="263.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#1d4ed8" font-weight="bold" text-anchor="middle">FK</text><text x="378" y="264.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">company_id          → companies (NULL si la tabla no la tiene)</text><text x="350" y="283.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">changes             JSONB: foto o diff</text><text x="350" y="302.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">created_at          inicio de la transacción</text><polyline points="340,241.5 310,241.5 310,151.5 280,151.5" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polyline points="340,260.5 320,260.5 320,341.5 280,341.5" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><rect x="340" y="370" width="400" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="354" y="393" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">Índices (para consultar rápido)</text><text x="354" y="417.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">ix_audit_table_record   (table_name, record_id)</text><text x="354" y="434.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   → "historial de ESTE registro"</text><text x="354" y="452.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">ix_audit_changed_by     (changed_by_user_id)</text><text x="354" y="469.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   → "todo lo que hizo ESTA persona"</text><text x="354" y="487.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">ix_audit_created_at     (created_at)</text><text x="354" y="504.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   → "qué pasó en este rango de fechas"</text><rect x="340" y="590" width="400" height="170" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/><text x="354" y="613" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">Datos reales de tu base (3 oct 2026)</text><text x="354" y="637.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">226 filas · 296 kB · ~1.3 kB por fila</text><text x="354" y="654.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">169 insert · 57 update · 0 delete</text><text x="354" y="672.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">71 % sin company_id (160 de 226): route_details,</text><text x="354" y="689.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">shipment_items, route_price_offers… no tienen esa</text><text x="354" y="707.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">columna, así que no se puede filtrar por empresa.</text><rect x="780" y="110" width="520" height="200" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.8"/><path d="M780,119 q0,-9 9,-9 h502 q9,0 9,9 v22 h-520 z" fill="#059669"/><text x="794" y="131" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="start">INSERT</text><text x="1288" y="131" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffffdd" font-weight="normal" text-anchor="end">tabla route_batches · foto completa</text><text x="794" y="162" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">{ "id": "3ce5aa8e-…", "status": "draft",</text><text x="794" y="179" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">  "company_id": "b2524fc6-…",</text><text x="794" y="196" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">  "notes": "Distribución General — Sin Confirmar",</text><text x="794" y="213" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">  "client_id": null, "created_at": null, … }</text><text x="794" y="230" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start"></text><text x="794" y="247" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">→ guarda TODAS las columnas del objeto nuevo.</text><text x="794" y="264" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">→ las que tienen default del servidor (created_at,</text><text x="794" y="281" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">   updated_at) salen null en la foto.</text><rect x="780" y="330" width="520" height="200" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/><path d="M780,339 q0,-9 9,-9 h502 q9,0 9,9 v22 h-520 z" fill="#d97706"/><text x="794" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="start">UPDATE</text><text x="1288" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffffdd" font-weight="normal" text-anchor="end">tabla route_headers · solo lo que cambió</text><text x="794" y="382" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">{ "gross_pay":            { "old": 0.0,  "new": 70.6  },</text><text x="794" y="399" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">  "muevo_commission_pct":  { "old": 12.0, "new": 5.0   },</text><text x="794" y="416" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">  "muevo_commission_amt":  { "old": 0.0,  "new": 3.53  },</text><text x="794" y="433" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">  "net_pay_estimated":     { "old": null, "new": 67.07 } }</text><text x="794" y="450" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start"></text><text x="794" y="467" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">→ guarda solo las columnas con historial: antes y</text><text x="794" y="484" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">   después. Es el precio de fórmula al crear la ruta.</text><rect x="780" y="550" width="520" height="190" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/><path d="M780,559 q0,-9 9,-9 h502 q9,0 9,9 v22 h-520 z" fill="#dc2626"/><text x="794" y="571" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="start">DELETE</text><text x="1288" y="571" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffffdd" font-weight="normal" text-anchor="end">foto de la fila antes de borrarla</text><text x="794" y="602" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">{ "id": "…", "profile_id": "…", "permission_id": "…",</text><text x="794" y="619" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">  "created_at": "2026-…" }</text><text x="794" y="636" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start"></text><text x="794" y="653" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">→ guarda TODAS las columnas de lo que se borró.</text><text x="794" y="670" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">→ hoy hay 0 filas de delete en tu base; esta forma</text><text x="794" y="687" font-family="Consolas, 'Courier New', monospace" font-size="11.4" fill="#0f172a" font-weight="normal" text-anchor="start">   se comprobó en un experimento con rollback.</text><rect x="30" y="790" width="1270" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="44" y="813" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">Cómo se reconstruye una historia</text><text x="44" y="837.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">• Historial de un registro:  WHERE table_name = 'route_headers' AND record_id = '&lt;id&gt;'  ORDER BY created_at.</text><text x="44" y="854.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">• Todo lo que hizo una persona:  WHERE changed_by_user_id = '&lt;id&gt;'.         • Una operación completa:  filas con el mismo created_at (misma transacción).</text><text x="44" y="872.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">• Qué valor tenía un campo antes: en el "old" del update; qué se borró: en la foto del delete.</text></svg>