<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect width="1450" height="760" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Cómo se registra un cambio de perfil: dos registros, una sola transacción</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Cualquier cambio a perfiles, permisos o usuarios de un perfil deja una fila técnica en audit_logs y una fila legible en profile_change_history.</text><rect x="30" y="100" width="260" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="160.0" y="131.53333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="bold" text-anchor="middle">1  Alguien hace un cambio</text><text x="160.0" y="147.33333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle"></text><text x="160.0" y="163.13333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">POST/PATCH /admin/profiles</text><text x="160.0" y="178.93333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">POST/PATCH/DELETE</text><text x="160.0" y="194.73333333333335" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">/admin/users/profiles</text><text x="160.0" y="210.53333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">PATCH /holding/users/{id}</text><text x="160.0" y="226.33333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">o un script (seed_*)</text><polyline points="290,175 330,175" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="330" y="100" width="290" height="150" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="475.0" y="131.53333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="bold" text-anchor="middle">2  El endpoint cambia objetos</text><text x="475.0" y="147.33333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">del ORM</text><text x="475.0" y="163.13333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle"></text><text x="475.0" y="178.93333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">db.add(obj) · obj.campo = valor</text><text x="475.0" y="194.73333333333335" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">db.delete(obj)</text><text x="475.0" y="210.53333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">Solo la DIFERENCIA: ya no hay</text><text x="475.0" y="226.33333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">DELETE masivo (sa_delete)</text><polyline points="620,175 660,175" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="660" y="100" width="440" height="150" rx="12" fill="#fafafa" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7,5"/><rect x="660" y="100" width="440" height="26" rx="12" fill="#dc2626"/><text x="674" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">3  commit → before_flush (dos listeners)</text><rect x="674" y="138" width="195" height="98" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="771.5" y="167.23333333333335" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="bold" text-anchor="middle">Auditoría</text><text x="771.5" y="183.03333333333336" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="normal" text-anchor="middle">técnica</text><text x="771.5" y="198.83333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="normal" text-anchor="middle"></text><text x="771.5" y="214.63333333333335" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="normal" text-anchor="middle">todas las tablas</text><rect x="880" y="138" width="205" height="98" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="982.5" y="167.23333333333335" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#065f46" font-weight="bold" text-anchor="middle">Historial de perfil</text><text x="982.5" y="183.03333333333336" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#065f46" font-weight="normal" text-anchor="middle">legible</text><text x="982.5" y="198.83333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#065f46" font-weight="normal" text-anchor="middle"></text><text x="982.5" y="214.63333333333335" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#065f46" font-weight="normal" text-anchor="middle">solo las 5 tablas</text><polyline points="1100,175 1140,175" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="1140" y="100" width="280" height="150" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="1280.0" y="131.53333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="bold" text-anchor="middle">4  Misma transacción</text><text x="1280.0" y="147.33333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle"></text><text x="1280.0" y="163.13333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">o se guardan el cambio y</text><text x="1280.0" y="178.93333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">las dos filas, o no se</text><text x="1280.0" y="194.73333333333335" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">guarda nada.</text><text x="1280.0" y="210.53333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle"></text><text x="1280.0" y="226.33333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#0f172a" font-weight="normal" text-anchor="middle">Si el commit falla: rollback</text><polyline points="772,236 772,320" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><polyline points="982,236 982,320" fill="none" stroke="#059669" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar2)"/><rect x="640" y="320" width="265" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="772.5" y="351.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#92400e" font-weight="bold" text-anchor="middle">audit_logs</text><text x="772.5" y="367.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#92400e" font-weight="normal" text-anchor="middle">qué tabla y qué campos cambiaron</text><rect x="925" y="320" width="330" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1090.0" y="351.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="bold" text-anchor="middle">profile_change_history</text><text x="1090.0" y="367.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">quién, cuándo, qué, antes y después</text><polyline points="1090,390 1090,440 500,440" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" opacity="1" stroke-dasharray="6,4" marker-end="url(#ar2)"/><rect x="30" y="410" width="470" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="265.0" y="429.1333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="bold" text-anchor="middle">5  Consulta</text><text x="265.0" y="444.93333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">GET /api/v1/admin/profile-history · pestaña "Historial de perfiles"</text><text x="265.0" y="460.73333333333335" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">permiso audit.view de todo el holding</text><rect x="30" y="510" width="440" height="235" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/><text x="44" y="533" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#065f46" font-weight="bold" text-anchor="start">Qué vigila (5 tablas)</text><text x="44" y="557" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">profiles                      crear, cambiar, borrar</text><text x="44" y="576" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">profile_permissions    permiso agregado o quitado</text><text x="44" y="595" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">holding_user_profiles  perfil asignado, quitado o</text><text x="44" y="614" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">                                      cambiado de perfil / alcance</text><text x="44" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">holding_users              rol, super admin, activo</text><text x="44" y="652" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">holding_user_companies acceso a empresas otorgado,</text><text x="44" y="671" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">                                      quitado o cambiado</text><text x="44" y="690" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start"></text><text x="44" y="709" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">Los scripts (seed_*) también quedan,</text><text x="44" y="728" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">con persona vacía y origen "sistema".</text><rect x="490" y="510" width="460" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="504" y="533" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">Qué lo protege</text><text x="504" y="557" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">• Trigger de solo lectura: rechaza</text><text x="504" y="576" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   UPDATE, DELETE y TRUNCATE.</text><text x="504" y="595" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">• Sin llaves foráneas: sobrevive aunque se</text><text x="504" y="614" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   borre el perfil o el usuario; guarda copias</text><text x="504" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   del código, nombre y correo.</text><text x="504" y="652" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">• El listener de auditoría la ignora para no</text><text x="504" y="671" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   duplicar cada fila.</text><text x="504" y="690" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">• Columna seq: conserva el orden dentro de</text><text x="504" y="709" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   una misma transacción.</text><rect x="970" y="510" width="450" height="235" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/><text x="984" y="533" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#991b1b" font-weight="bold" text-anchor="start">Lo que NO ve</text><text x="984" y="557" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">• SQL crudo, psql o pgAdmin.</text><text x="984" y="576" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">• DELETE / UPDATE masivos del ORM</text><text x="984" y="595" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   (por eso los endpoints de perfiles</text><text x="984" y="614" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   ahora borran objeto por objeto).</text><text x="984" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">• Un superusuario de PostgreSQL puede</text><text x="984" y="652" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   desactivar el trigger: falta un rol de</text><text x="984" y="671" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   aplicación sin superusuario.</text><text x="984" y="690" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">• No hay datos anteriores a la migración 033.</text></svg>