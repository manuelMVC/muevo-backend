<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="690" viewBox="0 0 1360 690"><defs></defs><rect width="1360" height="690" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 4 — Qué cubre la auditoría: operaciones, transacciones, mantenimiento y procesos</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Cobertura por tipo de actividad. "Se registra" significa que pasa por el ORM de la API; todo el catálogo de tablas está cubierto, no hace falta configurarlo tabla por tabla.</text><rect x="30" y="86" width="430" height="36" rx="8" fill="#059669" stroke="#059669" stroke-width="1"/><text x="245.0" y="111" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">SÍ se registra</text><rect x="30" y="134" width="430" height="95.5" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="42" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Operaciones</text><text x="448" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">lotes y rutas</text><text x="42" y="175.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">route_batches · route_batch_items</text><text x="42" y="191.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">route_headers · route_details</text><text x="42" y="208.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">shipment_items · incidents · deliveries</text><rect x="30" y="239.5" width="430" height="112.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="42" y="260.5" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Transacciones</text><text x="448" y="260.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">precio y mercancía</text><text x="42" y="280.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">route_price_offers (ofertas y contraofertas)</text><text x="42" y="297.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">route_headers: gross_pay, negotiation_status,</text><text x="42" y="313.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   holding_approved_by, transport_company_id</text><text x="42" y="330.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">receptions · reception_items · inventory</text><rect x="30" y="361.5" width="430" height="128.5" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="42" y="382.5" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Mantenimiento</text><text x="448" y="382.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">catálogos, usuarios y seguridad</text><text x="42" y="402.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">batch_clients · service_types (tarifas)</text><text x="42" y="419.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">incident_types · message_templates</text><text x="42" y="435.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">users · holding_users · holding_user_companies</text><text x="42" y="452.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">holding_user_profiles · profiles</text><text x="42" y="468.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">profile_permissions (los INSERT)</text><rect x="30" y="500.0" width="430" height="112.0" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/><text x="42" y="521.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Procesos automáticos</text><text x="448" y="521.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">sin intervención humana</text><text x="42" y="541.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">generación de rutas al crear el lote</text><text x="42" y="557.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">   (dispatcher + confirm_batch)</text><text x="42" y="574.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">notifications (cada aviso que se crea)</text><text x="42" y="590.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">scripts que usan el ORM (seed_*, fix_batch_*): sin autor</text><rect x="475" y="86" width="430" height="36" rx="8" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="690.0" y="111" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">Se registra A MEDIAS</text><rect x="475" y="134" width="430" height="95.5" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="487" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Permisos de un perfil</text><text x="893" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">update_profile</text><text x="487" y="175.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">Reemplaza el conjunto con un DELETE masivo:</text><text x="487" y="191.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">los permisos NUEVOS quedan (insert) pero</text><text x="487" y="208.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">los QUITADOS no. Es lo más sensible.</text><rect x="475" y="239.5" width="430" height="95.5" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="487" y="260.5" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Acceso a compañías</text><text x="893" y="260.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">edición de un usuario del holding</text><text x="487" y="280.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">El reemplazo de holding_user_companies</text><text x="487" y="297.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">también usa un DELETE masivo: no queda</text><text x="487" y="313.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">rastro de qué acceso se quitó.</text><rect x="475" y="345.0" width="430" height="112.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="487" y="366.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Sin autor (NULL)</text><text x="893" y="366.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">cambios sin token</text><text x="487" y="386.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">seeds, scripts y el login: la fila existe</text><text x="487" y="402.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">pero changed_by_user_id queda vacío.</text><text x="487" y="419.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">Cada login deja un "update users" suelto</text><text x="487" y="435.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">(solo last_login_at).</text><rect x="475" y="467.0" width="430" height="79.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="487" y="488.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Sin empresa (NULL)</text><text x="893" y="488.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">tablas sin company_id</text><text x="487" y="508.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">71 % de las filas de hoy: route_details,</text><text x="487" y="524.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">shipment_items, route_price_offers…</text><rect x="475" y="556.0" width="430" height="79.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="487" y="577.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">GPS del conductor</text><text x="893" y="577.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">filtrado a propósito</text><text x="487" y="597.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">drivers.current_lat / lng / last_location_at</text><text x="487" y="613.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">no genera fila (evita inundar la tabla).</text><rect x="920" y="86" width="430" height="36" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="1135.0" y="111" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">NO se registra</text><rect x="920" y="134" width="430" height="79.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="932" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Accesos</text><text x="1338" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">quién entró o lo intentó</text><text x="932" y="175.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">login correcto o fallido, 401 y 403.</text><text x="932" y="191.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">Solo cambia users.last_login_at.</text><rect x="920" y="223.0" width="430" height="62.5" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="932" y="244.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Lecturas</text><text x="1338" y="244.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">quién vio qué</text><text x="932" y="264.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">Ningún SELECT ni exportación se anota.</text><rect x="920" y="295.5" width="430" height="112.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="932" y="316.5" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Cambios directos a la base</text><text x="1338" y="316.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">fuera de la API</text><text x="932" y="336.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">psql, pgAdmin y scripts con SQL crudo:</text><text x="932" y="353.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">fix_passwords.py (contraseñas), fix_vehicle.py,</text><text x="932" y="369.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">seed_fleet.py, link_*_admin.py,</text><text x="932" y="386.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">reset_operational_data.py.</text><rect x="920" y="417.5" width="430" height="62.5" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="932" y="438.5" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Masivos del ORM</text><text x="1338" y="438.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">DELETE / UPDATE masivos</text><text x="932" y="458.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">db.execute(sa_delete(...)) y sa_update(...).</text><rect x="920" y="490.0" width="430" height="79.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="932" y="511.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">Esquema y despliegue</text><text x="1338" y="511.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">mantenimiento técnico</text><text x="932" y="531.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">Las migraciones (Alembic) se rastrean con Git</text><text x="932" y="547.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">y la tabla alembic_version, no con audit_logs.</text><rect x="920" y="579.0" width="430" height="79.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="932" y="600.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#0f172a" font-weight="bold" text-anchor="start">La propia auditoría</text><text x="1338" y="600.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="end" font-style="italic">sin protección anti-borrado</text><text x="932" y="620.0" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">El rol de la app es superusuario y puede</text><text x="932" y="636.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11.6" fill="#334155" font-weight="normal" text-anchor="start">borrar audit_logs; no hay triggers.</text></svg>