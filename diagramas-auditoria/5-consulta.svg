<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><rect width="1500" height="800" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 5 — Cómo se consulta el historial de auditoría</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Pantalla "Auditoría" del portal warehouse → API → tabla audit_logs. Código real: warehouse.html (renderAuditoria) y main.py (list_audit_logs).</text><rect x="30" y="100" width="290" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="175.0" y="131.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="bold" text-anchor="middle">1  Pantalla "Auditoría"</text><text x="175.0" y="147.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">warehouse.html</text><text x="175.0" y="163.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle"></text><text x="175.0" y="179.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">Filtros: Tabla · ID de registro</text><text x="175.0" y="195.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">Desde · Hasta</text><text x="175.0" y="211.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">(no hay filtro por usuario ni</text><text x="175.0" y="227.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">por acción en la pantalla)</text><polyline points="320,175 365,175" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="365" y="100" width="330" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="530.0" y="131.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="bold" text-anchor="middle">2  GET /api/v1/admin/audit-logs</text><text x="530.0" y="147.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle"></text><text x="530.0" y="163.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">table_name · record_id</text><text x="530.0" y="179.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">changed_by_user_id · date_from</text><text x="530.0" y="195.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">date_to · limit (50, máx. 200)</text><text x="530.0" y="211.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">offset (paginación)</text><text x="530.0" y="227.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">Header Authorization: Bearer</text><polyline points="695,175 740,175" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="740" y="100" width="290" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="885.0" y="139.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="bold" text-anchor="middle">3  Compuertas</text><text x="885.0" y="155.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle"></text><text x="885.0" y="171.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">get_current_user() → 401</text><text x="885.0" y="187.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">require_permission('audit',</text><text x="885.0" y="203.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">'view', company_id=None)</text><text x="885.0" y="219.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">alcance de TODO el holding</text><polyline points="1030,175 1050,175" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polygon points="1170,110.0 1290.0,175 1170,240.0 1050.0,175" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="1170" y="164.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿perfil con</text><text x="1170" y="179.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">audit.view</text><text x="1170" y="194.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">de todo el holding?</text><polyline points="1290,175 1330,175" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><text x="1310" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" text-anchor="middle">no</text><rect x="1330" y="120" width="150" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="1405.0" y="140.08333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#991b1b" font-weight="bold" text-anchor="middle">403  Sin permiso</text><text x="1405.0" y="155.58333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#991b1b" font-weight="normal" text-anchor="middle">'audit.view'</text><text x="1405.0" y="171.08333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#991b1b" font-weight="normal" text-anchor="middle"></text><text x="1405.0" y="186.58333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#991b1b" font-weight="normal" text-anchor="middle">La pantalla muestra</text><text x="1405.0" y="202.08333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#991b1b" font-weight="normal" text-anchor="middle">un mensaje claro,</text><text x="1405.0" y="217.58333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#991b1b" font-weight="normal" text-anchor="middle">no el error crudo</text><polyline points="1170,240 1170,300" fill="none" stroke="#059669" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar2)"/><text x="1186" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857" font-weight="bold" text-anchor="start">sí</text><rect x="1010" y="300" width="320" height="190" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="1170.0" y="327.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="bold" text-anchor="middle">4  SELECT sobre audit_logs</text><text x="1170.0" y="343.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle"></text><text x="1170.0" y="359.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">WHERE table_name / record_id /</text><text x="1170.0" y="375.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">changed_by_user_id / created_at</text><text x="1170.0" y="391.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">ORDER BY created_at DESC</text><text x="1170.0" y="407.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">LIMIT / OFFSET</text><text x="1170.0" y="423.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle"></text><text x="1170.0" y="439.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">Usa ix_audit_table_record,</text><text x="1170.0" y="455.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">ix_audit_changed_by e</text><text x="1170.0" y="471.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">ix_audit_created_at</text><polyline points="1010,395 965,395" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="645" y="300" width="320" height="190" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="805.0" y="335.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="bold" text-anchor="middle">5  serialize_audit_log()</text><text x="805.0" y="351.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle"></text><text x="805.0" y="367.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">Por cada fila resuelve al autor</text><text x="805.0" y="383.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">con un SELECT a users:</text><text x="805.0" y="399.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">{ name, email } o null</text><text x="805.0" y="415.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">y devuelve el JSON con</text><text x="805.0" y="431.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">changes tal como se guardó.</text><text x="805.0" y="447.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle"></text><text x="805.0" y="463.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#3b0764" font-weight="normal" text-anchor="middle">(un db.get por fila; se reutiliza)</text><polyline points="645,395 600,395" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="330" y="300" width="270" height="190" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="465.0" y="351.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="bold" text-anchor="middle">6  La pantalla</text><text x="465.0" y="367.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle"></text><text x="465.0" y="383.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">Tabla paginada.</text><text x="465.0" y="399.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">Cada cambio se expande</text><text x="465.0" y="415.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">(&lt;details&gt;) y muestra</text><text x="465.0" y="431.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">el diff completo:</text><text x="465.0" y="447.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">campo, antes, después.</text><text x="30" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start" font-style="italic">El flujo de la fila 2 se lee</text><text x="30" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start" font-style="italic">de derecha a izquierda.</text><rect x="30" y="530" width="700" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="44" y="553" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">Qué permite y qué no (hoy)</text><text x="44" y="577" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">✔ Ver el historial de un registro concreto (tabla + id).</text><text x="44" y="596" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">✔ Filtrar por rango de fechas y paginar de 50 en 50.</text><text x="44" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">✔ La API acepta filtrar por usuario (changed_by_user_id).</text><text x="44" y="634" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">✘ La pantalla no ofrece filtro por usuario ni por acción.</text><text x="44" y="653" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">✘ No hay exportación (CSV/PDF) ni búsqueda dentro de changes.</text><text x="44" y="672" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">✘ No hay vistas por operación ni por empresa (71 % de las filas</text><text x="44" y="691" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">   no tiene company_id).</text><text x="44" y="710" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">✘ Acceso solo con audit.view de todo el holding: hoy solo super_admin.</text><rect x="760" y="530" width="700" height="240" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="774" y="553" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#92400e" font-weight="bold" text-anchor="start">Retención y crecimiento</text><text x="774" y="577" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">Peso medido: 296 kB para 226 filas (~1.3 kB por fila, con índices).</text><text x="774" y="596" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">A ese ritmo, 1 millón de filas ≈ 1.3 GB.</text><text x="774" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start"></text><text x="774" y="634" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">No existe política de purga ni de archivado: es uno de los</text><text x="774" y="653" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">pendientes del proyecto.</text><text x="774" y="672" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start"></text><text x="774" y="691" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">reset_operational_data.py vacía audit_logs cuando se regenera</text><text x="774" y="710" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">la demo: úsalo solo en entornos de prueba.</text></svg>