<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="600" viewBox="0 0 1330 600"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1330" height="600" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 1 — El modelo de auditoría de Muevo de un vistazo</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Cinco etapas, de que alguien cambie un dato hasta que un administrador lo consulta. Nada de esto requiere que cada pantalla "se acuerde" de auditar.</text><rect x="30" y="100" width="232" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><path d="M30,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#2563eb"/><circle cx="54" cy="128" r="13" fill="#0f172a"/><text x="54" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="76" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">QUÉ OCURRE</text><text x="44" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">Un lote, una ruta, un precio,</text><text x="44" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">un cliente, una recepción, un</text><text x="44" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">perfil… se crea, cambia o borra</text><text x="44" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">desde el portal, la app o un script.</text><polyline points="265,200.0 285,200.0" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="288" y="100" width="232" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><path d="M288,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#059669"/><circle cx="312" cy="128" r="13" fill="#0f172a"/><text x="312" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="334" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">QUIÉN LO HACE</text><text x="302" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">Un middleware lee el token</text><text x="302" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">(JWT) de la petición y deja el</text><text x="302" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">id del usuario en una variable</text><text x="302" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">por petición (ContextVar).</text><text x="302" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">Sin token = sin autor.</text><polyline points="523,200.0 543,200.0" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="546" y="100" width="232" height="200" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><path d="M546,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#7c3aed"/><circle cx="570" cy="128" r="13" fill="#0f172a"/><text x="570" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="592" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">SE DETECTA SOLO</text><text x="560" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">Un listener de SQLAlchemy</text><text x="560" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">(before_flush) revisa cada</text><text x="560" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">insert / update / delete justo</text><text x="560" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">antes de guardar. No hubo que</text><text x="560" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">tocar ~130 endpoints.</text><polyline points="781,200.0 801,200.0" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="804" y="100" width="232" height="200" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><path d="M804,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#dc2626"/><circle cx="828" cy="128" r="13" fill="#0f172a"/><text x="828" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="850" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">SE GUARDA</text><text x="818" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">audit_logs: una fila por cambio</text><text x="818" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">con tabla, registro, acción,</text><text x="818" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">autor, empresa, antes/después</text><text x="818" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">y fecha. En la MISMA transacción</text><text x="818" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">que el cambio.</text><polyline points="1039,200.0 1059,200.0" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="1062" y="100" width="232" height="200" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><path d="M1062,112 q0,-12 12,-12 h208 q12,0 12,12 v40 h-232 z" fill="#d97706"/><circle cx="1086" cy="128" r="13" fill="#0f172a"/><text x="1086" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="1108" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">SE CONSULTA</text><text x="1076" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">GET /api/v1/admin/audit-logs</text><text x="1076" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">y la pantalla "Auditoría".</text><text x="1076" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">Solo con el permiso audit.view</text><text x="1076" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">de alcance de todo el holding</text><text x="1076" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="12.8" fill="#1f2937" font-weight="normal" text-anchor="start">(hoy, super_admin).</text><rect x="30" y="332" width="625" height="118" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/><text x="46" y="356" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#065f46" font-weight="bold" text-anchor="start">✔ Lo que SÍ registra</text><text x="46" y="378.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">Operaciones: lotes, rutas, paradas y envíos</text><text x="46" y="395.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">Transacciones: ofertas de precio, aprobación de holding, recepciones, inventario</text><text x="46" y="413.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">Mantenimiento: clientes, tarifas, catálogos, usuarios, perfiles y permisos</text><text x="46" y="430.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">Procesos automáticos: generación de rutas, avisos (notifications), seeds</text><rect x="675" y="332" width="625" height="118" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="691" y="356" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#991b1b" font-weight="bold" text-anchor="start">✘ Lo que NO registra</text><text x="691" y="378.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">Accesos: login correcto o fallido, 401 y 403</text><text x="691" y="395.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">Lecturas y exportaciones</text><text x="691" y="413.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">Cambios hechos directo en PostgreSQL o con SQL crudo</text><text x="691" y="430.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12.2" fill="#334155" font-weight="normal" text-anchor="start">DELETE / UPDATE masivos del ORM (hoy: reemplazo de permisos de un perfil)</text><rect x="30" y="464" width="1270" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/><text x="46" y="487" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Cifras reales de tu base local (3 de octubre de 2026)</text><text x="46" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">226 filas = 169 inserts + 57 updates + 0 deletes   ·   10 tablas distintas   ·   296 kB en disco   ·   100 % sin autor (todas vienen del seed de demo, que corre sin token)   ·   1 sola transacción</text><text x="46" y="527" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="start" font-style="italic">El historial anterior se borró al regenerar la demo: reset_operational_data.py vacía audit_logs.</text></svg>