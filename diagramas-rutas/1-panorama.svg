<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1500" height="700" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 1 — El modelo de ruta de Muevo: de la carga al reparto, hoy y propuesto</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Seis etapas. En cada una: lo que el sistema hace HOY (código real) y lo que se PROPONE al integrar país, estado, ciudad y código postal.</text><rect x="30" y="100" width="227" height="330" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><path d="M30,112 q0,-12 12,-12 h203 q12,0 12,12 v34 h-227 z" fill="#334155"/><circle cx="52" cy="124" r="13" fill="#e06a1b"/><text x="52" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="74" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">CARGA</text><rect x="38" y="154" width="211" height="142" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="46" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" font-weight="bold" text-anchor="start">HOY</text><text x="46" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">CSV, formulario o inventario</text><text x="46" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">escaneado. Valida campos y</text><text x="46" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">rangos; lat y lng son</text><text x="46" y="241" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">OBLIGATORIAS.</text><rect x="38" y="304" width="211" height="114" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="46" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="bold" text-anchor="start">PROPUESTA</text><text x="46" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">Validar el zip contra el</text><text x="46" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">catálogo; completar ciudad,</text><text x="46" y="374" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">estado y coordenadas.</text><polyline points="259,265 273,265" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="275" y="100" width="227" height="330" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><path d="M275,112 q0,-12 12,-12 h203 q12,0 12,12 v34 h-227 z" fill="#334155"/><circle cx="297" cy="124" r="13" fill="#e06a1b"/><text x="297" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="319" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">AGRUPAR</text><rect x="283" y="154" width="211" height="142" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="291" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" font-weight="bold" text-anchor="start">HOY</text><text x="291" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">K-means sobre lat/lng que</text><text x="291" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">respeta peso, volumen y</text><text x="291" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">máx. de paradas. Necesita</text><text x="291" y="241" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">scikit-learn: sin él, reparte</text><text x="291" y="258" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">en ronda (sin geografía).</text><rect x="283" y="304" width="211" height="114" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="291" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="bold" text-anchor="start">PROPUESTA</text><text x="291" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">Agrupar primero por código</text><text x="291" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">postal / zona y después</text><text x="291" y="374" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">ajustar por capacidad.</text><polyline points="504,265 518,265" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="520" y="100" width="227" height="330" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><path d="M520,112 q0,-12 12,-12 h203 q12,0 12,12 v34 h-227 z" fill="#334155"/><circle cx="542" cy="124" r="13" fill="#e06a1b"/><text x="542" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="564" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">SECUENCIAR</text><rect x="528" y="154" width="211" height="142" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="536" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" font-weight="bold" text-anchor="start">HOY</text><text x="536" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">Ordena las paradas por</text><text x="536" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">hora límite. No optimiza el</text><text x="536" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">recorrido ni usa el almacén</text><text x="536" y="241" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">de origen.</text><rect x="528" y="304" width="211" height="114" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="536" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="bold" text-anchor="start">PROPUESTA</text><text x="536" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">Vecino más cercano / 2-opt</text><text x="536" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">desde el almacén, respetando</text><text x="536" y="374" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">las horas límite.</text><polyline points="749,265 763,265" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="765" y="100" width="227" height="330" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><path d="M765,112 q0,-12 12,-12 h203 q12,0 12,12 v34 h-227 z" fill="#334155"/><circle cx="787" cy="124" r="13" fill="#e06a1b"/><text x="787" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="809" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#ffffff" font-weight="bold" text-anchor="start">MEDIR Y PRECIAR</text><rect x="773" y="154" width="211" height="142" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="781" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" font-weight="bold" text-anchor="start">HOY</text><text x="781" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">No calcula km: 0 de 55</text><text x="781" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">paradas y 0 de 16 rutas.</text><text x="781" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">El término por km del</text><text x="781" y="241" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">precio vale $0.</text><rect x="773" y="304" width="211" height="114" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="781" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="bold" text-anchor="start">PROPUESTA</text><text x="781" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">km por tramo → total de la</text><text x="781" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">ruta → precio de fórmula</text><text x="781" y="374" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">completo.</text><polyline points="994,265 1008,265" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="1010" y="100" width="227" height="330" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><path d="M1010,112 q0,-12 12,-12 h203 q12,0 12,12 v34 h-227 z" fill="#334155"/><circle cx="1032" cy="124" r="13" fill="#e06a1b"/><text x="1032" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="1054" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">GUARDAR</text><rect x="1018" y="154" width="211" height="142" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="1026" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" font-weight="bold" text-anchor="start">HOY</text><text x="1026" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">route_batches, route_batch_items,</text><text x="1026" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">route_headers, route_details y</text><text x="1026" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">shipment_items; los triggers</text><text x="1026" y="241" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">de Postgres recalculan totales.</text><rect x="1018" y="304" width="211" height="114" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="1026" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="bold" text-anchor="start">PROPUESTA</text><text x="1026" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">Igual, más postal_code_id</text><text x="1026" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">en la parada.</text><polyline points="1239,265 1253,265" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="1255" y="100" width="227" height="330" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.8"/><path d="M1255,112 q0,-12 12,-12 h203 q12,0 12,12 v34 h-227 z" fill="#334155"/><circle cx="1277" cy="124" r="13" fill="#e06a1b"/><text x="1277" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="1299" y="129" font-family="'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#ffffff" font-weight="bold" text-anchor="start">NEGOCIAR Y ENTREGAR</text><rect x="1263" y="154" width="211" height="142" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="1271" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#475569" font-weight="bold" text-anchor="start">HOY</text><text x="1271" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">Aprobar el lote abre el</text><text x="1271" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">marketplace de ofertas;</text><text x="1271" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">luego vehículo, conductor,</text><text x="1271" y="241" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">entrega (deliveries) e</text><text x="1271" y="258" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1f2937" font-weight="normal" text-anchor="start">incidencias.</text><rect x="1263" y="304" width="211" height="114" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="1271" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="bold" text-anchor="start">PROPUESTA</text><text x="1271" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">Ofertar solo a transportistas</text><text x="1271" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#1e3a8a" font-weight="normal" text-anchor="start">que cubren la zona (fase 2).</text><rect x="30" y="458" width="1440" height="190" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="46" y="484" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#991b1b" font-weight="bold" text-anchor="start">Lo más importante que se comprobó (capítulos 3 a 5)</text><text x="46" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="12.4" fill="#334155" font-weight="normal" text-anchor="start">1.  El agrupamiento "inteligente" hoy NO es geográfico en este equipo: scikit-learn no está en requirements.txt ni instalado, así que se usa el reparto cíclico.</text><text x="46" y="532" font-family="'Segoe UI', Arial, sans-serif" font-size="12.4" fill="#334155" font-weight="normal" text-anchor="start">      Con las mismas 55 paradas de demo: sin scikit-learn = 5 rutas y 501 km; con scikit-learn = 7 rutas y 169 km; ordenando por vecino más cercano = 71 km.</text><text x="46" y="554" font-family="'Segoe UI', Arial, sans-serif" font-size="12.4" fill="#334155" font-weight="normal" text-anchor="start">2.  Nadie calcula distancias: distance_from_prev_km está vacío en 55/55 paradas y total_km_estimated en 16/16 rutas, así que las tarifas por km nunca se aplican.</text><text x="46" y="576" font-family="'Segoe UI', Arial, sans-serif" font-size="12.4" fill="#334155" font-weight="normal" text-anchor="start">3.  No existen tablas de país, estado, ciudad ni código postal: son texto libre, y las paradas guardan ciudad y estado vacíos.</text><text x="46" y="598" font-family="'Segoe UI', Arial, sans-serif" font-size="12.4" fill="#334155" font-weight="normal" text-anchor="start">4.  Una zona primero (propuesta): 45 km en 9 rutas, con 1 solo código postal repartido entre rutas, frente a 5 con scikit-learn.</text></svg>