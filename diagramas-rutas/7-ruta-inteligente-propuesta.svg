<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090"><defs></defs><rect width="1500" height="1090" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 7 — PROPUESTA: ruta inteligente con geografía integrada, de la carga a la ruta guardada</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Siete etapas. Las tablas azules son NUEVAS (Figura 5); las demás ya existen. La etapa 6 es lo que hoy falta para que el precio por km tenga efecto.</text><rect x="30" y="92" width="1020" height="118" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><path d="M30,102 q0,-10 10,-10 h50 v118 h-50 q-10,0 -10,-10 z" fill="#334155"/><circle cx="60" cy="151.0" r="13" fill="#e06a1b"/><text x="60" y="156.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="106" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">ENTRADA</text><text x="106" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">CSV, formulario o inventario escaneado: destino, dirección, código postal, peso, volumen y hora límite; lat y lng</text><text x="106" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">pasan a ser opcionales.</text><rect x="106" y="173" width="190.5" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="201.25" y="187" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">warehouse_inventory_items</text><text x="1038" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="10.8" fill="#92400e" font-weight="normal" text-anchor="end" font-style="italic">Hoy: lat y lng obligatorias</text><polyline points="58,211 58,217" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" opacity="1"/><rect x="30" y="218" width="1020" height="118" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><path d="M30,228 q0,-10 10,-10 h50 v118 h-50 q-10,0 -10,-10 z" fill="#334155"/><circle cx="60" cy="277.0" r="13" fill="#e06a1b"/><text x="60" y="282.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="106" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">NORMALIZAR Y VALIDAR</text><text x="106" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Busca el código postal en el catálogo: completa ciudad, estado y país; rechaza con error por fila un zip inexistente;</text><text x="106" y="281" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">si faltan lat y lng usa el centroide del zip y lo marca como aproximado.</text><rect x="106" y="299" width="100.80000000000001" height="20" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="156.4" y="313" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#1e3a8a" font-weight="bold" text-anchor="middle">postal_codes</text><rect x="212.8" y="299" width="59.400000000000006" height="20" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="242.5" y="313" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#1e3a8a" font-weight="bold" text-anchor="middle">cities</text><rect x="278.20000000000005" y="299" width="59.400000000000006" height="20" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="307.90000000000003" y="313" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#1e3a8a" font-weight="bold" text-anchor="middle">states</text><rect x="343.6" y="299" width="80.1" height="20" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="383.65000000000003" y="313" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#1e3a8a" font-weight="bold" text-anchor="middle">countries</text><text x="1038" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="10.8" fill="#92400e" font-weight="normal" text-anchor="end" font-style="italic">Nuevo</text><polyline points="58,337 58,343" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" opacity="1"/><rect x="30" y="344" width="1020" height="118" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><path d="M30,354 q0,-10 10,-10 h50 v118 h-50 q-10,0 -10,-10 z" fill="#334155"/><circle cx="60" cy="403.0" r="13" fill="#e06a1b"/><text x="60" y="408.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="106" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">AGRUPAR POR ZONA</text><text x="106" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">La unidad es el código postal / la zona: k-means sobre los centroides de las zonas y no sobre paradas sueltas. Un zip</text><text x="106" y="407" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">no se parte salvo que exceda la capacidad.</text><rect x="106" y="425" width="100.80000000000001" height="20" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="156.4" y="439" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#1e3a8a" font-weight="bold" text-anchor="middle">postal_codes</text><rect x="212.8" y="425" width="114.60000000000001" height="20" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="270.1" y="439" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#1e3a8a" font-weight="bold" text-anchor="middle">delivery_zones</text><text x="1038" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="10.8" fill="#92400e" font-weight="normal" text-anchor="end" font-style="italic">Hoy: k-means sobre paradas (si hay sklearn)</text><polyline points="58,463 58,469" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" opacity="1"/><rect x="30" y="470" width="1020" height="118" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><path d="M30,480 q0,-10 10,-10 h50 v118 h-50 q-10,0 -10,-10 z" fill="#334155"/><circle cx="60" cy="529.0" r="13" fill="#e06a1b"/><text x="60" y="534.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="106" y="494" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">CAPACIDAD Y VEHÍCULO</text><text x="106" y="516" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Aplica peso, volumen, máximo de paradas y unidades del tipo de vehículo elegido; divide los grupos que excedan,</text><text x="106" y="533" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">priorizando la hora límite más temprana.</text><rect x="106" y="551" width="107.7" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="159.85" y="565" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">vehicle_types</text><rect x="219.7" y="551" width="183.60000000000002" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="311.5" y="565" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">companies (max_csv_rows)</text><text x="1038" y="494" font-family="'Segoe UI', Arial, sans-serif" font-size="10.8" fill="#92400e" font-weight="normal" text-anchor="end" font-style="italic">Igual que hoy</text><polyline points="58,589 58,595" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" opacity="1"/><rect x="30" y="596" width="1020" height="118" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><path d="M30,606 q0,-10 10,-10 h50 v118 h-50 q-10,0 -10,-10 z" fill="#334155"/><circle cx="60" cy="655.0" r="13" fill="#e06a1b"/><text x="60" y="660.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="106" y="620" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">SECUENCIAR</text><text x="106" y="642" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Ordena el recorrido de cada ruta con vecino más cercano y 2-opt desde el almacén de origen, respetando las horas</text><text x="106" y="659" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">límite; a futuro, un solver (OR-Tools).</text><rect x="106" y="677" width="231.9" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="221.95" y="691" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">warehouses (lat/lng del origen)</text><text x="1038" y="620" font-family="'Segoe UI', Arial, sans-serif" font-size="10.8" fill="#92400e" font-weight="normal" text-anchor="end" font-style="italic">Hoy: orden por hora límite</text><polyline points="58,715 58,721" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" opacity="1"/><rect x="30" y="722" width="1020" height="118" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><path d="M30,732 q0,-10 10,-10 h50 v118 h-50 q-10,0 -10,-10 z" fill="#334155"/><circle cx="60" cy="781.0" r="13" fill="#e06a1b"/><text x="60" y="786.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="106" y="746" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">MEDIR Y PRECIAR</text><text x="106" y="768" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Calcula los km de cada tramo (línea recta o servicio de rutas), los guarda y suma el total; el precio de fórmula pasa</text><text x="106" y="785" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">a incluir precio_por_km × km.</text><rect x="106" y="803" width="259.5" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="235.75" y="817" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">route_details.distance_from_prev_km</text><rect x="371.5" y="803" width="238.8" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="490.9" y="817" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">route_headers.total_km_estimated</text><rect x="616.3" y="803" width="107.7" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="670.15" y="817" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">service_types</text><text x="1038" y="746" font-family="'Segoe UI', Arial, sans-serif" font-size="10.8" fill="#92400e" font-weight="normal" text-anchor="end" font-style="italic">Hoy: sin km, término por km = $0</text><polyline points="58,841 58,847" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" opacity="1"/><rect x="30" y="848" width="1020" height="118" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><path d="M30,858 q0,-10 10,-10 h50 v118 h-50 q-10,0 -10,-10 z" fill="#334155"/><circle cx="60" cy="907.0" r="13" fill="#e06a1b"/><text x="60" y="912.0" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">7</text><text x="106" y="872" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">PERSISTIR</text><text x="106" y="894" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Crea el lote, las rutas, las paradas (con postal_code_id) y los paquetes; los triggers recalculan los totales y la</text><text x="106" y="911" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">auditoría registra cada cambio.</text><rect x="106" y="929" width="107.7" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="159.85" y="943" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">route_batches</text><rect x="219.7" y="929" width="135.3" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="287.35" y="943" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">route_batch_items</text><rect x="361.0" y="929" width="107.7" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="414.85" y="943" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">route_headers</text><rect x="474.7" y="929" width="107.7" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="528.55" y="943" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">route_details</text><rect x="588.4" y="929" width="114.60000000000001" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="645.6999999999999" y="943" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">shipment_items</text><rect x="709.0" y="929" width="87.0" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="752.5" y="943" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="middle">audit_logs</text><text x="1038" y="872" font-family="'Segoe UI', Arial, sans-serif" font-size="10.8" fill="#92400e" font-weight="normal" text-anchor="end" font-style="italic">Igual, + postal_code_id</text><rect x="1080" y="92" width="390" height="300" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/><text x="1094" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#065f46" font-weight="bold" text-anchor="start">Fase 0 — sin tablas nuevas (primero)</text><text x="1094" y="139" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">1. Agregar scikit-learn a requirements.txt</text><text x="1094" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    (y avisar si falta, en vez de callar).</text><text x="1094" y="177" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">2. Cargar lat/lng de cada almacén de origen.</text><text x="1094" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">3. Calcular los km de cada tramo y guardarlos:</text><text x="1094" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    el precio por km empieza a contar.</text><text x="1094" y="234" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">4. Ordenar las paradas por vecino más cercano.</text><text x="1094" y="253" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">5. Pasar max_stops, capacidad y origen al</text><text x="1094" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    algoritmo sin tocar la base.</text><rect x="1080" y="408" width="390" height="270" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="1094" y="431" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1e3a8a" font-weight="bold" text-anchor="start">Fase 1 — geografía y zonas</text><text x="1094" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">1. Crear countries, states, cities y postal_codes.</text><text x="1094" y="474" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">2. Cargar el catálogo y rellenar postal_code_id</text><text x="1094" y="493" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    desde el zip_code de texto actual.</text><text x="1094" y="512" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">3. Validar y completar en la importación.</text><text x="1094" y="531" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">4. Agrupar por código postal / zona primero.</text><text x="1094" y="550" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">5. Reportes por ciudad y estado.</text><rect x="1080" y="694" width="390" height="270" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="1094" y="717" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#92400e" font-weight="bold" text-anchor="start">Fase 2 — mercado y optimización</text><text x="1094" y="741" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">1. delivery_zones y transport_coverage:</text><text x="1094" y="760" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    ofertar solo a quien cubre la zona.</text><text x="1094" y="779" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">2. Solver de rutas (OR-Tools o Clarke-Wright)</text><text x="1094" y="798" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    con ventanas horarias.</text><text x="1094" y="817" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">3. Distancias por carretera en vez de línea</text><text x="1094" y="836" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    recta.</text><text x="1080" y="990" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="start">Chips azules = tablas nuevas · grises = ya existen</text></svg>