<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1500" height="1130" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Figura 6 — La ruta "inteligente" hoy: cómo funciona plan_stops() en dispatcher.py</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Se ejecuta en POST /api/v1/warehouse/batches/plan. No guarda nada: devuelve las rutas propuestas para que el usuario las ajuste.</text><rect x="150" y="86" width="660" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="480.0" y="105.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="bold" text-anchor="middle">Entrada: paradas + capacidad del vehículo</text><text x="480.0" y="121.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">cada parada: lat, lng, peso, volumen, hora_limite  ·  también llega codigo_postal (no se usa)</text><text x="480.0" y="137.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#312e81" font-weight="normal" text-anchor="middle">capacidad: peso_max_lbs, volumen_max_ft3, max_stops_per_route (12 por defecto)</text><polyline points="480,148 480,176" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polygon points="480,176.0 670.0,218 480,260.0 290.0,218" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="480" y="214.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿Todo cabe en UNA ruta?</text><text x="480" y="229.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">peso, volumen y nº de paradas</text><polyline points="670,218 740,218" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><text x="695" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857" font-weight="bold" text-anchor="middle">sí</text><rect x="740" y="190" width="270" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="875.0" y="214.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="bold" text-anchor="middle">1 ruta con todas las paradas</text><text x="875.0" y="230.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">ordenadas por hora_limite</text><polyline points="480,260 480,296" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><text x="494" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start">no</text><rect x="160" y="296" width="640" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="480.0" y="315.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">Estima cuántas rutas hacen falta (k)</text><text x="480.0" y="331.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle">k = máximo de ⌈peso ÷ peso_max⌉, ⌈volumen ÷ vol_max⌉,</text><text x="480.0" y="347.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle">⌈paradas ÷ máx_paradas⌉ y 2 · nunca más que paradas</text><polyline points="480,358 480,392" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polygon points="480,392.0 680.0,436 480,480.0 280.0,436" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="480" y="432.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿scikit-learn está disponible?</text><text x="480" y="447.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">from sklearn.cluster import KMeans</text><polyline points="280,436 225,436 225,520" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><text x="300" y="428" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857" font-weight="bold" text-anchor="start">sí</text><rect x="60" y="520" width="330" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="225.0" y="546.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="bold" text-anchor="middle">KMeans(k, n_init = 10)</text><text x="225.0" y="562.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">sobre (lat, lng): junta paradas</text><text x="225.0" y="578.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">cercanas en el mapa</text><polyline points="680,436 735,436 735,520" fill="none" stroke="#dc2626" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar2)"/><text x="660" y="428" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" text-anchor="start">no</text><rect x="570" y="520" width="330" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="735.0" y="546.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="bold" text-anchor="middle">Relleno: etiqueta = i % k</text><text x="735.0" y="562.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">reparto cíclico: NO mira el mapa</text><text x="735.0" y="578.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="normal" text-anchor="middle">← lo que corre HOY en este equipo</text><polyline points="225,596 225,634 480,634" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" opacity="1"/><polyline points="735,596 735,634 480,634" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" opacity="1"/><polyline points="480,634 480,664" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="220" y="664" width="520" height="46" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="480.0" y="683.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">Agrupa las paradas por etiqueta</text><text x="480.0" y="699.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle">un grupo por cada cluster</text><polyline points="480,710 480,746" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polygon points="480,748.0 670.0,790 480,832.0 290.0,790" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="480" y="786.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">¿El grupo cabe?</text><text x="480" y="801.5" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7c2d12" font-weight="normal" text-anchor="middle">peso, volumen y nº de paradas</text><polyline points="670,790 740,790" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar3)"/><text x="695" y="782" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#92400e" font-weight="bold" text-anchor="middle">no</text><rect x="740" y="756" width="300" height="68" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="890.0" y="778.1333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="bold" text-anchor="middle">_split_overweight_cluster()</text><text x="890.0" y="793.9333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="normal" text-anchor="middle">ordena por hora_limite y corta</text><text x="890.0" y="809.7333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="normal" text-anchor="middle">en orden cada vez que excede</text><polyline points="890,824 890,870 480,870" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" opacity="1"/><polyline points="480,832 480,870" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1"/><text x="494" y="858" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start">sí</text><polyline points="480,870 480,898" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="150" y="898" width="660" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/><text x="480.0" y="921.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">Ordena y construye cada ruta</text><text x="480.0" y="937.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle">grupos por la hora_limite más temprana (rutas urgentes primero)</text><text x="480.0" y="953.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle">dentro de cada ruta, las paradas por hora_limite (NO por distancia)</text><polyline points="480,968 480,1000" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="150" y="1000" width="660" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="480.0" y="1026.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="bold" text-anchor="middle">Resultado: lista de PlannedRoute</text><text x="480.0" y="1042.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">color, paradas, peso y volumen totales, hora límite más temprana, centroide</text><text x="480.0" y="1058.0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#065f46" font-weight="normal" text-anchor="middle">NO se guarda nada: el usuario ajusta y recién después confirma (Figura 9)</text><rect x="1060" y="86" width="410" height="360" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/><text x="1074" y="109" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#991b1b" font-weight="bold" text-anchor="start">Lo que NO hace hoy</text><text x="1074" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">1. No usa codigo_postal: llega con la parada</text><text x="1074" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    y no entra a ningún cálculo.</text><text x="1074" y="171" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">2. No usa el origen: warehouses.lat/lng está</text><text x="1074" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    vacío y el algoritmo no lo recibe.</text><text x="1074" y="209" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">3. No optimiza el recorrido: ordena por hora</text><text x="1074" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    límite, no por distancia.</text><text x="1074" y="247" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">4. No calcula km: distance_from_prev_km 0/55,</text><text x="1074" y="266" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    total_km_estimated 0/16 → el precio por km</text><text x="1074" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    vale $0 en todas las rutas.</text><text x="1074" y="304" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">5. K-means sobre grados de lat/lng, no sobre</text><text x="1074" y="323" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">    distancia real.</text><rect x="1060" y="470" width="410" height="230" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="1074" y="493" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#92400e" font-weight="bold" text-anchor="start">Por qué hoy corre el relleno</text><text x="1074" y="517" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">scikit-learn no está en requirements.txt y</text><text x="1074" y="536" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">no está instalado en el venv del proyecto.</text><text x="1074" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">El código lo atrapa con "except Exception" y</text><text x="1074" y="574" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">sigue sin avisar: nadie ve el cambio.</text><text x="1074" y="593" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start"></text><text x="1074" y="612" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Prueba: 6 paradas en Orlando y 6 en Miami,</text><text x="1074" y="631" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">capacidad de 2 rutas. Sin scikit-learn, las</text><text x="1074" y="650" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">dos rutas mezclan ambas ciudades.</text><rect x="1060" y="724" width="410" height="240" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/><text x="1074" y="747" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1e3a8a" font-weight="bold" text-anchor="start">Dónde estaría el código postal</text><text x="1074" y="771" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">En ningún paso. Es la regla de negocio</text><text x="1074" y="790" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">documentada del proyecto ("agrupar primero</text><text x="1074" y="809" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">por código postal"), pero el algoritmo</text><text x="1074" y="828" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">solo mira lat y lng.</text><text x="1074" y="847" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start"></text><text x="1074" y="866" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">La Figura 7 propone el flujo completo.</text></svg>