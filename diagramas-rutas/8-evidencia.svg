hor="start">B</text><text x="788" y="532" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#334155" font-weight="normal" text-anchor="start">Con scikit-learn (k-means)</text><rect x="1090" y="518" width="128.33333333333334" height="22" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="1226.3333333333333" y="534" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">7</text><text x="766" y="578" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#059669" font-weight="bold" text-anchor="start">C</text><text x="788" y="578" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#334155" font-weight="normal" text-anchor="start">B + orden por vecino más cercano</text><rect x="1090" y="564" width="128.33333333333334" height="22" rx="3" fill="#059669" stroke="#059669" stroke-width="1"/><text x="1226.3333333333333" y="580" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">7</text><text x="766" y="624" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2563eb" font-weight="bold" text-anchor="start">D</text><text x="788" y="624" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#334155" font-weight="normal" text-anchor="start">Propuesta: código postal primero</text><rect x="1090" y="610" width="165.0" height="22" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="1263.0" y="626" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">9</text><text x="766" y="670" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94a3b8" font-weight="bold" text-anchor="start">R</text><text x="788" y="670" font-family="'Segoe UI', Arial, sans-serif" font-size="11.4" fill="#334155" font-weight="normal" text-anchor="start">Referencia: la demo armada a mano</text><rect x="1090" y="656" width="293.3333333333333" height="22" rx="3" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/><text x="1391.3333333333333" y="672" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="bold" text-anchor="start">16</text><rect x="30" y="730" width="710" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="44" y="753" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#0f172a" font-weight="bold" text-anchor="start">Cómo leerlo</text><text x="44" y="777" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">A es lo que hoy produce el código en tu equipo; B es lo que haría con scikit-learn.</text><text x="44" y="796" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">C y D son experimentos con la propuesta: reordenan por vecino más cercano.</text><text x="44" y="815" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">D usa más rutas (9 contra 7): menos km pero más salidas de vehículo.</text><rect x="770" y="730" width="700" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="784" y="753" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#92400e" font-weight="bold" text-anchor="start">Límites de la prueba</text><text x="784" y="777" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Los km son líneas rectas entre paradas consecutivas, sin salida ni regreso al almacén.</text><text x="784" y="796" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">C y D ignoran las horas límite (salvo la primera): miden el potencial, no son un plan operativo.</text><text x="784" y="815" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Las horas límite de la demo siguen el orden original, no el geográfico.</text></svg>