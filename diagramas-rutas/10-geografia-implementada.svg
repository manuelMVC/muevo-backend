<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900"><defs><marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1450" height="900" fill="#ffffff"/><text x="30" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold" text-anchor="start">Geografía implementada (migración 032_geography) y cómo la usa el planificador</text><text x="30" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Lo que la Figura 5 proponía como idea ya existe en versión de tres niveles: país &gt; estado &gt; ciudad, con los códigos postales dentro de cada ciudad.</text><rect x="30" y="100" width="300" height="145" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><path d="M30,107 q0,-7 7,-7 h286 q7,0 7,7 v35 h-300 z" fill="#0f766e"/><text x="40" y="119" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">countries</text><text x="40" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#ffffffcc" font-weight="normal" text-anchor="start">hoy: 1 país (EE.UU.)</text><rect x="38" y="148" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="50" y="158.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="68" y="159.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">id</text><rect x="38" y="167" width="24" height="14" rx="3" fill="#047857" fill-opacity="0.14"/><text x="50" y="177.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#047857" font-weight="bold" text-anchor="middle">UQ</text><text x="68" y="178.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">iso2</text><rect x="38" y="186" width="24" height="14" rx="3" fill="#047857" fill-opacity="0.14"/><text x="50" y="196.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#047857" font-weight="bold" text-anchor="middle">UQ</text><text x="68" y="197.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">iso3</text><text x="40" y="216.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">name</text><text x="40" y="235.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">is_active</text><rect x="30" y="262" width="300" height="145" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><path d="M30,269 q0,-7 7,-7 h286 q7,0 7,7 v35 h-300 z" fill="#0f766e"/><text x="40" y="281" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">states</text><text x="40" y="296" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#ffffffcc" font-weight="normal" text-anchor="start">hoy: 50 estados</text><rect x="38" y="310" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="50" y="320.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="68" y="321.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">id</text><rect x="38" y="329" width="24" height="14" rx="3" fill="#1d4ed8" fill-opacity="0.14"/><text x="50" y="339.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#1d4ed8" font-weight="bold" text-anchor="middle">FK</text><text x="68" y="340.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">country_id</text><text x="40" y="359.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">code   (FL)</text><text x="40" y="378.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">name</text><text x="40" y="397.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">is_active</text><rect x="30" y="424" width="300" height="183" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><path d="M30,431 q0,-7 7,-7 h286 q7,0 7,7 v35 h-300 z" fill="#0f766e"/><text x="40" y="443" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">cities</text><text x="40" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#ffffffcc" font-weight="normal" text-anchor="start">hoy: 29.537 lugares postales</text><rect x="38" y="472" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="50" y="482.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="68" y="483.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">id</text><rect x="38" y="491" width="24" height="14" rx="3" fill="#1d4ed8" fill-opacity="0.14"/><text x="50" y="501.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#1d4ed8" font-weight="bold" text-anchor="middle">FK</text><text x="68" y="502.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">state_id</text><text x="40" y="521.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">name</text><text x="40" y="540.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">name_normalized</text><text x="40" y="559.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">lat / lng</text><text x="40" y="578.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">zip_codes   text[]</text><text x="40" y="597.68" font-family="Consolas, 'Courier New', monospace" font-size="11.6" fill="#0f172a" font-weight="normal" text-anchor="start">is_active</text><rect x="470" y="424" width="300" height="145" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/><path d="M470,431 q0,-7 7,-7 h286 q7,0 7,7 v35 h-300 z" fill="#334155"/><text x="480" y="443" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">route_details</text><text x="480" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#ffffffcc" font-weight="normal" text-anchor="start">la PARADA</text><rect x="478" y="472" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="490" y="482.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="508" y="483.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">id</text><rect x="478" y="491" width="24" height="14" rx="3" fill="#1d4ed8" fill-opacity="0.14"/><text x="490" y="501.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#1d4ed8" font-weight="bold" text-anchor="middle">FK</text><text x="508" y="502.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">city_id   (nuevo)</text><text x="480" y="521.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">zip_code</text><text x="480" y="540.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">city / state   (texto, se conservan)</text><text x="480" y="559.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">lat / lng</text><rect x="470" y="590" width="300" height="126" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/><path d="M470,597 q0,-7 7,-7 h286 q7,0 7,7 v35 h-300 z" fill="#334155"/><text x="480" y="609" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#ffffff" font-weight="bold" text-anchor="start">warehouses</text><text x="480" y="624" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#ffffffcc" font-weight="normal" text-anchor="start">el almacén (origen)</text><rect x="478" y="638" width="24" height="14" rx="3" fill="#b45309" fill-opacity="0.14"/><text x="490" y="648.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="bold" text-anchor="middle">PK</text><text x="508" y="649.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">id</text><rect x="478" y="657" width="24" height="14" rx="3" fill="#1d4ed8" fill-opacity="0.14"/><text x="490" y="667.68" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#1d4ed8" font-weight="bold" text-anchor="middle">FK</text><text x="508" y="668.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">city_id   (nuevo)</text><text x="480" y="687.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">city / state   (texto, se conservan)</text><text x="480" y="706.68" font-family="Consolas, 'Courier New', monospace" font-size="11.2" fill="#0f172a" font-weight="normal" text-anchor="start">zip_code</text><polyline points="90,245 90,262" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polyline points="90,407 90,424" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polyline points="330,479.5 400,479.5 400,498.5 470,498.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><polyline points="400,498.5 400,664.5 470,664.5" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" opacity="1" marker-end="url(#ar0)"/><rect x="380.05" y="464.5" width="39.9" height="16" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="400" y="476.5" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0f766e" font-weight="normal" text-anchor="middle">N : 1</text><rect x="30" y="735" width="740" height="140" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/><text x="44" y="758" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#134e4a" font-weight="bold" text-anchor="start">Qué hay cargado en tu base</text><text x="44" y="782" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">EE.UU., 50 estados y 29.537 ciudades (seed_geography.py; GeoNames, CC BY 4.0).</text><text x="44" y="803" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Las 55 paradas y el almacén ya tienen city_id; los textos city y state se conservan.</text><text x="44" y="824" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Los códigos postales viven en una lista dentro de cada ciudad, no en una tabla aparte.</text><text x="44" y="845" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">Cargar las ciudades por el ORM generó 29.537 filas en audit_logs.</text><text x="810" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#0f172a" font-weight="bold" text-anchor="start">Cómo se resuelve la ciudad de una parada: resolve_city()</text><rect x="810" y="126" width="610" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1115.0" y="157.03333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#065f46" font-weight="bold" text-anchor="middle">1 · Código postal</text><text x="1115.0" y="172.83333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#065f46" font-weight="normal" text-anchor="middle">Toma los 5 dígitos y busca en cities.zip_codes; si conoce el estado, lo prefiere</text><polyline points="1115,196 1115,220" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><rect x="810" y="220" width="610" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1115.0" y="251.03333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#065f46" font-weight="bold" text-anchor="middle">2 · Nombre de ciudad + estado</text><text x="1115.0" y="266.8333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#065f46" font-weight="normal" text-anchor="middle">Busca name_normalized dentro del estado; con create=True una ciudad nueva se da de alta</text><polyline points="1115,290 1115,314" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><rect x="810" y="314" width="610" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="1115.0" y="345.03333333333336" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="bold" text-anchor="middle">3 · La ciudad más cercana a lat/lng</text><text x="1115.0" y="360.83333333333337" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="normal" text-anchor="middle">Hasta 40 km, comparando contra el centro de cada lugar postal</text><polyline points="1115,384 1115,408" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><rect x="810" y="408" width="610" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="1115.0" y="437.93333333333334" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#991b1b" font-weight="bold" text-anchor="middle">Sin resultado: la parada queda sin ciudad y va a un grupo aparte</text><text x="810" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" fill="#0f172a" font-weight="bold" text-anchor="start">Cómo agrupa POST /warehouse/batches/plan</text><rect x="810" y="504" width="145" height="82" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="882.5" y="533.1333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="bold" text-anchor="middle">agrupar_por</text><text x="882.5" y="548.9333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">ciudad · estado</text><text x="882.5" y="564.7333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">· país (opcional)</text><polyline points="955,545 965,545" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><rect x="965" y="504" width="145" height="82" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="1037.5" y="541.0333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="bold" text-anchor="middle">Una partición</text><text x="1037.5" y="556.8333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">por zona</text><polyline points="1110,545 1120,545" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><rect x="1120" y="504" width="145" height="82" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="1192.5" y="533.1333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="bold" text-anchor="middle">plan_stops()</text><text x="1192.5" y="548.9333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="normal" text-anchor="middle">dentro de</text><text x="1192.5" y="564.7333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#92400e" font-weight="normal" text-anchor="middle">cada zona</text><polyline points="1265,545 1275,545" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" opacity="1" marker-end="url(#ar1)"/><rect x="1275" y="504" width="145" height="82" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="1347.5" y="541.0333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="bold" text-anchor="middle">Rutas con su</text><text x="1347.5" y="556.8333333333333" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#312e81" font-weight="normal" text-anchor="middle">campo "zona"</text><rect x="810" y="610" width="610" height="265" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="824" y="633" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#92400e" font-weight="bold" text-anchor="start">Lo que sigue igual (medido hoy)</text><text x="824" y="657" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">• Sin scikit-learn: cuando una zona no cabe en una ruta,</text><text x="824" y="678" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">   el reparto es cíclico (i % k) y no mira la ubicación.</text><text x="824" y="699" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">• Las paradas de cada ruta se ordenan por hora límite,</text><text x="824" y="720" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">   no por distancia.</text><text x="824" y="741" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">• total_km_estimated está vacío en las 16 rutas: el término</text><text x="824" y="762" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">   por km del precio sugerido vale 0.</text><text x="824" y="783" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">• warehouse.html no envía agrupar_por: la zona solo se</text><text x="824" y="804" font-family="'Segoe UI', Arial, sans-serif" font-size="11.8" fill="#334155" font-weight="normal" text-anchor="start">   usa llamando a la API.</text></svg>