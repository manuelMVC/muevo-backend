<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muevo Drive — Portal Warehouse</title>
<style>
  /* ── Reset & base ──────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0D0D0D;
    --surface:   #151515;
    --card:      #1C1C1C;
    --card2:     #222222;
    --orange:    #F47B20;
    --orange-dim: rgba(244,123,32,0.10);
    --orange-bdr: rgba(244,123,32,0.25);
    --white:     #F8FAFB;
    --muted:     #8A8A8A;
    --border:    rgba(255,255,255,0.07);
    --green:     #27AE60;
    --green-dim: rgba(39,174,96,0.10);
    --green-bdr: rgba(39,174,96,0.25);
    --red:       #E74C3C;
    --red-dim:   rgba(231,76,60,0.10);
    --blue:      #2E86DE;
    --blue-dim:  rgba(46,134,222,0.10);
    --blue-bdr:  rgba(46,134,222,0.25);
    --yellow:    #F1C40F;
    --yellow-dim:rgba(241,196,15,0.10);
    --radius:    10px;
    --radius-lg: 14px;
    --font:      -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
  }

  /* ── Light mode overrides ───────────────────────────────────────────────── */
  [data-theme="light"] {
    --bg:        #F4F4F2;
    --surface:   #FFFFFF;
    --card:      #FFFFFF;
    --card2:     #F0EFE8;
    --white:     #1A1A1A;
    --muted:     #6B6B6B;
    --border:    rgba(0,0,0,0.09);
    --orange-dim: rgba(244,123,32,0.08);
    --orange-bdr: rgba(244,123,32,0.20);
    --green-dim: rgba(39,174,96,0.08);
    --green-bdr: rgba(39,174,96,0.20);
    --red-dim:   rgba(231,76,60,0.08);
    --blue-dim:  rgba(46,134,222,0.08);
    --blue-bdr:  rgba(46,134,222,0.20);
    --yellow-dim:rgba(241,196,15,0.08);
  }

  [data-theme="light"] body { color: var(--white); }

  [data-theme="light"] .sidebar,
  [data-theme="light"] .topbar {
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  [data-theme="light"] table th {
    background: #EEECEA;
    color: #444;
  }

  [data-theme="light"] .kpi-card {
    border: 1px solid rgba(0,0,0,0.07);
  }

  [data-theme="light"] input,
  [data-theme="light"] select {
    background: #FAFAF8 !important;
    border-color: rgba(0,0,0,0.12) !important;
    color: #1A1A1A !important;
  }


  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ── Sidebar ──────────────────────────────────────────────────────────── */
  .sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    transition: transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s;
  }

  .sidebar-logo {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--orange);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .logo-text { font-size: 15px; font-weight: 600; color: var(--white); letter-spacing: -.3px; }
  .logo-sub  { font-size: 10px; color: var(--orange); font-weight: 500; letter-spacing: .5px; }

  .sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }

  .nav-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    padding: 10px 8px 4px;
  }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--muted); transition: all .15s;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--card); color: var(--white); }
  .nav-item.active { background: var(--orange-dim); color: var(--orange); }
  .nav-item .nav-icon { width: 16px; text-align: center; font-size: 14px; }
  .nav-badge {
    margin-left: auto;
    background: var(--orange); color: #111;
    font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 10px;
  }

  .sidebar-bottom {
    padding: 12px 10px;
    border-top: 1px solid var(--border);
  }

  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    cursor: pointer;
  }
  .user-card:hover { background: var(--card); }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #111; flex-shrink: 0;
  }
  .user-name  { font-size: 12px; font-weight: 500; color: var(--white); }
  .user-role  { font-size: 10px; color: var(--muted); }


  /* ── Sidebar — floating mode ──────────────────────────────────────────── */
  /* When body has .sidebar-floating, sidebar slides off-canvas by default   */
  body.sidebar-floating .sidebar {
    transform: translateX(-100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s;
    box-shadow: none;
    z-index: 200;
  }
  body.sidebar-floating .sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 32px rgba(0,0,0,0.35);
  }
  body.sidebar-floating .main {
    margin-left: 0 !important;
    transition: margin-left .22s cubic-bezier(.4,0,.2,1);
  }
  /* Overlay behind floating sidebar */
  #sidebarOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 199;
    backdrop-filter: blur(2px);
  }
  body.sidebar-floating #sidebarOverlay { display: block; opacity: 0; pointer-events: none; transition: opacity .22s; }
  body.sidebar-floating .sidebar.open ~ #sidebarOverlay,
  body.sidebar-floating #sidebarOverlay.visible { opacity: 1; pointer-events: auto; }

  /* Hamburger button — only visible in floating mode */
  #hamburgerBtn {
    display: none;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font-size: 18px;
    color: var(--muted); transition: color .15s; margin-right: 4px;
  }
  body.sidebar-floating #hamburgerBtn { display: inline-flex; align-items: center; }

  /* Sidebar pin toggle button — always visible in topbar */
  #sidebarPinBtn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font-size: 15px;
    color: var(--muted); transition: all .15s; margin-right: 4px;
    title: "Fijar / soltar panel";
  }
  #sidebarPinBtn:hover { color: var(--white); }

  /* ── Main ─────────────────────────────────────────────────────────────── */
  .main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Topbar ───────────────────────────────────────────────────────────── */
  .topbar {
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    position: sticky; top: 0; z-index: 50;
  }

  .topbar-title { font-size: 15px; font-weight: 600; color: var(--white); }
  .topbar-sub   { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
  }
  .btn-primary { background: var(--orange); color: #111; }
  .btn-primary:hover { background: #f08c3a; }
  .btn-ghost {
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--white); border-color: rgba(255,255,255,0.15); }

  /* ── Content ──────────────────────────────────────────────────────────── */
  .content { padding: 28px; flex: 1; }

  /* ── KPI row ──────────────────────────────────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .kpi-label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .3px; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 600; letter-spacing: -1px; color: var(--white); }
  .kpi-value.orange { color: var(--orange); }
  .kpi-value.green  { color: var(--green);  }
  .kpi-sub {
    font-size: 11px; color: var(--muted); margin-top: 6px;
    display: flex; align-items: center; gap: 4px;
  }
  .kpi-sub.up   { color: var(--green); }
  .kpi-sub.down { color: var(--red);   }

  /* ── Section header ───────────────────────────────────────────────────── */
  .section-hdr {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--white); }
  .section-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Table ────────────────────────────────────────────────────────────── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .table-filters {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
  }

  .search-box {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px;
  }
  .search-box input {
    background: none; border: none; outline: none;
    color: var(--white); font-size: 12px; font-family: var(--font);
    flex: 1;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-icon { color: var(--muted); font-size: 13px; }

  .filter-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--white); }
  .filter-btn.active { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 10px 18px;
    text-align: left; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--card2); }
  tbody td { padding: 13px 18px; font-size: 13px; color: var(--white); vertical-align: middle; }

  /* ── Badges ───────────────────────────────────────────────────────────── */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .badge-green  { background: var(--green-dim);  color: var(--green);  border: 1px solid var(--green-bdr); }
  .badge-orange { background: var(--orange-dim); color: var(--orange); border: 1px solid var(--orange-bdr); }
  .badge-blue   { background: var(--blue-dim);   color: var(--blue);   border: 1px solid var(--blue-bdr); }
  .badge-red    { background: var(--red-dim);     color: var(--red);    border: 1px solid rgba(231,76,60,.25); }
  .badge-muted  { background: var(--card2);       color: var(--muted);  border: 1px solid var(--border); }
  .badge-yellow { background: var(--yellow-dim);  color: var(--yellow); border: 1px solid rgba(241,196,15,.25); }

  /* ── Upload zone ──────────────────────────────────────────────────────── */
  .upload-zone {
    border: 2px dashed var(--orange-bdr);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    background: var(--orange-dim);
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 16px;
  }
  .upload-zone:hover { border-color: var(--orange); background: rgba(244,123,32,0.15); }
  .upload-icon { font-size: 32px; margin-bottom: 10px; }
  .upload-title { font-size: 14px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
  .upload-sub   { font-size: 12px; color: var(--muted); }
  .upload-link  { color: var(--orange); text-decoration: underline; cursor: pointer; }

  /* ── Grid layouts ─────────────────────────────────────────────────────── */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 24px; }

  /* ── Card ─────────────────────────────────────────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
  }
  .card-title { font-size: 13px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
  .card-sub   { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* ── Route detail panel ───────────────────────────────────────────────── */
  .detail-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 420px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 200;
    transform: translateX(100%);
    transition: transform .2s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .detail-panel.open { transform: translateX(0); }

  .panel-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .panel-close {
    width: 28px; height: 28px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; font-size: 16px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 10px;
  }
  .panel-close:hover { color: var(--white); }
  .panel-body { flex: 1; overflow-y: auto; padding: 20px; }

  .stop-timeline { display: flex; flex-direction: column; gap: 0; }
  .stop-item {
    display: flex; gap: 12px;
    position: relative; padding-bottom: 16px;
  }
  .stop-item:last-child { padding-bottom: 0; }
  .stop-item::before {
    content: '';
    position: absolute; left: 13px; top: 28px; bottom: 0;
    width: 1px; background: var(--border);
  }
  .stop-item:last-child::before { display: none; }
  .stop-dot {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; z-index: 1;
  }
  .stop-dot.done    { background: var(--green);  color: #fff; }
  .stop-dot.active  { background: var(--orange); color: #111; }
  .stop-dot.pending { background: var(--card2);  color: var(--muted); border: 1px solid var(--border); }
  .stop-content { flex: 1; }
  .stop-company { font-size: 13px; font-weight: 500; color: var(--white); margin-bottom: 2px; }
  .stop-address { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .stop-meta    { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── Map placeholder ──────────────────────────────────────────────────── */
  .map-box {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    height: 180px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .map-box::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent, transparent 20px,
      rgba(255,255,255,0.015) 20px, rgba(255,255,255,0.015) 21px
    );
  }
  .map-label { font-size: 12px; color: var(--muted); z-index: 1; }

  /* ── Progress bar ─────────────────────────────────────────────────────── */
  .prog-wrap { margin-bottom: 16px; }
  .prog-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 11px; color: var(--muted); }
  .prog-track { height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .prog-fill  { height: 100%; border-radius: 3px; background: var(--orange); }
  .prog-fill.green { background: var(--green); }

  /* ── Cost row ─────────────────────────────────────────────────────────── */
  .cost-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .cost-row:last-child { border: none; }
  .cost-label { color: var(--muted); }
  .cost-value { font-weight: 500; color: var(--white); }
  .cost-value.orange { color: var(--orange); }
  .cost-value.green  { color: var(--green); }

  /* ── CSV preview table ────────────────────────────────────────────────── */
  .csv-preview {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden; margin-bottom: 16px;
  }
  .csv-preview table { font-size: 11px; font-family: var(--font-mono); }
  .csv-preview thead th { background: var(--card); font-size: 10px; letter-spacing: .3px; }
  .csv-preview tbody td { padding: 8px 14px; color: var(--muted); }
  .csv-preview tbody tr:hover { background: rgba(255,255,255,0.03); }

  /* ── Metric mini ──────────────────────────────────────────────────────── */
  .metric-row {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .metric {
    flex: 1; background: var(--card2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px;
    text-align: center;
  }
  .metric-val { font-size: 18px; font-weight: 600; color: var(--white); }
  .metric-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; }

  /* ── Alert banner ─────────────────────────────────────────────────────── */
  .alert {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: var(--radius);
    margin-bottom: 16px; font-size: 12px;
  }
  .alert-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
  .alert-body { flex: 1; line-height: 1.5; }
  .alert-title { font-weight: 600; margin-bottom: 2px; }
  .alert.warn { background: var(--yellow-dim); border: 1px solid rgba(241,196,15,.25); color: var(--yellow); }
  .alert.info { background: var(--blue-dim);   border: 1px solid var(--blue-bdr);     color: var(--blue); }
  .alert.ok   { background: var(--green-dim);  border: 1px solid var(--green-bdr);    color: var(--green); }

  /* ── Tabs ─────────────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    padding: 10px 18px; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer; border: none; background: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all .15s;
  }
  .tab:hover { color: var(--white); }
  .tab.active { color: var(--orange); border-bottom-color: var(--orange); }

  /* ── Empty state ──────────────────────────────────────────────────────── */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--white); margin-bottom: 6px; }
  .empty-sub   { font-size: 12px; line-height: 1.6; }

  /* ── Overlay ──────────────────────────────────────────────────────────── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 150;
  }
  .overlay.show { display: block; }

  /* ── Scrollbar ────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--card2); border-radius: 3px; }

  /* ── Toast ────────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 13px;
    display: flex; align-items: center; gap: 10px;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all .25s ease;
    max-width: 320px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.info    { border-left: 3px solid var(--orange); }

  #liveMap { width: 100%; height: 320px; border-radius: var(--radius); background: var(--card2); }
  .leaflet-container { background: #1c1c1c !important; border-radius: var(--radius); }
  .leaflet-control-attribution { background: rgba(0,0,0,0.6) !important; color: var(--muted) !important; font-size: 9px !important; }

// ── API layer ─────────────────────────────────────────────────────────────
const API_BASE = '/api/v1'; // ruta relativa — warehouse.html se sirve desde el mismo origen que la API
let authToken = null;
let useRealData = false;

async function apiLogin(email, password) {
  const body = new URLSearchParams({ username: email, password });
  const res = await fetch(`${API_BASE}/auth/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body,
  });
  if (!res.ok) throw new Error('Login fallido');
  const data = await res.json();
  authToken = data.access_token;
  return data;
}

function getActiveCompanyId() {
  try {
    const c = sessionStorage.getItem('muevo_company');
    return c ? JSON.parse(c).id : null;
  } catch { return null; }
}

function getActiveCompanyName() {
  try {
    const c = sessionStorage.getItem('muevo_company');
    return c ? JSON.parse(c).name : null;
  } catch { return null; }
}

function buildHeaders(extra = {}) {
  const h = { 'Authorization': `Bearer ${authToken}`, ...extra };
  const cid = getActiveCompanyId();
  if (cid) h['X-Company-ID'] = cid;
  return h;
}

async function apiGet(path) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: buildHeaders(),
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  return res.json();
}

async function apiPatch(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: 'PATCH',
    headers: buildHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`API error ${res.status}: ${errText}`);
  }
  return res.status === 204 ? null : res.json();
}

async function apiPost(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: 'POST',
    headers: buildHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`API error ${res.status}: ${errText}`);
  }
  return res.json();
}

function batchStatusBadge(status) {
  const map = {
    draft:                ['badge-muted',   '📝 Borrador'],
    approved:             ['badge-blue',    '✅ Aprobado'],
    partially_accepted:   ['badge-yellow',  '⚡ Parcialmente aceptado'],
    fully_accepted:       ['badge-green',   '✅ Aceptado'],
    partially_completed:  ['badge-orange',  '🔄 En curso'],
    completed:            ['badge-green',   '✓ Completado'],
    closed_with_incidents:['badge-red',     '⚠️ Con incidencias'],
    cancelled:            ['badge-red',     '✕ Cancelado'],
    expired:              ['badge-muted',   '⏱ Expirado'],
  };
  const [cls, label] = map[status] || ['badge-muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function batchRouteStats(batch) {
  const routes = batch.routes || [];
  const total     = routes.length;
  const completed = routes.filter(r => r.status === 'completed').length;
  const active    = routes.filter(r => r.status === 'in_progress').length;
  const pending   = routes.filter(r => ['draft','published','scheduled','assigned'].includes(r.status)).length;
  const rejected  = routes.filter(r => r.status === 'cancelled').length;
  return { total, completed, active, pending, rejected };
}

function statusBadge(status) {
  const map = {
    in_progress: ['badge-orange','En curso'],
    scheduled:   ['badge-blue',  'Programada'],
    completed:   ['badge-green', 'Completada'],
    cancelled:   ['badge-red',   'Cancelada'],
    pending:     ['badge-muted', 'Pendiente'],
  };
  const [cls, label] = map[status] || ['badge-muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function modeBadge(mode) {
  const map = {
    'Mensajería': ['badge-blue',   '📦'],
    'Empleados':  ['badge-green',  '👥'],
    'Logística':  ['badge-yellow', '🏭'],
  };
  const [cls, icon] = map[mode] || ['badge-muted','📋'];
  return `<span class="badge ${cls}">${icon} ${mode}</span>`;
}

function stopDot(status) {
  if (status === 'done')    return 'done';
  if (status === 'active')  return 'active';
  return 'pending';
}

function stopIcon(status) {
  if (status === 'done')    return '✓';
  if (status === 'active')  return '⬤';
  return '○';
}

function pct(a, b) { return b > 0 ? Math.round(a/b*100) : 0; }
function fmt$(n)    { return '$' + n.toFixed(2); }

  document.getElementById('topbarSub').textContent   = sub;

  const renders = {
    dashboard:      renderDashboard,
    rutas:          renderRutas,
    upload:         renderUpload,
    tracking:       renderTracking,
    pod:            renderPoD,
    transportistas: renderTransportistas,
    facturacion:    renderFacturacion,
    reportes:       renderReportes,
    usuarios:       renderUsuarios,
    clientes:       renderClientes,
    incidencias:    renderIncidencias,
  };
  document.getElementById('content').innerHTML = (renders[view] || (() => ''))();
  if (view === 'usuarios')    setTimeout(loadHoldingUsers, 0);
  if (view === 'clientes')    setTimeout(loadClientes, 0);
  if (view === 'incidencias') setTimeout(loadIncidencias, 0);
  csvStep = 0;

  if (view === 'tracking') {
    setTimeout(initLiveTracking, 0); // esperar a que el DOM tenga #liveMap

    disconnectTrackingWS();

            const servicioLabel = b.service_type ? (ST_LABELS[b.service_type] || b.service_type) : '—';
            const vehiculoLabel = b.vehicle_type  ? (VT_LABELS[b.vehicle_type]  || b.vehicle_type)  : '—';

            return `

                        onclick="event.stopPropagation();changeBatchStatus('${b.id}','approved')">✓ Aprobar</button>

                      <button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;color:var(--red,#D85A30)"

}

function renderDashboardCharts(batches) {
  const isDark      = document.documentElement.getAttribute('data-theme') !== 'light';
  const borderColor = isDark ? '#1C1C1C' : '#fff';
  const mutedColor  = isDark ? '#666' : '#aaa';
  const labelColor  = isDark ? '#777' : '#666';

  const LOTE_STATES = [
    { key:'draft',               label:'Borrador',   color:'#888780' },
    { key:'approved',            label:'Aprobado',   color:'#2E86DE' },
    { key:'partially_accepted',  label:'P.acept.',   color:'#F47B20' },
    { key:'fully_accepted',      label:'Aceptado',   color:'#F39C12' },
    { key:'partially_completed', label:'En curso',   color:'#E67E22' },
    { key:'completed',           label:'Completado', color:'#27AE60' },
    { key:'closed_with_incidents','label':'Incid.',  color:'#D85A30' },
    { key:'cancelled',           label:'Cancelado',  color:'#555'    },
  ].map(s => ({ ...s, count: batches.filter(b=>b.status===s.key).length }))
   .filter(s => s.count > 0);

  const RUTA_STATES = [
    { key:'draft',             label:'Borrad.',   color:'#888780' },
    { key:'published',         label:'Public.',   color:'#2E86DE' },
    { key:'assigned',          label:'Asignada',  color:'#3498DB' },
    { key:'in_progress',       label:'En curso',  color:'#F47B20' },
    { key:'completed',         label:'Complet.',  color:'#27AE60' },
    { key:'incident_reported', label:'Incid.',    color:'#D85A30' },
    { key:'cancelled',         label:'Cancelad.', color:'#555'    },
  ].map(s => ({
    ...s,
    count: batches.reduce((sum,b) => sum + (b.routes||[]).filter(r=>r.status===s.key).length, 0)
  })).filter(s => s.count > 0);

  // ── Torta: estados de lotes ───────────────────────────────────────────────
  const pie = document.getElementById('pieChartLotes');
  if (pie && LOTE_STATES.length > 0) {
    const ctx = pie.getContext('2d');
    const W = pie.width, H = pie.height;
    const cx = W/2, cy = H/2;
    const r  = Math.min(cx, cy) - 6;
    const tot = LOTE_STATES.reduce((s,d)=>s+d.count,0);
    ctx.clearRect(0,0,W,H);
    let angle = -Math.PI/2;
    LOTE_STATES.forEach(d => {
      const slice = (d.count/tot)*2*Math.PI;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,angle,angle+slice);
      ctx.closePath();
      ctx.fillStyle=d.color; ctx.fill();
      ctx.strokeStyle=borderColor; ctx.lineWidth=2; ctx.stroke();
      angle+=slice;
    });
    // HTML legend
    const legEl = document.getElementById('legendLotes');
    if (legEl) {
      legEl.innerHTML = LOTE_STATES.map(d => `
        <span style="display:flex;align-items:center;gap:3px;font-size:10px;color:${mutedColor}">
          <span style="width:8px;height:8px;border-radius:2px;background:${d.color};flex-shrink:0;display:inline-block"></span>
          ${d.label} <b style="color:${d.color}">${d.count}</b>
        </span>`).join('');
    }
  }

  // ── Barras: estados de rutas ──────────────────────────────────────────────
  const bar = document.getElementById('barChartRutas');
  if (bar && RUTA_STATES.length > 0) {
    const ctx=bar.getContext('2d');
    const W=bar.width, H=bar.height;
    ctx.clearRect(0,0,W,H);
    const maxVal=Math.max(...RUTA_STATES.map(d=>d.count),1);
    const padL=4,padB=22,padT=10,padR=4;
    const chartH=H-padB-padT, chartW=W-padL-padR;
    const n=RUTA_STATES.length;
    const barW=Math.max(8,Math.floor(chartW/n)-4);
    const spacing=(chartW-barW*n)/(n+1);
    ctx.strokeStyle='#333'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(padL,H-padB); ctx.lineTo(W-padR,H-padB); ctx.stroke();
    RUTA_STATES.forEach((d,i) => {
      const bH=(d.count/maxVal)*chartH;
      const bX=padL+spacing+i*(barW+spacing);
      const bY=padT+chartH-bH;
      const rad=2;
      ctx.fillStyle=d.color;
      ctx.beginPath();
      ctx.moveTo(bX+rad,bY); ctx.lineTo(bX+barW-rad,bY);
      ctx.quadraticCurveTo(bX+barW,bY,bX+barW,bY+rad);
      ctx.lineTo(bX+barW,H-padB); ctx.lineTo(bX,H-padB);
      ctx.lineTo(bX,bY+rad); ctx.quadraticCurveTo(bX,bY,bX+rad,bY);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=mutedColor; ctx.font='9px system-ui'; ctx.textAlign='center';
      if(d.count>0) ctx.fillText(d.count,bX+barW/2,bY-2);
    });
    // HTML legend
    const legEl = document.getElementById('legendRutas');
    if (legEl) {
      legEl.innerHTML = RUTA_STATES.map(d => `
        <span style="display:flex;align-items:center;gap:3px;font-size:10px;color:${mutedColor}">
          <span style="width:8px;height:8px;border-radius:2px;background:${d.color};flex-shrink:0;display:inline-block"></span>
          ${d.label} <b style="color:${d.color}">${d.count}</b>
        </span>`).join('');
    }
  }
}

        id:             route.id,
        numero:         route.route_number || batchId.substring(0,8).toUpperCase(),

function renderBatchDetailChart(routes) {
  const isDark      = document.documentElement.getAttribute('data-theme') !== 'light';
  const borderColor = isDark ? '#1C1C1C' : '#fff';
  const mutedColor  = isDark ? '#666' : '#aaa';

  const RUTA_STATES = [
    { key:'draft',             label:'Borrad.',   color:'#888780' },
    { key:'published',         label:'Public.',   color:'#2E86DE' },
    { key:'assigned',          label:'Asignada',  color:'#3498DB' },
    { key:'scheduled',         label:'Progr.',    color:'#3498DB' },
    { key:'in_progress',       label:'En curso',  color:'#F47B20' },
    { key:'completed',         label:'Complet.',  color:'#27AE60' },
    { key:'incident_reported', label:'Incid.',    color:'#D85A30' },
    { key:'cancelled',         label:'Cancelad.', color:'#555'    },
  ].map(s => ({
    ...s,
    count: routes.filter(r => r.status === s.key).length
  })).filter(s => s.count > 0);

  const bar = document.getElementById('barChartBatchDetail');
  if (!bar || RUTA_STATES.length === 0) return;

  const ctx = bar.getContext('2d');
  const W = bar.width, H = bar.height;
  ctx.clearRect(0, 0, W, H);
  const maxVal = Math.max(...RUTA_STATES.map(d => d.count), 1);
  const padL=4, padB=6, padT=8, padR=4;
  const chartH = H - padB - padT;
  const chartW = W - padL - padR;
  const n = RUTA_STATES.length;
  const barW = Math.max(8, Math.floor(chartW / n) - 4);
  const spacing = (chartW - barW * n) / (n + 1);

  ctx.strokeStyle = '#333'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();

  RUTA_STATES.forEach((d, i) => {
    const bH = (d.count / maxVal) * chartH;
    const bX = padL + spacing + i * (barW + spacing);
    const bY = padT + chartH - bH;
    const rad = 2;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.moveTo(bX+rad, bY); ctx.lineTo(bX+barW-rad, bY);
    ctx.quadraticCurveTo(bX+barW, bY, bX+barW, bY+rad);
    ctx.lineTo(bX+barW, H-padB); ctx.lineTo(bX, H-padB);
    ctx.lineTo(bX, bY+rad); ctx.quadraticCurveTo(bX, bY, bX+rad, bY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = mutedColor; ctx.font = '9px system-ui'; ctx.textAlign = 'center';
    if (d.count > 0) ctx.fillText(d.count, bX+barW/2, bY-2);
  });

  const legEl = document.getElementById('legendBatchDetail');
  if (legEl) {
    legEl.innerHTML = RUTA_STATES.map(d => `
      <span style="display:flex;align-items:center;gap:3px;font-size:9px;color:${mutedColor}">
        <span style="width:7px;height:7px;border-radius:2px;background:${d.color};flex-shrink:0;display:inline-block"></span>
        ${d.label} <b style="color:${d.color}">${d.count}</b>
      </span>`).join('');
  }
}

  // Mock stop coordinates per route for demo
  const mockCoords = {
    'R-2024-001': [[40.7589,-73.9851],[40.7536,-73.9775],[40.7599,-73.9807],[40.7527,-73.9742]],
    'R-2024-002': [[28.5469,-81.3705],[28.5415,-81.3793],[28.5398,-81.3770]],
    'R-2024-003': [[40.7580,-73.8855],[40.6951,-73.8165],[40.7282,-73.8601],[40.6892,-73.8550],[40.6961,-73.7946],[40.6931,-73.8092]],
    'R-2024-004': [[40.8448,-73.8648],[40.8186,-73.8926],[40.8379,-73.9257],[40.7957,-73.9319]],
    'R-2024-005': [[40.6892,-73.9901],[40.6917,-73.9882],[40.7069,-74.0090]],
    'R-2024-006': [[40.7145,-74.0140],[40.7571,-73.9771],[40.7268,-74.0040],[40.7606,-73.9745],[40.7590,-73.9855]],
  };

  const routes  = batch.routes || [];
  const allCoords = routes.flatMap((r,ri) => (mockCoords[r.id]||[]).map(c=>c));
  if (!allCoords.length) return;

  const avgLat = allCoords.reduce((s,c)=>s+c[0],0)/allCoords.length;
  const avgLng = allCoords.reduce((s,c)=>s+c[1],0)/allCoords.length;

  const map = L.map('batchMapContainer').setView([avgLat, avgLng], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO', maxZoom: 19
  }).addTo(map);

  routes.forEach((r, ri) => {
    const color  = routeColors[ri % routeColors.length];
    const coords = mockCoords[r.id] || [];
    if (!coords.length) return;

    // Draw route line
    L.polyline(coords, { color, weight: 2.5, opacity: 0.8 }).addTo(map);

    // Draw stop markers
    coords.forEach((c, si) => {
      L.circleMarker(c, {
        radius: 7, fillColor: color, color: '#fff',
        weight: 2, opacity: 1, fillOpacity: 0.9
      }).addTo(map)
        .bindPopup(`<b>${r.num} — Parada ${si+1}</b><br>${r.stops[si]?.company || ''}`);
    });

    // Route label at centroid
    const cLat = coords.reduce((s,c)=>s+c[0],0)/coords.length;
    const cLng = coords.reduce((s,c)=>s+c[1],0)/coords.length;
    L.marker([cLat, cLng], {
      icon: L.divIcon({
        className: '',
        html: `<div style="background:${color};color:#111;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)">${r.num}</div>`,
        iconAnchor: [20, 10],
      })
    }).addTo(map);
  });
}

function switchStopTab(tab) {
  ['panelCsv','panelManual','panelScan'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  const panel = document.getElementById('panel' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (panel) panel.style.display = '';

  ['tabCsv','tabManual','tabScan'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const isActive = id === 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1);
    el.style.borderBottomColor = isActive ? 'var(--orange)' : 'transparent';
    el.style.color             = isActive ? 'var(--orange)' : 'var(--muted)';
    el.style.fontWeight        = isActive ? '600' : '400';
  });

  if (tab === 'scan') setTimeout(() => document.getElementById('scanInput')?.focus(), 100);
}

function parseCsvFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const lines = e.target.result.trim().split('\n');
    const header = lines[0].split(',').map(h => h.trim().toLowerCase());
    const col = (name) => header.indexOf(name);
    let added = 0;
    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(',');
      const get = (name) => (vals[col(name)] || '').trim();
      if (!get('destino') || !get('lat') || !get('lng')) continue;
      batchStops.push({
        destino: get('destino'), direccion: get('direccion'),
        lat: parseFloat(get('lat')) || 0, lng: parseFloat(get('lng')) || 0,
        peso_lbs: parseFloat(get('peso_lbs')) || 0,
        volumen_ft3: parseFloat(get('volumen_ft3')) || 0,
        hora_limite: get('hora_limite') || '17:00',
        contacto: get('contacto'), telefono: get('telefono'),
        codigo_cliente: get('codigo_cliente'),
        codigo_paquete: get('codigo_paquete'),
        codigo_barras: get('codigo_barras'),
        codigo_qr: get('codigo_qr'),
        notas: get('notas'),
        valor_declarado: parseFloat(get('valor_declarado')) || 0,
        source: 'csv',
      });
      added++;
    }
    showToast(`${added} paradas importadas del CSV`, 'success');
    document.getElementById('content').innerHTML = renderBatchPlanner();
  };
  reader.readAsText(file);
}

async function batchRunPlan() {
  if (batchStops.length < 2) return;
  showToast('Calculando agrupamiento óptimo...', 'info');

  if (!useRealData) {
    // Simulación demo
    batchPlan = simulatePlan(batchStops, batchConfig);
    batchStep = 2;
    document.getElementById('content').innerHTML = renderBatchPlanner();
    return;
  }

  try {
    const res = await apiPost('/warehouse/batches/plan', {
      vehicle_type:        batchConfig.vehicle_type,
      service_type:        batchConfig.service_type,
      peso_max_lbs:        batchConfig.peso_max,
      volumen_max_ft3:     batchConfig.vol_max,
      max_stops_per_route: batchConfig.max_stops,
      paradas:             batchStops,
    });
    batchPlan = res;
    batchStep = 2;
    document.getElementById('content').innerHTML = renderBatchPlanner();
  } catch (e) {
    showToast('Error al calcular: ' + e.message, 'warn');
  }
}

function simulatePlan(stops, cfg) {
  // Agrupamiento simple para demo (sin sklearn)
  const routeColors = ['#F47B20','#3498DB','#2ECC71','#E74C3C','#9B59B6','#F1C40F'];
  const k = Math.max(1, Math.ceil(stops.length / cfg.max_stops));
  const groups = Array.from({length: k}, () => []);
  stops.forEach((s, i) => groups[i % k].push(s));
  return {
    total_paradas: stops.length, total_rutas: k,
    vehicle_type: cfg.vehicle_type,
    rutas: groups.map((g, idx) => ({
      route_index: idx, color: routeColors[idx % routeColors.length],
      earliest_limit: g.reduce((min, s) => s.hora_limite < min ? s.hora_limite : min, '23:59'),
      total_peso_lbs: g.reduce((s, p) => s + p.peso_lbs, 0).toFixed(1),
      total_vol_ft3:  g.reduce((s, p) => s + p.volumen_ft3, 0).toFixed(1),
      stop_count: g.length,
      centroid_lat: g.reduce((s, p) => s + p.lat, 0) / g.length,
      centroid_lng: g.reduce((s, p) => s + p.lng, 0) / g.length,
      stops: g,
    })),
  };
}

// Render el mapa de la vista previa cuando el DOM esté listo
function renderPlanMap() {
  const container = document.getElementById('planMapContainer');
  if (!container || typeof L === 'undefined' || !batchPlan) return;
  const map = L.map('planMapContainer').setView(
    [batchPlan.rutas[0].centroid_lat, batchPlan.rutas[0].centroid_lng], 11
  );
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO', maxZoom: 19
  }).addTo(map);

  batchPlan.rutas.forEach(r => {
    const line_coords = r.stops.map(s => [s.lat, s.lng]);
    L.polyline(line_coords, { color: r.color, weight: 2, opacity: 0.7 }).addTo(map);
    r.stops.forEach((s, idx) => {
      L.circleMarker([s.lat, s.lng], {
        radius: 7, fillColor: r.color, color: '#fff',
        weight: 2, opacity: 1, fillOpacity: 0.9

async function batchConfirm() {
  const btn = document.getElementById('btnConfirm');
  btn.disabled = true;
  btn.textContent = 'Creando...';

  if (!useRealData) {
    showToast(`Lote "${batchConfig.nombre}" creado en demo (${batchPlan.total_rutas} rutas)`, 'success');
    batchStep = 0; batchStops = []; batchPlan = null; batchConfig = { nombre:'', fecha:'', vehicle_type:'furgoneta', service_type:'mensajeria', client_id:'', peso_max:1800, vol_max:200, max_stops:10 };
    document.getElementById('content').innerHTML = renderBatchPlanner();
    return;
  }

  try {
    const res = await apiPost('/warehouse/batches/confirm', {
      nombre:          batchConfig.nombre,
      fecha:           batchConfig.fecha,
      vehicle_type:    batchConfig.vehicle_type,
      service_type:    batchConfig.service_type,
      client_id:       batchConfig.client_id || null,
      scheduled_start: document.getElementById('bSchedStart').value,
      scheduled_end:   document.getElementById('bSchedEnd').value,
      grupos:          batchPlan.rutas,
    });
    showToast(`Lote creado: ${res.routes} rutas en la DB`, 'success');
    batchStep = 0; batchStops = []; batchPlan = null;
    batchConfig = { nombre:'', fecha:'', vehicle_type:'furgoneta', service_type:'mensajeria', client_id:'', peso_max:1800, vol_max:200, max_stops:10 };
    await loadRealData();
    showView('rutas');
  } catch (e) {
    document.getElementById('confirmError').textContent = 'Error: ' + e.message;
    document.getElementById('confirmError').style.display = 'block';
    btn.disabled = false;
    btn.textContent = `✓ Crear lote`;
  }
}

// ── Detail Panel ──────────────────────────────────────────────────────────
function openRoute(id, fromBatchId) {
  const r = getActiveRoutes().find(x => x.id === id);
  if (!r) return;

  const pctDone = pct(r.stops_done, r.stops_total);
  const fromView = currentView;

  // Botón volver: si venimos de un lote específico, volvemos a su detalle
  const backAction = fromBatchId
    ? `openBatch('${fromBatchId}')`
    : `showView('${fromView}')`;

  // Estados de las paradas
  const stopsPending   = (r.stops||[]).filter(s => s.status==='pending').length;
  const stopsActive    = (r.stops||[]).filter(s => s.status==='active'||s.status==='in_progress').length;
  const stopsCompleted = (r.stops||[]).filter(s => s.status==='done'||s.status==='completed').length;
  const stopsFailed    = (r.stops||[]).filter(s => s.status==='failed').length;

  // Costo de paradas pendientes (proporcional al peso o distribuido equitativamente)
  const totalStops = r.stops_total || (r.stops||[]).length || 1;
  const costPerStop = (r.gross || 0) / totalStops;
  const pendingCost  = costPerStop * (stopsPending + stopsActive);

  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <button class="btn btn-ghost" onclick="${backAction}" style="padding:6px 12px">← Volver</button>
      <div>
        <div style="font-size:18px;font-weight:600;color:var(--white)">${r.num} — ${r.title}</div>
        <div style="font-size:13px;color:var(--muted)">${r.transportista}</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:6px">
        ${statusBadge(r.status)} ${modeBadge(r.mode)}
      </div>
    </div>

    <!-- Bloques de resumen -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">

      <!-- Bloque 1: Estados de las paradas -->
      <div class="kpi-card">
        <div class="kpi-label">Estado de las paradas</div>
        <div style="display:flex;align-items:baseline;gap:8px;margin:6px 0">
          <div class="kpi-value">${totalStops}</div>
          <div style="font-size:12px;color:var(--muted)">parada${totalStops!==1?'s':''} en total</div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px">
          ${stopsPending > 0   ? `<span style="font-size:11px;color:var(--muted)">${stopsPending} pendiente${stopsPending!==1?'s':''}</span>` : ''}
          ${stopsActive > 0    ? `<span style="font-size:11px;color:var(--orange)">${stopsActive} en curso</span>` : ''}
          ${stopsCompleted > 0 ? `<span style="font-size:11px;color:var(--green)">${stopsCompleted} entregada${stopsCompleted!==1?'s':''}</span>` : ''}
          ${stopsFailed > 0    ? `<span style="font-size:11px;color:var(--red,#D85A30)">${stopsFailed} fallida${stopsFailed!==1?'s':''}</span>` : ''}
        </div>
      </div>

      <!-- Bloque 2: Resumen financiero -->
      <div class="kpi-card">
        <div class="kpi-label">Resumen financiero</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin:6px 0">
          <div>
            <div class="kpi-value orange" style="font-size:22px">${fmt$(r.gross)}</div>
            <div style="font-size:11px;color:var(--muted)">Costo total</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:18px;font-weight:700;color:var(--muted)">${fmt$(pendingCost)}</div>
            <div style="font-size:11px;color:var(--muted)">Paradas pendientes</div>
          </div>
        </div>
      </div>

    </div>

    <div class="grid2" style="margin-bottom:16px">
      <!-- Columna izquierda: progreso + transportista -->
      <div>
        <div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">
          ${statusBadge(r.status)} ${modeBadge(r.mode)}
          <span class="badge badge-muted">📅 ${r.date}</span>
          <span class="badge badge-muted">🕐 ${r.time}</span>
        </div>

        <div class="prog-wrap" style="margin-bottom:16px">
          <div class="prog-label">
            <span>Progreso general</span>

function initRouteDetailMap(r) {
  const containerId = `routeMapDetail_${r.id}`;
  const container   = document.getElementById(containerId);
  if (!container) return;

  // Filtrar paradas con coordenadas válidas
  const stopsWithCoords = (r.stops || []).filter(s => s.lat && s.lng);

  if (!stopsWithCoords.length) {
    container.innerHTML = '<div style="font-size:28px">🗺</div><div style="font-size:12px;color:var(--muted)">Sin coordenadas disponibles</div>';
    return;
  }

  // Limpiar placeholder y crear div limpio para Leaflet
  container.innerHTML = '';
  container.style.display = 'block';

  const ROUTE_COLORS = ['#F47B20','#3498DB','#2ECC71','#E74C3C','#9B59B6','#F1C40F'];
  const color = ROUTE_COLORS[0];

  try {
    if (window._routeDetailMap) {
      window._routeDetailMap.remove();
      window._routeDetailMap = null;
    }

    const map = L.map(containerId, { zoomControl: true, attributionControl: false });
    window._routeDetailMap = map;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const latLngs = [];
    stopsWithCoords.forEach((s, idx) => {
      const ll = [s.lat, s.lng];
      latLngs.push(ll);

      const icon = L.divIcon({
        className: '',
        html: `<div style="background:${color};color:#111;width:22px;height:22px;border-radius:50%;
                display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
                border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${idx + 1}</div>`,
        iconSize: [22, 22], iconAnchor: [11, 11],
      });

      L.marker(ll, { icon })
        .addTo(map)
        .bindPopup(`<b>#${idx + 1} — ${s.company || ''}</b><br>${s.address || ''}`);
    });

    // Dibujar línea de ruta
    if (latLngs.length > 1) {
      L.polyline(latLngs, { color, weight: 2.5, opacity: 0.8, dashArray: '6 4' }).addTo(map);
    }

    map.fitBounds(L.latLngBounds(latLngs), { padding: [20, 20] });

  } catch(e) {
    console.error('Error inicializando mapa de ruta:', e);
    container.innerHTML = '<div style="font-size:28px">🗺</div><div style="font-size:12px;color:var(--muted)">Error cargando mapa</div>';
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg, type='info') {
  const el = document.getElementById('toast');
  const icons = { success:'✅', info:'ℹ️', warn:'⚠️' };
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}


// ── Theme (dark / light) ───────────────────────────────────────────────────
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('muevo_theme', next);
  applyTheme(next);
}

// Aplicar tema guardado lo antes posible (evita flash de tema incorrecto al cargar)
(function initTheme() {
  const saved = localStorage.getItem('muevo_theme') || 'dark';
  applyTheme(saved);
})();


// ── Sidebar pin / float ───────────────────────────────────────────────────
function applySidebarMode(mode) {
  // mode: 'fixed' | 'floating'
  const pinBtn = document.getElementById('sidebarPinBtn');
  if (mode === 'floating') {
    document.body.classList.add('sidebar-floating');
    if (pinBtn) { pinBtn.textContent = '📌'; pinBtn.title = 'Fijar panel'; pinBtn.style.opacity = '.5'; }
  } else {
    document.body.classList.remove('sidebar-floating');
    closeSidebar();
    if (pinBtn) { pinBtn.textContent = '📍'; pinBtn.title = 'Soltar panel'; pinBtn.style.opacity = '1'; }
  }
}

function toggleSidebarMode() {
  const isFloating = document.body.classList.contains('sidebar-floating');
  const next = isFloating ? 'fixed' : 'floating';
  localStorage.setItem('muevo_sidebar', next);
  applySidebarMode(next);
}

function openSidebar() {
  const sidebar = document.getElementById('mainSidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (sidebar) sidebar.classList.add('open');
  if (overlay) overlay.classList.add('visible');

}

(function initSidebar() {

    company_id:c.id, can_view:document.getElementById('view_'+c.id)?.checked??true,
    can_operate:document.getElementById('op_'+c.id)?.checked??false,
    can_invoice:document.getElementById('inv_'+c.id)?.checked??false, is_admin:false,
  }));
}

function openNewUserModal() {
  document.getElementById('stopModalTitle').textContent='Nuevo usuario';
  document.getElementById('stopModalSub').textContent='Crear acceso al portal warehouse';
  document.getElementById('stopModalBody').innerHTML=userFormHTML(null);
  document.getElementById('stopModalOverlay').style.display='block';
  document.getElementById('stopModal').style.display='block';
}

function openEditUserModal(huid) {
  const u=holdingUsers.find(x=>x.holding_user_id===huid);
  if(!u)return;
  document.getElementById('stopModalTitle').textContent='Editar usuario';
  document.getElementById('stopModalSub').textContent=u.email;
  document.getElementById('stopModalBody').innerHTML=userFormHTML(u);
  document.getElementById('stopModalOverlay').style.display='block';
  document.getElementById('stopModal').style.display='block';
}

async function submitNewUser() {
  const name=document.getElementById('uName')?.value.trim();
  const email=document.getElementById('uEmail')?.value.trim();
  const password=document.getElementById('uPassword')?.value;
  const role=document.getElementById('uRole')?.value;
  const errEl=document.getElementById('userFormError');
  errEl.style.display='none';
  if(!name||!email||!password){errEl.textContent='Completá nombre, email y contraseña.';errEl.style.display='block';return;}
  const company_access=collectCompanyAccess();
  if(!company_access.length){errEl.textContent='Asigná acceso a al menos una compañía.';errEl.style.display='block';return;}
  if(!useRealData){
    holdingUsers.push({holding_user_id:'u'+Date.now(),full_name:name,email,role,is_super_admin:false,is_active:true,companies:company_access.map(a=>({...a,name:holdingCompanies.find(c=>c.id===a.company_id)?.name||''}))});
    closeStopModal();showToast('Usuario creado (demo)','success');
    document.getElementById('content').innerHTML=renderUsuarios();loadHoldingUsers();return;
  }
  try{
    await apiPost('/holding/users',{full_name:name,email,password,role,company_access});
    closeStopModal();showToast('Usuario creado','success');
    document.getElementById('content').innerHTML=renderUsuarios();loadHoldingUsers();
  }catch(e){errEl.textContent='Error: '+e.message;errEl.style.display='block';}
}

async function submitEditUser(huid) {
  const role=document.getElementById('uRole')?.value;
  const active=document.getElementById('uActive')?.value==='true';
  const company_access=collectCompanyAccess();
  const errEl=document.getElementById('userFormError');errEl.style.display='none';
  if(!useRealData){
    const u=holdingUsers.find(x=>x.holding_user_id===huid);
    if(u){u.role=role;u.is_active=active;u.companies=company_access.map(a=>({...a,name:holdingCompanies.find(c=>c.id===a.company_id)?.name||''}));}
    closeStopModal();showToast('Usuario actualizado (demo)','success');
    document.getElementById('content').innerHTML=renderUsuarios();loadHoldingUsers();return;
  }
  try{
    await apiPatch('/holding/users/'+huid,{role,is_active:active,company_access});
    closeStopModal();showToast('Usuario actualizado','success');
    document.getElementById('content').innerHTML=renderUsuarios();loadHoldingUsers();
  }catch(e){errEl.textContent='Error: '+e.message;errEl.style.display='block';}
}

async function deactivateUser(huid,name) {
  if(!confirm('¿Modificar el acceso de '+name+'?'))return;
  const u=holdingUsers.find(x=>x.holding_user_id===huid);
  const newState=u?!u.is_active:false;
  if(!useRealData){
    if(u)u.is_active=newState;
    showToast('Estado actualizado (demo)','info');
    document.getElementById('content').innerHTML=renderUsuarios();loadHoldingUsers();return;
  }
  try{
    await apiPatch('/holding/users/'+huid,{is_active:newState});
    showToast('Estado actualizado','info');
    document.getElementById('content').innerHTML=renderUsuarios();loadHoldingUsers();
  }catch(e){showToast('Error: '+e.message,'warn');}
}


// ── Cambio manual de estado de lote ──────────────────────────────────────────
async function changeBatchStatus(batchId, newStatus) {
  const batch = getActiveBatches().find(b => b.id === batchId);
  if (!batch) return;

  const labels = { approved: 'aprobar', cancelled: 'cancelar' };
  const label  = labels[newStatus] || newStatus;

  if (!confirm(`¿Seguro que querés ${label} el lote ${batch.numero}?`)) return;

  if (!useRealData) {
    batch.status = newStatus;
    batch.fecha_estado = new Date().toISOString().split('T')[0];
    showToast(
      newStatus === 'approved' ? `Lote ${batch.numero} aprobado` : `Lote ${batch.numero} cancelado`,
      newStatus === 'cancelled' ? 'info' : 'success'
    );
    document.getElementById('content').innerHTML = renderDashboard();
    return;
  }

  try {
    await apiPost(`/warehouse/batches/${batchId}/status`, { status: newStatus });
    showToast(
      newStatus === 'approved' ? `Lote aprobado` : `Lote cancelado`,
      newStatus === 'cancelled' ? 'info' : 'success'
    );
    await loadRealData();
    document.getElementById('content').innerHTML = renderDashboard();
  } catch (e) {
    showToast('Error: ' + e.message, 'warn');
  }
}

    try {
      batches = await apiGet('/warehouse/clients/' + clienteId + '/batches');

  if (!batches.length) {

      </div>
      <div style="text-align:right">
        ${batchStatusBadge(b.status)}
        <div style="color:var(--orange);font-weight:600;font-size:13px;margin-top:4px">$${(b.total_cost||0).toFixed(2)}</div>

let inventoryItems = [];  // [{raw_code, destino, direccion, lat, lng, peso_lbs_unit, vol_unit, cantidad, ...}]

function processScan() {
  const input = document.getElementById('scanInput');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) return;
  input.value = '';
  input.focus();

  if (useRealData) {
    // Llamar al backend para parsear y deduplicar
    apiPost('/warehouse/inventory/scan', { raw_code: raw })
      .then(res => {
        showToast(
          res.action === 'incremented'
            ? `📦 ${raw.substring(0,20)} — ${res.quantity} cajas`
            : `✅ Código escaneado`,
          'success'
        );
        // Refresh inventory from API
        apiGet('/warehouse/inventory?status=pending')
          .then(items => { inventoryItems = items; renderInventoryTable(); });
      })
      .catch(e => showToast('Error: ' + e.message, 'warn'));
    return;
  }

  // Demo: parsear localmente
  const parsed = parseScanLocal(raw);
  const existing = inventoryItems.find(i => i.raw_code === raw);
  if (existing) {
    existing.quantity += 1;
    existing.peso_lbs_total    = existing.peso_lbs_unit    * existing.quantity;
    existing.volumen_ft3_total = existing.volumen_ft3_unit * existing.quantity;
    showToast(`📦 ${raw.substring(0,20)} — ${existing.quantity} cajas`, 'info');
  } else {
    inventoryItems.unshift({
      id: 'inv-' + Date.now(),
      raw_code: raw, ...parsed,
      quantity: 1,
      peso_lbs_total:    parsed.peso_lbs_unit,
      volumen_ft3_total: parsed.volumen_ft3_unit,
      status: 'pending',
    });
    showToast('✅ Código escaneado', 'success');
  }
  renderInventoryTable();
}

function parseScanLocal(raw) {
  // JSON
  if (raw.startsWith('{')) {
    try {
      const d = JSON.parse(raw);
      return {
        codigo_cliente: d.cliente || d.codigo_cliente || '',
        destino: d.destino || '', direccion: d.dir || d.direccion || '',
        lat: d.lat || 0, lng: d.lng || 0,
        peso_lbs_unit: d.peso || 0, volumen_ft3_unit: d.vol || 0,
        contacto: d.contacto || '', telefono: d.tel || d.telefono || '',
      };
    } catch(e) {}
  }
  // Pipe
  if (raw.includes('|')) {
    const p = raw.split('|');
    return {
      codigo_cliente: p[0]||'', destino: p[1]||'', direccion: p[2]||'',
      lat: parseFloat(p[3])||0, lng: parseFloat(p[4])||0,
      peso_lbs_unit: parseFloat(p[5])||0, volumen_ft3_unit: parseFloat(p[6])||0,
      contacto: p[7]||'', telefono: p[8]||'',
    };
  }
  // ID solo
  return { codigo_cliente:'', destino:'', direccion:'', lat:0, lng:0,
           peso_lbs_unit:0, volumen_ft3_unit:0, contacto:'', telefono:'' };
}

function inventoryToStops() {
  if (inventoryItems.length === 0) return;
  let added = 0;
  inventoryItems.forEach(item => {
    if (!item.lat || !item.lng) {
      showToast(`⚠️ ${item.raw_code.substring(0,20)} sin coordenadas — completá lat/lng`, 'warn');
      return;
    }
    batchStops.push({
      destino:         item.destino      || item.raw_code,
      direccion:       item.direccion    || '',
      lat:             item.lat,
      lng:             item.lng,
      peso_lbs:        item.peso_lbs_total    || 0,
      volumen_ft3:     item.volumen_ft3_total || 0,
      hora_limite:     '17:00',
      codigo_cliente:  item.codigo_cliente   || '',
      contacto:        item.contacto         || '',
      telefono:        item.telefono         || '',
      codigo_paquete:  item.raw_code,
      codigo_barras:   item.raw_code,
      codigo_qr:       '',
      notas:           `${item.quantity} caja${item.quantity!==1?'s':''}${item.notas?' — '+item.notas:''}`,
      valor_declarado: 0,
      source:          'scan',
    });
    added++;
  });

  if (added > 0) {
    inventoryItems = inventoryItems.filter(i => !i.lat || !i.lng); // keep items without coords
    showToast(`${added} ítem${added!==1?'s':''} agregado${added!==1?'s':''} como paradas`, 'success');
    switchStopTab('csv');  // volver al tab CSV para ver la tabla de paradas
    refreshStopsList();
  }
}

let csvClientesRows = [];

function parseClientesCsv(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const lines  = e.target.result.trim().split('\n');
    const header = lines[0].split(',').map(h => h.trim().toLowerCase());
    const col    = name => header.indexOf(name);
    csvClientesRows = [];

    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(',');
      const get  = name => (vals[col(name)]||'').trim();
      if (!get('nombre') || !get('email')) continue;
      csvClientesRows.push({
        name:           get('nombre'),
        email:          get('email'),
        phone:          get('telefono')       || null,
        codigo_cliente: get('codigo_cliente') || null,
        direccion:      get('direccion')      || null,
        ciudad:         get('ciudad')         || null,
        estado:         get('estado')         || null,
      });
    }

    const preview = document.getElementById('csvImportPreview');
    const btn     = document.getElementById('btnConfirmImport');
    if (!csvClientesRows.length) {
      preview.innerHTML = '<div style="color:var(--muted)">Sin filas válidas en el CSV</div>';
      btn.style.display = 'none';
      return;
    }

    preview.innerHTML = `
      <div style="font-size:13px;margin-bottom:10px;color:var(--white)">${csvClientesRows.length} cliente${csvClientesRows.length!==1?'s':''} encontrados en el archivo</div>
      <div style="max-height:200px;overflow-y:auto;font-size:12px">
        <table style="width:100%">
          <thead><tr>
            <th style="padding:4px 8px;color:var(--muted);text-align:left">Nombre</th>
            <th style="padding:4px 8px;color:var(--muted);text-align:left">Email</th>
            <th style="padding:4px 8px;color:var(--muted);text-align:left">Código</th>
          </tr></thead>
          <tbody>
            ${csvClientesRows.slice(0,5).map(r => `
              <tr style="border-bottom:1px solid var(--border)">
                <td style="padding:4px 8px">${r.name}</td>
                <td style="padding:4px 8px;color:var(--muted)">${r.email}</td>
                <td style="padding:4px 8px;color:var(--orange);font-family:var(--font-mono)">${r.codigo_cliente||'—'}</td>
              </tr>
            `).join('')}
            ${csvClientesRows.length > 5 ? `<tr><td colspan="3" style="padding:4px 8px;color:var(--muted)">... y ${csvClientesRows.length-5} más</td></tr>` : ''}
          </tbody>
        </table>
      </div>
    `;
    btn.style.display = 'block';
    btn.onclick = submitImportClientes;
  };
  reader.readAsText(file);
}

async function submitImportClientes() {
  const errEl = document.getElementById('csvImportError');
  errEl.style.display = 'none';

  if (!useRealData) {
    csvClientesRows.forEach(r => {
      const ex = clientesList.find(c => c.email === r.email);
      if (ex) Object.assign(ex, r);
      else clientesList.push({ id:'cl'+Date.now()+Math.random(), ...r, is_active:true,
        notify_batch_status:true, notify_stop_status:false, notify_delivery:true, notify_incident:true,
        metrics:{total_batches:0, completed_batches:0, total_cost:0} });
    });
    closeStopModal();
    showToast(`${csvClientesRows.length} clientes importados (demo)`, 'success');
    renderClientesTable();
    return;
  }

  try {
    const res = await apiPost('/warehouse/clients/import-csv', { rows: csvClientesRows });
    closeStopModal();
    showToast(`Importados: ${res.created} nuevos · ${res.updated} actualizados`, 'success');
    clientesList = await apiGet('/warehouse/clients');
    renderClientesTable();
  } catch(e) {
    errEl.textContent = 'Error: ' + e.message;
    errEl.style.display = 'block';
  }
}

async function changeIncidenciaStatus(id, newStatus, label) {
  const notes = document.getElementById('resolutionNotes')?.value.trim() || '—';
  if ((newStatus === 'resolved' || newStatus === 'unresolved') && !notes.trim()) {
    showToast('Ingresá notas de resolución', 'warn'); return;
  }
  if (!useRealData) {
    const inc = incidenciasList.find(i => i.id === id);
    if (inc) { inc.status = newStatus; inc.resolution_notes = notes; }
    closeStopModal(); showToast(`Incidencia marcada: ${label}`, 'success');
    renderIncidenciasBody(); return;
  }
  try {
    const updated = await apiPatch(`/warehouse/incidents/${id}/status`, { status: newStatus, resolution_notes: notes });
    const idx = incidenciasList.findIndex(i => i.id === id);
    if (idx !== -1) incidenciasList[idx] = updated;
    closeStopModal(); showToast(`Incidencia marcada: ${label}`, 'success');
    renderIncidenciasBody();
  } catch(e) { showToast('Error: ' + e.message, 'warn'); }
}

async function submitNewIncidencia() {
  const tipo  = document.getElementById('incTipo')?.value;
  const title = document.getElementById('incTitulo')?.value.trim();
  const desc  = document.getElementById('incDesc')?.value.trim();
  const ruta  = document.getElementById('incRuta')?.value.trim();
  const errEl = document.getElementById('incError');

  if (!tipo || !title || !desc) {
    errEl.textContent = 'Tipo, título y descripción son obligatorios.';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';

  // Buscar route_id por route_number si se ingresó
  let routeId = null;
  if (ruta && useRealData) {
    try {
      const routes = await apiGet('/warehouse/routes');
      const found  = routes.find(r => r.route_number === ruta);
      routeId = found?.id || null;
    } catch(e) {}
  }

  if (!useRealData) {
    const t = incidentTypesList.find(t => t.id === tipo);
    incidenciasList.unshift({
      id: 'i'+Date.now(), type_id: tipo, type_name: t?.name, type_code: t?.code,
      severity: t?.severity, status:'open', title, description: desc,
      reporter_name:'Carlos Rodriguez', reporter_role:'warehouse_admin',
      route_number: ruta||null, route_id: null, evidence_urls:[], reported_at: new Date().toISOString(),
    });
    closeStopModal(); showToast('Incidencia reportada', 'success');
    renderIncidenciasBody(); return;
  }

  try {
    const inc = await apiPost('/warehouse/incidents', {
      incident_type_id: tipo, title, description: desc,
      route_header_id: routeId, evidence_urls: [],
    });
    incidenciasList.unshift(inc);
    closeStopModal(); showToast('Incidencia reportada', 'success');
    renderIncidenciasBody();
  } catch(e) { errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block'; }
}
