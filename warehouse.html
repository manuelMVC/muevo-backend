// ── Inventario de escaneo ─────────────────────────────────────────────────────
let inventoryItems = [];  // [{raw_code, destino, direccion, lat, lng, peso_lbs_unit, vol_unit, cantidad, ...}]

function processScan() {
  const input = document.getElementById('scanInput');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) return;
  input.value = '';
  input.focus();

  if (useRealData) {
    // Llamar al backend para parsear y deduplicar
    apiPost('/warehouse/inventory/scan', { raw_code: raw })
      .then(res => {
        showToast(
          res.action === 'incremented'
            ? `📦 ${raw.substring(0,20)} — ${res.quantity} cajas`
            : `✅ Código escaneado`,
          'success'
        );
        // Refresh inventory from API
        apiGet('/warehouse/inventory?status=pending')
          .then(items => { inventoryItems = items; renderInventoryTable(); });
      })
      .catch(e => showToast('Error: ' + e.message, 'warn'));
    return;
  }

  // Demo: parsear localmente
  const parsed = parseScanLocal(raw);
  const existing = inventoryItems.find(i => i.raw_code === raw);
  if (existing) {
    existing.quantity += 1;
    existing.peso_lbs_total    = existing.peso_lbs_unit    * existing.quantity;
    existing.volumen_ft3_total = existing.volumen_ft3_unit * existing.quantity;
    showToast(`📦 ${raw.substring(0,20)} — ${existing.quantity} cajas`, 'info');
  } else {
    inventoryItems.unshift({
      id: 'inv-' + Date.now(),
      raw_code: raw, ...parsed,
      quantity: 1,
      peso_lbs_total:    parsed.peso_lbs_unit,
      volumen_ft3_total: parsed.volumen_ft3_unit,
      status: 'pending',
    });
    showToast('✅ Código escaneado', 'success');
  }
  renderInventoryTable();
}

function parseScanLocal(raw) {
  // JSON
  if (raw.startsWith('{')) {
    try {
      const d = JSON.parse(raw);
      return {
        codigo_cliente: d.cliente || d.codigo_cliente || '',
        destino: d.destino || '', direccion: d.dir || d.direccion || '',
        lat: d.lat || 0, lng: d.lng || 0,
        peso_lbs_unit: d.peso || 0, volumen_ft3_unit: d.vol || 0,
        contacto: d.contacto || '', telefono: d.tel || d.telefono || '',
      };
    } catch(e) {}
  }
  // Pipe
  if (raw.includes('|')) {
    const p = raw.split('|');
    return {
      codigo_cliente: p[0]||'', destino: p[1]||'', direccion: p[2]||'',
      lat: parseFloat(p[3])||0, lng: parseFloat(p[4])||0,
      peso_lbs_unit: parseFloat(p[5])||0, volumen_ft3_unit: parseFloat(p[6])||0,
      contacto: p[7]||'', telefono: p[8]||'',
    };
  }
  // ID solo
  return { codigo_cliente:'', destino:'', direccion:'', lat:0, lng:0,
           peso_lbs_unit:0, volumen_ft3_unit:0, contacto:'', telefono:'' };
}

function renderInventoryTable() {
  const container = document.getElementById('inventoryTable');
  const actions   = document.getElementById('inventoryActions');
  if (!container) return;

  if (inventoryItems.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:24px;color:var(--muted)">
        <div style="font-size:28px;margin-bottom:8px">📦</div>
        <div>Escaneá una caja para comenzar el inventario</div>
      </div>`;
    if (actions) actions.style.display = 'none';
    return;
  }

  if (actions) actions.style.display = 'flex';

  const totalCajas = inventoryItems.reduce((s,i) => s + i.quantity, 0);
  const totalPeso  = inventoryItems.reduce((s,i) => s + (i.peso_lbs_total||0), 0);

  container.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:13px;font-weight:600;color:var(--white)">
        ${inventoryItems.length} código${inventoryItems.length!==1?'s':''} · ${totalCajas} caja${totalCajas!==1?'s':''} · ${totalPeso.toFixed(1)} lbs
      </div>
    </div>
    <div style="max-height:320px;overflow-y:auto">
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:6px 8px;color:var(--muted)">Código</th>
            <th style="text-align:left;padding:6px 8px;color:var(--muted)">Destino</th>
            <th style="text-align:left;padding:6px 8px;color:var(--muted)">Cliente</th>
            <th style="text-align:center;padding:6px 8px;color:var(--muted)">Cajas</th>
            <th style="text-align:right;padding:6px 8px;color:var(--muted)">Peso total</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${inventoryItems.map((item, idx) => `
            <tr style="border-bottom:1px solid var(--border)">
              <td style="padding:6px 8px;font-family:var(--font-mono);font-size:11px;color:var(--orange)">
                ${item.raw_code.substring(0,24)}${item.raw_code.length>24?'…':''}
              </td>
              <td style="padding:6px 8px;color:var(--white)">
                ${item.destino || '<span style="color:var(--muted)">Sin datos</span>'}
                ${item.direccion ? `<div style="font-size:10px;color:var(--muted)">${item.direccion.substring(0,30)}</div>` : ''}
              </td>
              <td style="padding:6px 8px;color:var(--muted)">${item.codigo_cliente||'—'}</td>
              <td style="padding:6px 8px;text-align:center">
                <span style="font-weight:700;font-size:14px;color:${item.quantity>1?'var(--orange)':'var(--white)'}">${item.quantity}</span>
              </td>
              <td style="padding:6px 8px;text-align:right;color:var(--muted)">${(item.peso_lbs_total||0).toFixed(1)} lbs</td>
              <td style="padding:6px 8px">
                <button onclick="removeInventoryItem(${idx})"
                  style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px">✕</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function removeInventoryItem(idx) {
  inventoryItems.splice(idx, 1);

}

function clearInventory() {

function inventoryToStops() {
  if (inventoryItems.length === 0) return;
  let added = 0;
  inventoryItems.forEach(item => {
    if (!item.lat || !item.lng) {
      showToast(`⚠️ ${item.raw_code.substring(0,20)} sin coordenadas — completá lat/lng`, 'warn');
      return;
    }
    batchStops.push({
      destino:         item.destino      || item.raw_code,
      direccion:       item.direccion    || '',
      lat:             item.lat,
      lng:             item.lng,
      peso_lbs:        item.peso_lbs_total    || 0,
      volumen_ft3:     item.volumen_ft3_total || 0,
      hora_limite:     '17:00',
      codigo_cliente:  item.codigo_cliente   || '',
      contacto:        item.contacto         || '',
      telefono:        item.telefono         || '',
      codigo_paquete:  item.raw_code,
      codigo_barras:   item.raw_code,
      codigo_qr:       '',
      notas:           `${item.quantity} caja${item.quantity!==1?'s':''}${item.notas?' — '+item.notas:''}`,
      valor_declarado: 0,
      source:          'scan',
    });
    added++;
  });

  if (added > 0) {
    inventoryItems = inventoryItems.filter(i => !i.lat || !i.lng); // keep items without coords
    showToast(`${added} ítem${added!==1?'s':''} agregado${added!==1?'s':''} como paradas`, 'success');
    switchStopTab('csv');  // volver al tab CSV para ver la tabla de paradas
    refreshStopsList();
  }
}

  document.getElementById('stopModal').style.display = 'block';
}

let csvClientesRows = [];

function parseClientesCsv(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const lines  = e.target.result.trim().split('\n');
    const header = lines[0].split(',').map(h => h.trim().toLowerCase());
    const col    = name => header.indexOf(name);
    csvClientesRows = [];

    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(',');
      const get  = name => (vals[col(name)]||'').trim();
      if (!get('nombre') || !get('email')) continue;
      csvClientesRows.push({
        name:           get('nombre'),
        email:          get('email'),
        phone:          get('telefono')       || null,
        codigo_cliente: get('codigo_cliente') || null,
        direccion:      get('direccion')      || null,
        ciudad:         get('ciudad')         || null,
        estado:         get('estado')         || null,
      });
    }

    const preview = document.getElementById('csvImportPreview');
    const btn     = document.getElementById('btnConfirmImport');
    if (!csvClientesRows.length) {
      preview.innerHTML = '<div style="color:var(--muted)">Sin filas válidas en el CSV</div>';
      btn.style.display = 'none';
      return;
    }

    preview.innerHTML = `
      <div style="font-size:13px;margin-bottom:10px;color:var(--white)">${csvClientesRows.length} cliente${csvClientesRows.length!==1?'s':''} encontrados en el archivo</div>
      <div style="max-height:200px;overflow-y:auto;font-size:12px">
        <table style="width:100%">
          <thead><tr>
            <th style="padding:4px 8px;color:var(--muted);text-align:left">Nombre</th>
            <th style="padding:4px 8px;color:var(--muted);text-align:left">Email</th>
            <th style="padding:4px 8px;color:var(--muted);text-align:left">Código</th>
          </tr></thead>
          <tbody>
            ${csvClientesRows.slice(0,5).map(r => `
              <tr style="border-bottom:1px solid var(--border)">
                <td style="padding:4px 8px">${r.name}</td>
                <td style="padding:4px 8px;color:var(--muted)">${r.email}</td>
                <td style="padding:4px 8px;color:var(--orange);font-family:var(--font-mono)">${r.codigo_cliente||'—'}</td>
              </tr>
            `).join('')}
            ${csvClientesRows.length > 5 ? `<tr><td colspan="3" style="padding:4px 8px;color:var(--muted)">... y ${csvClientesRows.length-5} más</td></tr>` : ''}
          </tbody>
        </table>
      </div>
    `;
    btn.style.display = 'block';
    btn.onclick = submitImportClientes;
  };
  reader.readAsText(file);
}

async function submitImportClientes() {
  const errEl = document.getElementById('csvImportError');
  errEl.style.display = 'none';

  if (!useRealData) {
    csvClientesRows.forEach(r => {
      const ex = clientesList.find(c => c.email === r.email);
      if (ex) Object.assign(ex, r);
      else clientesList.push({ id:'cl'+Date.now()+Math.random(), ...r, is_active:true,
        notify_batch_status:true, notify_stop_status:false, notify_delivery:true, notify_incident:true,
        metrics:{total_batches:0, completed_batches:0, total_cost:0} });
    });
    closeStopModal();
    showToast(`${csvClientesRows.length} clientes importados (demo)`, 'success');
    renderClientesTable();
    return;
  }

  try {
    const res = await apiPost('/warehouse/clients/import-csv', { rows: csvClientesRows });
    closeStopModal();
    showToast(`Importados: ${res.created} nuevos · ${res.updated} actualizados`, 'success');
    clientesList = await apiGet('/warehouse/clients');
    renderClientesTable();
  } catch(e) {
    errEl.textContent = 'Error: ' + e.message;
    errEl.style.display = 'block';
  }
}

async function changeIncidenciaStatus(id, newStatus, label) {
  const notes = document.getElementById('resolutionNotes')?.value.trim() || '—';
  if ((newStatus === 'resolved' || newStatus === 'unresolved') && !notes.trim()) {
    showToast('Ingresá notas de resolución', 'warn'); return;
  }
  if (!useRealData) {
    const inc = incidenciasList.find(i => i.id === id);
    if (inc) { inc.status = newStatus; inc.resolution_notes = notes; }
    closeStopModal(); showToast(`Incidencia marcada: ${label}`, 'success');
    renderIncidenciasBody(); return;
  }
  try {
    const updated = await apiPatch(`/warehouse/incidents/${id}/status`, { status: newStatus, resolution_notes: notes });
    const idx = incidenciasList.findIndex(i => i.id === id);
    if (idx !== -1) incidenciasList[idx] = updated;
    closeStopModal(); showToast(`Incidencia marcada: ${label}`, 'success');
    renderIncidenciasBody();
  } catch(e) { showToast('Error: ' + e.message, 'warn'); }
}

async function submitNewIncidencia() {
  const tipo  = document.getElementById('incTipo')?.value;
  const title = document.getElementById('incTitulo')?.value.trim();
  const desc  = document.getElementById('incDesc')?.value.trim();
  const ruta  = document.getElementById('incRuta')?.value.trim();
  const errEl = document.getElementById('incError');

  if (!tipo || !title || !desc) {
    errEl.textContent = 'Tipo, título y descripción son obligatorios.';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';

  // Buscar route_id por route_number si se ingresó
  let routeId = null;
  if (ruta && useRealData) {
    try {
      const routes = await apiGet('/warehouse/routes');
      const found  = routes.find(r => r.route_number === ruta);
      routeId = found?.id || null;
    } catch(e) {}
  }

  if (!useRealData) {
    const t = incidentTypesList.find(t => t.id === tipo);
    incidenciasList.unshift({
      id: 'i'+Date.now(), type_id: tipo, type_name: t?.name, type_code: t?.code,
      severity: t?.severity, status:'open', title, description: desc,
      reporter_name:'Carlos Rodriguez', reporter_role:'warehouse_admin',
      route_number: ruta||null, route_id: null, evidence_urls:[], reported_at: new Date().toISOString(),
    });
    closeStopModal(); showToast('Incidencia reportada', 'success');
    renderIncidenciasBody(); return;
  }

  try {
    const inc = await apiPost('/warehouse/incidents', {
      incident_type_id: tipo, title, description: desc,
      route_header_id: routeId, evidence_urls: [],
    });
    incidenciasList.unshift(inc);
    closeStopModal(); showToast('Incidencia reportada', 'success');
    renderIncidenciasBody();
  } catch(e) { errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block'; }
}

function openEditTipoModal(id) {
  const t = incidentTypesList.find(x => x.id === id);

  document.getElementById('stopModalSub').textContent   = t.code;

function collectTipoData() {
  return {
    code:                document.getElementById('tipoCode')?.value.trim(),
    name:                document.getElementById('tipoName')?.value.trim(),
    severity:            document.getElementById('tipoSeverity')?.value,
    affects_route_status:document.getElementById('tipoAfecta')?.checked ?? false,
  };
}

async function submitNewTipo() {
  const data  = collectTipoData();
  const errEl = document.getElementById('tipoError');
  if (!data.code || !data.name) { errEl.textContent='Código y nombre son obligatorios'; errEl.style.display='block'; return; }
  if (!useRealData) {
    incidentTypesList.push({ id:'t'+Date.now(), ...data, is_active:true });
    closeStopModal(); showToast('Tipo creado (demo)', 'success'); renderIncidenciasBody(); return;
  }
  try {
    const t = await apiPost('/admin/incident-types', data);
    incidentTypesList.push(t);
    closeStopModal(); showToast('Tipo creado', 'success'); renderIncidenciasBody();
  } catch(e) { errEl.textContent='Error: '+e.message; errEl.style.display='block'; }
}

async function submitEditTipo(id) {
  const data  = collectTipoData();
  const errEl = document.getElementById('tipoError');
  if (!data.name) { errEl.textContent='El nombre es obligatorio'; errEl.style.display='block'; return; }
  if (!useRealData) {
    const t = incidentTypesList.find(x => x.id === id);
    if (t) Object.assign(t, data);
    closeStopModal(); showToast('Tipo actualizado (demo)', 'success'); renderIncidenciasBody(); return;
  }
  try {
    const t = await apiPatch(`/admin/incident-types/${id}`, data);
    const idx = incidentTypesList.findIndex(x => x.id === id);
    if (idx !== -1) incidentTypesList[idx] = t;
    closeStopModal(); showToast('Tipo actualizado', 'success'); renderIncidenciasBody();
  } catch(e) { errEl.textContent='Error: '+e.message; errEl.style.display='block'; }
}

async function toggleTipo(id, activate) {
  if (!useRealData) {
    const t = incidentTypesList.find(x => x.id === id);
    if (t) t.is_active = activate;
    showToast(activate ? 'Tipo activado' : 'Tipo desactivado', 'success');
    renderIncidenciasBody(); return;
  }
  try {
    const t = await apiPatch(`/admin/incident-types/${id}`, { is_active: activate });
    const idx = incidentTypesList.findIndex(x => x.id === id);
    if (idx !== -1) incidentTypesList[idx] = t;
    showToast(activate ? 'Tipo activado' : 'Tipo desactivado', 'success');
    renderIncidenciasBody();
  } catch(e) { showToast('Error: '+e.message, 'warn'); }
}

      <button class="btn btn-ghost" style="width:100%;font-size:13px;margin-bottom:10px" onclick="addItemToNewRecepcion()">+ Agregar ítem a la lista</button>
      <div id="nrItemsList">${renderNewRecepcionItemsList()}</div>
    </div>

    <div id="nrError" style="color:var(--red,#D85A30);font-size:13px;display:none;margin-bottom:8px"></div>
    <button id="nrSubmitBtn" class="btn btn-primary" style="width:100%" onclick="submitNewRecepcion()">Crear recepción</button>
  `;
}

function renderNewRecepcionItemsList() {
  if (newRecepcionState.items.length === 0) {
    return `<div style="text-align:center;padding:16px;color:var(--muted);font-size:12px">Todavía no agregaste ningún ítem esperado</div>`;
  }
  return `
    <div style="display:flex;flex-direction:column;gap:4px">
      ${newRecepcionState.items.map((it,i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px">
          <span style="color:var(--white)">${it.descripcion || it.codigo_cliente || 'Ítem sin descripción'}</span>
          <span style="color:var(--muted)">x${it.expected_quantity} · ${it.peso_lbs_unit} lbs</span>
          <button onclick="removeNewRecepcionItem(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer">✕</button>
        </div>
      `).join('')}
    </div>
  `;
}

function addItemToNewRecepcion() {
  const codigo      = document.getElementById('nrCodigo').value.trim();
  const descripcion = document.getElementById('nrDescripcion').value.trim();
  const cantidad    = parseInt(document.getElementById('nrCantidad').value) || 0;
  const peso        = parseFloat(document.getElementById('nrPeso').value) || 0;

  if (!codigo && !descripcion) { showToast('Ingresá al menos un código o descripción', 'warn'); return; }
  if (cantidad < 1)             { showToast('La cantidad debe ser al menos 1', 'warn'); return; }

  newRecepcionState.items.push({
    codigo_cliente: codigo, descripcion, expected_quantity: cantidad,
    peso_lbs_unit: peso, volumen_ft3_unit: 0,
  });
  ['nrCodigo','nrDescripcion'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('nrCantidad').value = 1;
  document.getElementById('nrPeso').value = '';
  document.getElementById('nrItemsList').innerHTML = renderNewRecepcionItemsList();
}

function removeNewRecepcionItem(i) {
  newRecepcionState.items.splice(i, 1);
  document.getElementById('nrItemsList').innerHTML = renderNewRecepcionItemsList();
}

async function loadUndeliveredStopsForReturn() {
  const routeId = document.getElementById('nrOriginRoute')?.value;
  if (!routeId) { showToast('Elegí una ruta primero', 'warn'); return; }
  if (!useRealData) { showToast('Cargar paradas requiere estar conectado a datos reales', 'info'); return; }

  try {
    const route = await apiGet(`/warehouse/routes/${routeId}`);
    const undelivered = (route.stops || []).filter(s => s.status !== 'completed');
    if (undelivered.length === 0) {
      showToast('Esta ruta no tiene paradas pendientes/no entregadas', 'info'); return;
    }
    undelivered.forEach(s => {
      const firstItem = (s.items && s.items[0]) || {};
      newRecepcionState.items.push({
        codigo_cliente: firstItem.package_code || '',
        descripcion: s.company_name || s.address || `Parada #${s.sequence_order}`,
        expected_quantity: s.packages_count || 1,
        peso_lbs_unit: s.weight_lbs || 0,
        volumen_ft3_unit: s.volume_ft3 || 0,
      });
    });
    document.getElementById('nrItemsList').innerHTML = renderNewRecepcionItemsList();
    showToast(`${undelivered.length} parada${undelivered.length!==1?'s':''} agregada${undelivered.length!==1?'s':''} como ítems esperados`, 'success');
  } catch (e) { showToast('Error: ' + e.message, 'warn'); }
}

async function submitNewRecepcion() {
  const errEl = document.getElementById('nrError');
  errEl.style.display = 'none';

  const sourceType    = document.getElementById('nrSourceType').value;
  const reference      = document.getElementById('nrReference')?.value.trim() || '';
  const expectedAt     = document.getElementById('nrExpectedAt').value;
  const originRouteId  = sourceType === 'return' ? (document.getElementById('nrOriginRoute')?.value || null) : null;

  if (newRecepcionState.items.length === 0) {
    errEl.textContent = 'Agregá al menos un ítem esperado'; errEl.style.display = 'block'; return;
  }

  if (!useRealData) {
    showToast('Crear recepciones requiere estar conectado a datos reales', 'info');
    closeStopModal(); return;
  }

  const btn = document.getElementById('nrSubmitBtn');
  btn.disabled = true; btn.textContent = 'Creando...';
  try {
    await apiPost('/warehouse/receptions', {
      source_type: sourceType,
      reference,
      origin_route_id: originRouteId,
      expected_at: expectedAt ? `${expectedAt}T00:00:00` : null,
      items: newRecepcionState.items,
    });
    closeStopModal();
    showToast('Recepción creada', 'success');
    await loadRecepciones();
  } catch (e) {
    errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Crear recepción';
  }
}

// ── Detalle de recepción / check-in ──────────────────────────────────────────
async function openRecepcionDetail(id) {
  recepcionDetailId = id;
  document.getElementById('stopModalTitle').textContent = 'Recepción';
  document.getElementById('stopModalSub').textContent   = '';
  document.getElementById('stopModalBody').innerHTML = `<div style="text-align:center;padding:24px;color:var(--muted)">⏳ Cargando...</div>`;
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';

  let reception;
  if (useRealData) {
    try {
      reception = await apiGet(`/warehouse/receptions/${id}`);
    } catch (e) {
      document.getElementById('stopModalBody').innerHTML = `<div style="color:var(--red,#D85A30)">Error: ${e.message}</div>`;
      return;
    }
  } else {
    const base = recepcionesList.find(r => r.id === id);
    reception = base ? { ...base, items: Array.from({ length: base.summary.expected_items }, (_,i) => ({
      id: `${id}-item${i}`, codigo_cliente: `DEMO-${i+1}`, descripcion: `Ítem demo ${i+1}`,
      expected_quantity: 1, received_quantity: i < base.summary.received ? 1 : 0,
      peso_lbs_unit: 1, volumen_ft3_unit: 0.2,
      status: i < base.summary.received ? 'received'
            : i < base.summary.received + base.summary.damaged ? 'damaged'
            : i < base.summary.received + base.summary.damaged + base.summary.missing ? 'missing'
            : 'pending',
      inventory_item_id: null, notas: null,
    })) } : null;
  }
  renderRecepcionDetailModal(reception);
}

function renderRecepcionDetailModal(r) {
  if (!r) { document.getElementById('stopModalBody').innerHTML = `<div style="color:var(--muted)">Recepción no encontrada</div>`; return; }
  const st = REC_STATUS_CFG[r.status] || { label: r.status, color: 'var(--muted)' };

  document.getElementById('stopModalTitle').textContent = `📥 ${r.reception_number}`;
  document.getElementById('stopModalSub').textContent   = r.reference || (r.source_type==='return' ? 'Devolución' : 'Recepción de proveedor');

  document.getElementById('stopModalBody').innerHTML = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <span style="font-size:12px;font-weight:600;color:${st.color}">${st.label}</span>
      <span style="font-size:12px;color:var(--muted)">${r.source_type === 'return' ? '↩ Devolución' : '📦 Proveedor'}</span>
      ${r.expected_at ? `<span style="font-size:12px;color:var(--muted)">Esperada: ${r.expected_at.split('T')[0]}</span>` : ''}
    </div>

    <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Ítems del manifiesto</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
      ${(r.items||[]).map(it => renderRecepcionItemRow(r, it)).join('')}
    </div>

    ${r.status !== 'completed' ? `
      <button class="btn btn-primary" style="width:100%" onclick="confirmCompleteRecepcion('${r.id}')">
        ✓ Cerrar recepción${r.summary?.pending ? ` (${r.summary.pending} ítem${r.summary.pending!==1?'s':''} sin llegar quedará${r.summary.pending!==1?'n':''} como faltante)` : ''}
      </button>
    ` : `
      <div style="text-align:center;padding:8px;color:var(--muted);font-size:12px">Recepción cerrada${r.received_at ? ' el ' + r.received_at.split('T')[0] : ''}</div>
    `}
  `;
}

function renderRecepcionItemRow(r, it) {
  const cfg = REC_ITEM_STATUS_CFG[it.status] || { label: it.status, color: 'var(--muted)' };
  const canCheckIn = r.status !== 'completed' && it.status === 'pending';
  return `
    <div style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:${canCheckIn?'8px':'0'}">
        <div>
          <div style="font-size:13px;font-weight:600">${it.descripcion || it.codigo_cliente || 'Ítem sin descripción'}</div>
          <div style="font-size:11px;color:var(--muted)">${it.codigo_cliente ? it.codigo_cliente+' · ' : ''}esperado x${it.expected_quantity} · ${it.peso_lbs_unit} lbs</div>
        </div>
        <span style="font-size:12px;font-weight:600;color:${cfg.color};white-space:nowrap">${cfg.label}${it.status!=='pending' ? ` (x${it.received_quantity})` : ''}</span>
      </div>
      ${canCheckIn ? `
        <div style="display:flex;gap:6px;align-items:center">
          <input id="ci-qty-${it.id}" type="number" min="0" value="${it.expected_quantity}"
            style="width:70px;padding:5px 7px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:12px">
          <button class="btn btn-ghost" style="flex:1;font-size:12px;color:var(--green,#4CAF50)" onclick="checkInRecepcionItem('${r.id}','${it.id}','received')">✓ Recibido OK</button>
          <button class="btn btn-ghost" style="flex:1;font-size:12px;color:var(--red,#D85A30)" onclick="checkInRecepcionItem('${r.id}','${it.id}','damaged')">⚠ Dañado</button>
        </div>
      ` : it.notas ? `<div style="font-size:11px;color:var(--muted);margin-top:4px">Nota: ${it.notas}</div>` : ''}
    </div>
  `;
}

async function checkInRecepcionItem(receptionId, itemId, status) {
  const qtyEl = document.getElementById(`ci-qty-${itemId}`);
  const qty = parseInt(qtyEl?.value);
  if (isNaN(qty) || qty < 0) { showToast('Cantidad inválida', 'warn'); return; }

  if (!useRealData) { showToast('El check-in requiere estar conectado a datos reales', 'info'); return; }

  try {
    await apiPatch(`/warehouse/receptions/${receptionId}/items/${itemId}/check-in`, { received_quantity: qty, status });
    const reception = await apiGet(`/warehouse/receptions/${receptionId}`);
    const idx = recepcionesList.findIndex(x => x.id === receptionId);
    if (idx !== -1) recepcionesList[idx] = reception;
    renderRecepcionDetailModal(reception);
    showToast(status === 'received' ? 'Ítem recibido — sumado al inventario disponible' : 'Ítem marcado como dañado', 'success');
  } catch (e) { showToast('Error: ' + e.message, 'warn'); }
}

async function confirmCompleteRecepcion(id) {
  if (!confirm('¿Cerrar esta recepción? Los ítems que no llegaron quedarán marcados como faltantes. Esta acción no se puede deshacer.')) return;
  if (!useRealData) { showToast('Cerrar recepciones requiere estar conectado a datos reales', 'info'); return; }

  try {
    const reception = await apiPost(`/warehouse/receptions/${id}/complete`, {});
    renderRecepcionDetailModal(reception);
    await loadRecepciones();
    showToast('Recepción cerrada', 'success');
  } catch (e) { showToast('Error: ' + e.message, 'warn'); }
}

// ── Catálogo de mensajes ─────────────────────────────────────────────────────
let mensajesList    = [];
let mensajeSearch   = '';
let mensajeFilter   = 'activos';   // activos | todos
let editMensajeState = null;

function extractTemplateVariables(text) {
  const matches = (text || '').match(/\{(\w+)\}/g) || [];
  return [...new Set(matches.map(m => m.slice(1, -1)))].sort();
}

function renderMacroPreview(macroText, values) {
  return (macroText || '').replace(/\{(\w+)\}/g, (full, key) =>
    (values[key] !== undefined && values[key] !== '') ? values[key] : full
  );
}

function renderMensajes() {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div>
        <div class="section-title">Catálogo de mensajes</div>
        <div class="section-sub">Mensajes estándar — código, descripción y macro con variables</div>
      </div>
      <button class="btn btn-primary" onclick="openNewMensajeModal()">+ Nuevo mensaje</button>
    </div>
    <div id="mensajesBody">
      <div style="text-align:center;padding:48px;color:var(--muted)">
        <div style="font-size:32px;margin-bottom:8px">⏳</div>
        <div>Cargando...</div>
      </div>
    </div>
  `;
}

async function loadMensajes() {
  if (!useRealData) {
    mensajesList = [
      { id: 'm1', code: 'BATCH_APPROVED', description: 'Lote aprobado',
        macro_text: 'Hola {cliente}, tu lote {numero_lote} fue aprobado y saldrá pronto.',
        variables: ['cliente','numero_lote'], is_active: true },
      { id: 'm2', code: 'DELIVERY_CONFIRMED', description: 'Entrega confirmada',
        macro_text: 'Tu pedido {codigo_cliente} fue entregado a las {hora}.',
        variables: ['codigo_cliente','hora'], is_active: true },
      { id: 'm3', code: 'INCIDENT_REPORTED', description: 'Incidencia reportada (borrador)',
        macro_text: 'Se reportó una incidencia en la ruta {numero_ruta}: {titulo}.',
        variables: ['numero_ruta','titulo'], is_active: false },
    ];
  } else {
    try {
      mensajesList = await apiGet('/messages?all=true');
    } catch (e) { showToast('Error cargando mensajes: ' + e.message, 'warn'); return; }
  }
  renderMensajesBody();
}

function renderMensajesBody() {
  const body = document.getElementById('mensajesBody');
  if (!body) return;

  let filtered = mensajeFilter === 'activos' ? mensajesList.filter(m => m.is_active) : mensajesList;
  const q = mensajeSearch.toLowerCase();
  if (q) filtered = filtered.filter(m =>
    m.code.toLowerCase().includes(q) || m.description.toLowerCase().includes(q)
  );

  body.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <button onclick="mensajeFilter='activos';renderMensajesBody()"
        class="btn ${mensajeFilter==='activos'?'btn-primary':'btn-ghost'}" style="font-size:12px;padding:5px 12px">
        Activos (${mensajesList.filter(m=>m.is_active).length})
      </button>
      <button onclick="mensajeFilter='todos';renderMensajesBody()"
        class="btn ${mensajeFilter==='todos'?'btn-primary':'btn-ghost'}" style="font-size:12px;padding:5px 12px">
        Todos (${mensajesList.length})
      </button>
      <input type="text" placeholder="Buscar por código o descripción..." value="${mensajeSearch}"
        oninput="mensajeSearch=this.value;renderMensajesBody()"
        style="margin-left:auto;padding:6px 12px;background:var(--card2);border:1px solid var(--border);
               border-radius:8px;color:var(--white);font-size:13px;width:260px">
    </div>

    ${filtered.length === 0 ? `
      <div class="card" style="text-align:center;padding:48px;color:var(--muted)">
        <div style="font-size:40px;margin-bottom:12px">💬</div>
        <div>${q || mensajeFilter!=='todos' ? 'Sin resultados para este filtro' : 'Sin mensajes registrados'}</div>
      </div>
    ` : `
      <div class="table-wrap" style="overflow-x:auto">
        <table style="min-width:860px">
          <thead>
            <tr>
              <th>Código</th>
              <th>Descripción</th>
              <th>Macro</th>
              <th>Variables</th>
              <th style="text-align:center">Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(m => `
              <tr style="border-bottom:1px solid var(--border)">
                <td style="padding:10px 8px;font-family:var(--font-mono);color:var(--orange);font-size:13px">${m.code}</td>
                <td style="padding:10px 8px;font-size:13px">${m.description}</td>
                <td style="padding:10px 8px;font-size:12px;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.macro_text}</td>
                <td style="padding:10px 8px;font-size:11px;color:var(--muted)">
                  ${(m.variables||[]).map(v => `<span style="background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:1px 7px;margin-right:3px;white-space:nowrap;display:inline-block;margin-bottom:2px">${v}</span>`).join('') || '—'}
                </td>
                <td style="text-align:center;padding:10px 8px">
                  <span style="font-size:12px;font-weight:600;color:${m.is_active?'var(--green)':'var(--muted)'}">${m.is_active?'Activo':'Inactivo'}</span>
                </td>
                <td style="padding:10px 8px;white-space:nowrap">
                  <button class="btn btn-ghost" style="font-size:11px;padding:3px 8px" onclick="openEditMensajeModal('${m.id}')">✏️</button>
                  <button class="btn btn-ghost" style="font-size:11px;padding:3px 8px" onclick="toggleMensajeActive('${m.id}', ${!m.is_active})">${m.is_active?'Desactivar':'Activar'}</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px">${filtered.length} mensaje${filtered.length!==1?'s':''} mostrado${filtered.length!==1?'s':''}</div>
    `}
  `;
}

// ── Alta / edición de mensaje ─────────────────────────────────────────────────
function openNewMensajeModal() {
  editMensajeState = { id: null, code: '', description: '', macro_text: '', is_active: true, previewValues: {} };
  document.getElementById('stopModalTitle').textContent = '+ Nuevo mensaje';
  document.getElementById('stopModalSub').textContent   = 'Código, descripción y macro estándar';
  document.getElementById('stopModalBody').innerHTML = renderMensajeForm();
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';
}

function openEditMensajeModal(id) {
  const m = mensajesList.find(x => x.id === id);
  if (!m) return;
  editMensajeState = { id: m.id, code: m.code, description: m.description, macro_text: m.macro_text, is_active: m.is_active, previewValues: {} };
  document.getElementById('stopModalTitle').textContent = `✏️ ${m.code}`;
  document.getElementById('stopModalSub').textContent   = 'Editar mensaje del catálogo';
  document.getElementById('stopModalBody').innerHTML = renderMensajeForm();
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';
}

function renderMensajeForm() {
  const isEdit = !!editMensajeState.id;
  return `
    <div style="margin-bottom:8px">
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">Código *</label>
      <input id="msgCode" value="${(editMensajeState.code||'').replace(/"/g,'&quot;')}" ${isEdit?'disabled':''}
        placeholder="Ej: BATCH_APPROVED"
        style="width:100%;padding:7px 9px;background:var(--card2);border:1px solid var(--border);border-radius:6px;
               color:${isEdit?'var(--muted)':'var(--white)'};font-size:13px;box-sizing:border-box;text-transform:uppercase">
    </div>
    <div style="margin-bottom:8px">
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">Descripción *</label>
      <input id="msgDescription" value="${(editMensajeState.description||'').replace(/"/g,'&quot;')}"
        placeholder="Etiqueta corta y legible"
        style="width:100%;padding:7px 9px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:13px;box-sizing:border-box">
    </div>
    <div style="margin-bottom:8px">
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">Macro estándar * — usá <code>{variable}</code> para valores que se rellenan solos</label>
      <textarea id="msgMacroText" oninput="onMensajeMacroInput()"
        style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:13px;resize:vertical;min-height:70px;box-sizing:border-box">${(editMensajeState.macro_text||'').replace(/</g,'&lt;')}</textarea>
    </div>

    <div style="border-top:1px solid var(--border);margin:12px 0;padding-top:10px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Probar macro</div>
      ${renderMensajeVarInputs()}
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">Vista previa</div>
      <div id="msgPreview" style="background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap">${renderMacroPreview(editMensajeState.macro_text, editMensajeState.previewValues) || '—'}</div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin:12px 0">
      <input id="msgIsActive" type="checkbox" ${editMensajeState.is_active?'checked':''} style="width:16px;height:16px">
      <label for="msgIsActive" style="font-size:13px">Activo</label>
    </div>

    <div id="msgError" style="color:var(--red,#D85A30);font-size:13px;display:none;margin-bottom:8px"></div>
    <button id="msgSubmitBtn" class="btn btn-primary" style="width:100%" onclick="submitMensaje()">${isEdit ? 'Guardar cambios' : 'Crear mensaje'}</button>
  `;
}

function renderMensajeVarInputs() {
  const vars = extractTemplateVariables(editMensajeState.macro_text);
  return `
    <div id="msgVarInputs" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
      ${vars.length === 0 ? `<div style="font-size:12px;color:var(--muted)">Esta plantilla no tiene variables</div>` : vars.map(v => `
        <div style="display:flex;align-items:center;gap:8px">
          <label style="font-size:12px;color:var(--muted);width:120px;flex-shrink:0;font-family:var(--font-mono)">{${v}}</label>
          <input oninput="editMensajeState.previewValues['${v}']=this.value;updateMensajePreview()" value="${(editMensajeState.previewValues[v]||'').replace(/"/g,'&quot;')}"
            style="flex:1;padding:5px 8px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:12px">
        </div>
      `).join('')}
    </div>
  `;
}

function onMensajeMacroInput() {
  editMensajeState.macro_text = document.getElementById('msgMacroText').value;
  document.getElementById('msgVarInputs').outerHTML = renderMensajeVarInputs();
  updateMensajePreview();
}

function updateMensajePreview() {
  const el = document.getElementById('msgPreview');
  if (el) el.textContent = renderMacroPreview(editMensajeState.macro_text, editMensajeState.previewValues) || '—';
}

async function submitMensaje() {
  const errEl = document.getElementById('msgError');
  errEl.style.display = 'none';

  const isEdit      = !!editMensajeState.id;
  const code        = document.getElementById('msgCode').value.trim().toUpperCase();
  const description = document.getElementById('msgDescription').value.trim();
  const macroText   = document.getElementById('msgMacroText').value.trim();
  const isActive    = document.getElementById('msgIsActive').checked;

  if (!isEdit && !code) { errEl.textContent = 'El código es obligatorio'; errEl.style.display = 'block'; return; }
  if (!description)     { errEl.textContent = 'La descripción es obligatoria'; errEl.style.display = 'block'; return; }
  if (!macroText)        { errEl.textContent = 'La macro estándar es obligatoria'; errEl.style.display = 'block'; return; }

  if (!useRealData) {
    showToast('Crear/editar mensajes requiere estar conectado a datos reales', 'info');
    closeStopModal(); return;
  }

  const btn = document.getElementById('msgSubmitBtn');
  btn.disabled = true; btn.textContent = isEdit ? 'Guardando...' : 'Creando...';
  try {
    if (isEdit) {
      await apiPatch(`/admin/messages/${editMensajeState.id}`, { description, macro_text: macroText, is_active: isActive });
    } else {
      await apiPost('/admin/messages', { code, description, macro_text: macroText, is_active: isActive });
    }
    closeStopModal();
    showToast(isEdit ? 'Mensaje actualizado' : 'Mensaje creado', 'success');
    await loadMensajes();
  } catch (e) {
    errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = isEdit ? 'Guardar cambios' : 'Crear mensaje';
  }
}

async function toggleMensajeActive(id, newActive) {
  if (!useRealData) {
    const m = mensajesList.find(x => x.id === id);
    if (m) m.is_active = newActive;
    renderMensajesBody(); return;
  }
  try {
    await apiPatch(`/admin/messages/${id}`, { is_active: newActive });
    showToast(newActive ? 'Mensaje activado' : 'Mensaje desactivado', 'success');
    await loadMensajes();
  } catch (e) { showToast('Error: ' + e.message, 'warn'); }
}

              <td style="text-align:right;padding:10px 8px;font-size:13px">${st.porcentaje_muevo}%</td>
              <td style="padding:10px 8px;font-size:12px;color:var(--muted)">$${st.importe_minimo} – ${st.importe_maximo ? '$'+st.importe_maximo : '∞'}</td>

}

          style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:14px;box-sizing:border-box"></div>

      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Precio sugerido — parámetros de cálculo</div>

          <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">$ por km</label>${inpNum('tarPorKm', t?.precio_por_km ?? 0, '0.50')}</div>
          <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">$ por lb</label>${inpNum('tarPorLb', t?.precio_por_lb ?? 0, '0.05')}</div>
          <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">$ por ft³</label>${inpNum('tarPorFt3', t?.precio_por_ft3 ?? 0, '0.30')}</div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px">Sugerencia = base + ($/km × km) + ($/lb × peso) + ($/ft³ × volumen), acotado al rango de abajo.</div>
      </div>

      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Comisión y rango</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">% Muevo</label>${inpNum('tarPct', t?.porcentaje_muevo ?? 5, '5')}</div>

function openNewTarifaModal() {
  document.getElementById('stopModalTitle').textContent = 'Nuevo tipo de servicio';
  document.getElementById('stopModalSub').textContent   = 'Agregar al catálogo';
  document.getElementById('stopModalBody').innerHTML    = tarifaFormHTML(null);
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';
}

function openEditTarifaModal(id) {
  const t = tarifasList.find(x => x.id === id);
  if (!t) return;
  document.getElementById('stopModalTitle').textContent = 'Editar tarifa';
  document.getElementById('stopModalSub').textContent   = t.code;
  document.getElementById('stopModalBody').innerHTML    = tarifaFormHTML(t);
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';
}

function collectTarifaData(isNew) {
  const data = {
    name:             document.getElementById('tarName')?.value.trim(),
    precio_servicio:  parseFloat(document.getElementById('tarPrecioServicio')?.value) || 0,
    precio_por_km:    parseFloat(document.getElementById('tarPorKm')?.value) || 0,
    precio_por_lb:    parseFloat(document.getElementById('tarPorLb')?.value) || 0,
    precio_por_ft3:   parseFloat(document.getElementById('tarPorFt3')?.value) || 0,
    porcentaje_muevo: parseFloat(document.getElementById('tarPct')?.value) || 0,
    importe_minimo:   parseFloat(document.getElementById('tarMin')?.value) || 0,
  };
  const maxVal = document.getElementById('tarMax')?.value;
  data.importe_maximo = (maxVal !== '' && maxVal != null) ? parseFloat(maxVal) : null;
  if (isNew) data.code = document.getElementById('tarCode')?.value.trim();
  return data;
}

async function refreshServiceTypeCaches() {
  if (useRealData) {
    try { REAL_SERVICE_TYPES = await apiGet('/service-types?habilitado=true'); } catch (e) {}
  }
}

async function submitNewTarifa() {
  const data  = collectTarifaData(true);
  const errEl = document.getElementById('tarError');
  if (!data.code || !data.name) { errEl.textContent = 'Código y nombre son obligatorios'; errEl.style.display = 'block'; return; }

  if (!useRealData) {
    tarifasList.push({ id: 'st'+Date.now(), ...data, habilitado: true });
    closeStopModal(); showToast('Tipo de servicio creado (demo)', 'success'); renderTarifasBody(); return;
  }
  try {
    const st = await apiPost('/service-types', data);
    tarifasList.push(st);
    await refreshServiceTypeCaches();
    closeStopModal(); showToast('Tipo de servicio creado', 'success'); renderTarifasBody();
  } catch (e) { errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block'; }
}

async function submitEditTarifa(id) {
  const data  = collectTarifaData(false);
  const errEl = document.getElementById('tarError');
  if (!data.name) { errEl.textContent = 'El nombre es obligatorio'; errEl.style.display = 'block'; return; }

  if (!useRealData) {
    const t = tarifasList.find(x => x.id === id);
    if (t) Object.assign(t, data);
    closeStopModal(); showToast('Tarifa actualizada (demo)', 'success'); renderTarifasBody(); return;
  }
  try {
    const st = await apiPatch(`/service-types/${id}`, data);
    const idx = tarifasList.findIndex(x => x.id === id);
    if (idx !== -1) tarifasList[idx] = st;
    await refreshServiceTypeCaches();
    closeStopModal(); showToast('Tarifa actualizada', 'success'); renderTarifasBody();
  } catch (e) { errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block'; }
}

async function toggleTarifa(id, activate) {
  if (!useRealData) {
    const t = tarifasList.find(x => x.id === id);
    if (t) t.habilitado = activate;
    showToast(activate ? 'Tipo activado' : 'Tipo desactivado', 'success');
    renderTarifasBody(); return;
  }
  try {
    const st = await apiPatch(`/service-types/${id}`, { habilitado: activate });
    const idx = tarifasList.findIndex(x => x.id === id);
    if (idx !== -1) tarifasList[idx] = st;
    await refreshServiceTypeCaches();
    showToast(activate ? 'Tipo activado' : 'Tipo desactivado', 'success');
    renderTarifasBody();
  } catch (e) { showToast('Error: ' + e.message, 'warn'); }
}

               border-radius:8px;color:var(--white);font-size:13px;resize:vertical;min-height:50px;
               box-sizing:border-box;margin-bottom:10px"></textarea>
      <div id="negError" style="color:var(--red,#D85A30);font-size:13px;display:none;margin-bottom:8px"></div>
      <button class="btn btn-primary" style="width:100%" onclick="submitSuggestPrice()">Enviar precio sugerido</button>
    ` : canRespond ? `
      <!-- Responder a contraoferta del transporte -->
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">
        El transportista contraofertó ${fmt$(lastOffer.amount)}. ¿Cómo respondés?
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn btn-primary" style="flex:1;font-size:13px"
          onclick="respondOffer('accept')">✓ Aceptar ${fmt$(lastOffer.amount)}</button>
        <button class="btn btn-ghost" style="flex:1;font-size:13px;color:var(--red,#D85A30)"
          onclick="respondOffer('reject')">✕ Rechazar</button>
      </div>
      <div style="font-size:12px;color:var(--muted);margin:10px 0 6px">O hacé una nueva contraoferta:</div>
      <input id="negCounterAmount" type="number" step="0.01" placeholder="Nuevo monto"
        style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--border);
               border-radius:8px;color:var(--white);font-size:14px;box-sizing:border-box;margin-bottom:8px">
      <textarea id="negCounterNote" placeholder="Nota (opcional)..."
        style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--border);
               border-radius:8px;color:var(--white);font-size:13px;resize:vertical;min-height:50px;
               box-sizing:border-box;margin-bottom:10px"></textarea>
      <div id="negError" style="color:var(--red,#D85A30);font-size:13px;display:none;margin-bottom:8px"></div>
      <button class="btn btn-ghost" style="width:100%" onclick="respondOffer('counter')">Enviar contraoferta</button>
    ` : `
      <div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">
        ⏳ Esperando respuesta del transportista...
      </div>
    `}
  `;
}

async function submitSuggestPrice() {
  const amount = parseFloat(document.getElementById('negAmount')?.value);
  const note   = document.getElementById('negNote')?.value.trim() || null;
  const errEl  = document.getElementById('negError');

  if (!amount || amount <= 0) {
    errEl.textContent = 'Ingresá un monto válido'; errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';

  if (!useRealData) {
    negotiationData.negotiation_status = 'suggested';
    negotiationData.suggested_price = amount;
    negotiationData.offers.push({
      id:'o'+Date.now(), offered_by:'warehouse', user_name:'Carlos Rodriguez',
      amount, note, status:'pending', created_at:new Date().toISOString(),
    });
    renderNegotiationPanel();
    showToast('Precio sugerido enviado', 'success');
    return;
  }

  try {
    negotiationData = await apiPost(`/warehouse/routes/${negotiationRouteId}/suggest-price`, { amount, note });
    renderNegotiationPanel();
    showToast('Precio sugerido enviado', 'success');
  } catch(e) { errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block'; }
}

async function respondOffer(action) {
  const errEl = document.getElementById('negError');
  let amount = null, note = null;

  if (action === 'counter') {
    amount = parseFloat(document.getElementById('negCounterAmount')?.value);
    note   = document.getElementById('negCounterNote')?.value.trim() || null;
    if (!amount || amount <= 0) {
      errEl.textContent = 'Ingresá un monto válido para la contraoferta'; errEl.style.display = 'block'; return;
    }
  }
  if (errEl) errEl.style.display = 'none';

  if (!useRealData) {
    const lastOffer = [...negotiationData.offers].reverse().find(o => o.status === 'pending');
    if (action === 'accept') {
      if (lastOffer) lastOffer.status = 'accepted';
      negotiationData.negotiation_status = 'accepted';
      negotiationData.current_price = lastOffer.amount;
    } else if (action === 'counter') {
      if (lastOffer) lastOffer.status = 'superseded';
      negotiationData.offers.push({
        id:'o'+Date.now(), offered_by:'warehouse', user_name:'Carlos Rodriguez',
        amount, note, status:'pending', created_at:new Date().toISOString(),
      });
      negotiationData.negotiation_status = 'countered';
      negotiationData.suggested_price = amount;
    } else if (action === 'reject') {
      if (lastOffer) lastOffer.status = 'rejected';
      negotiationData.negotiation_status = 'none';
    }
    renderNegotiationPanel();
    showToast('Respuesta enviada', 'success');
    return;
  }

  try {
    negotiationData = await apiPost(`/warehouse/routes/${negotiationRouteId}/respond-offer`, { action, amount, note });
    renderNegotiationPanel();
    showToast('Respuesta enviada', 'success');
  } catch(e) { errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block'; }
}

// ── Auth flow ────────────────────────────────────────────────────────────
// El login en sí ocurre en login.html — este portal solo consume el token
// guardado en sessionStorage (ver tryAutoLogin más abajo).

function handleLogout() {
  disconnectTrackingWS();
  sessionStorage.removeItem('muevo_token');
  sessionStorage.removeItem('muevo_user');
  window.location.href = '/login.html';
}

let REAL_DASHBOARD = null;
let REAL_ROUTES = null;
let REAL_BILLING = null;

async function loadRealData() {
  try {
    REAL_DASHBOARD     = await apiGet('/warehouse/dashboard');
    REAL_BATCHES       = await apiGet('/warehouse/batches');
    REAL_ROUTES        = await apiGet('/warehouse/routes');
    REAL_BILLING       = await apiGet('/warehouse/billing');
    REAL_SERVICE_TYPES = await apiGet('/service-types?habilitado=true');
    REAL_VEHICLE_TYPES = await apiGet('/vehicle-types?habilitado=true');

    // Límite de carga de CSV configurado para esta compañía (o el default global)
    if (REAL_DASHBOARD?.max_csv_rows)         MAX_CSV_ROWS = REAL_DASHBOARD.max_csv_rows;
    if (REAL_DASHBOARD?.max_csv_file_size_mb) MAX_CSV_FILE_SIZE_MB = REAL_DASHBOARD.max_csv_file_size_mb;
  } catch (e) {
    console.error('Error cargando datos reales:', e);
    useRealData = false;
  }
}

function buildBatchesFromRoutes(routes) {
  // Agrupar por batch_id si viene en la ruta, sino cada ruta es su propio lote
  const groups = {};
  routes.forEach(r => {
    const key = r.batch_id || r.id;
    if (!groups[key]) {
      groups[key] = {
        id:             key,
        numero:         r.batch_number || r.route_number || key.substring(0,8).toUpperCase(),
        nombre:         r.batch_name   || r.title || 'Sin nombre',
        fecha_creacion: r.created_at   ? r.created_at.split('T')[0] : (r.scheduled_date||'').split('T')[0] || '—',
        fecha_estado:   r.updated_at   ? r.updated_at.split('T')[0] : (r.scheduled_date||'').split('T')[0] || '—',
        status:         mapBatchStatus(r.status),
        routes:         [],
      };
    }
    groups[key].routes.push(mapRealRoute(r));
  });
  return Object.values(groups);
}

function mapBatchStatus(routeStatus) {
  const map = {
    draft:             'draft',
    published:         'approved',
    assigned:          'approved',
    in_progress:       'partially_completed',
    completed:         'completed',
    cancelled:         'cancelled',
    incident_reported: 'closed_with_incidents',
  };
  return map[routeStatus] || 'draft';
}

// Mapea una RouteHeader real (API) al shape que usa el resto del HTML/JS
function mapRealRoute(r) {
  return {
    id: r.id, num: r.route_number, title: r.title,
    client: r.company_name || 'Cliente corporativo',
    mode: r.service_mode === 'mensajeria' ? 'Mensajería' : r.service_mode === 'logistica' ? 'Logística' : r.service_mode === 'paqueteria' ? 'Paquetería' : 'Empleados',
    status: r.status === 'in_progress' ? 'in_progress' : r.status === 'completed' ? 'completed' : r.status === 'published' || r.status === 'assigned' ? 'scheduled' : r.status,
    negotiation_status: r.negotiation_status || 'none',
    date: r.scheduled_date ? new Date(r.scheduled_date).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '—',
    time: r.scheduled_start && r.scheduled_end
      ? `${new Date(r.scheduled_start).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})} – ${new Date(r.scheduled_end).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`
      : '—',
    stops_total: r.total_stops || 0, stops_done: r.completed_stops || 0,
    km: r.total_km || 0,
    gross: r.gross_pay || 0, commission: (r.gross_pay||0) - (r.net_pay||0), net: r.net_pay || 0,
    transportista: r.transport_company?.name || r.transport_company_name || r.transport_company || 'Sin asignar',
    transportista_rating: 4.8,
    vehicle: '', driver: '',
    shipment: r.total_packages > 0 ? {
      total_packages: r.total_packages, total_weight_lbs: r.total_weight_lbs,
      total_volume_ft3: r.total_volume_ft3, stackable: true,
      fragile: r.has_fragile_items, hazmat: r.has_hazmat_items, temp_controlled: r.requires_temp_control,
      cargo_value: r.total_cargo_value, insurance_required: r.requires_insurance,
      special_instructions: r.driver_notes || '',
    } : null,
    stops: (r.stops || []).map(s => ({
      id: s.id, order: s.sequence_order, company: s.company_name || '', address: s.address || '', zip: s.zip_code || '',
      lat: s.lat, lng: s.lng,
      eta: s.eta_scheduled ? new Date(s.eta_scheduled).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '',
      status: s.status, code: s.items?.[0]?.package_code || '', pod: s.pod_required,
      packages: s.packages_count, weight_lbs: s.weight_lbs, volume_ft3: s.volume_ft3,
      barcode: s.items?.[0]?.barcode || '', qr_code: s.items?.[0]?.qr_code || '',
      dock: s.dock_number || '', wait_min: s.wait_minutes_estimated || 0, notes: s.access_notes || '',
      items: s.items || [],
    })),
  };
}

// Mapper para rutas que vienen dentro del objeto de un lote (desde /warehouse/batches)
function mapBatchRoute(r) {
  const date  = r.scheduled_date ? new Date(r.scheduled_date).toLocaleDateString('es-ES',{day:'numeric',month:'short'}) : '—';
  const start = r.scheduled_start ? new Date(r.scheduled_start).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '';
  const end   = r.scheduled_end   ? new Date(r.scheduled_end).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})   : '';
  const gross = r.gross_pay || 0;
  const net   = r.net_pay   || gross * 0.88;
  return {
    id:                    r.id,
    num:                   r.route_number  || '—',
    title:                 r.title         || 'Sin nombre',
    status:                r.status        || 'draft',
    service_mode:          r.service_mode  || '',
    mode:                  r.service_mode  || 'mensajeria',
    vehicle_type:          r.vehicle_type  || r.required_vehicle_type || '',
    required_vehicle_type: r.required_vehicle_type || '',
    scheduled_date:        r.scheduled_date || null,
    scheduled_end:         r.scheduled_end  || null,
    total_weight_lbs:      r.total_weight_lbs || 0,
    total_volume_ft3:      r.total_volume_ft3 || 0,
    negotiation_status:    r.negotiation_status || 'none',
    suggested_price:       r.suggested_price || null,
    date,
    time:         start && end ? `${start} – ${end}` : '—',
    stops_total:  r.total_stops      || 0,
    stops_done:   r.completed_stops  || 0,
    gross,
    commission:   gross - net,
    net,
    transportista: r.transport_company || 'Sin asignar',
    stops: [],
  };
}

function getActiveRoutes() {
  if (useRealData && REAL_ROUTES) return REAL_ROUTES.map(mapRealRoute);
  return ROUTES;
}

// ── Live tracking — Leaflet map + WebSocket ─────────────────────────────────
let liveMapInstance = null;
let vehicleMarkers = {};     // route_id -> L.marker
let routePolylines = {};     // route_id -> L.polyline (rastro recorrido)
let trackingWS = null;

function initLiveTracking() {
  const mapEl = document.getElementById('liveMap');
  if (!mapEl || typeof L === 'undefined') return;

  // Crear el mapa una sola vez; si ya existe, solo lo redimensionamos
  if (!liveMapInstance) {
    liveMapInstance = L.map('liveMap', { zoomControl: true, attributionControl: true })
      .setView([28.5383, -81.3792], 11); // Orlando, FL por defecto
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap, © CARTO',
      maxZoom: 19,
    }).addTo(liveMapInstance);
  } else {
    setTimeout(() => liveMapInstance.invalidateSize(), 50);
  }

  // Dibujar las rutas activas con su última posición conocida y conectar WS
  const active = getActiveRoutes().filter(r => r.status === 'in_progress');
  if (active.length === 0) {
    document.getElementById('trackingInfo').textContent = 'No hay rutas en curso en este momento.';
    return;
  }

  active.forEach(r => loadRouteTrackingSnapshot(r.id));
  connectTrackingWS();
}

async function loadRouteTrackingSnapshot(routeId) {
  if (!useRealData) return;
  try {
    const snap = await apiGet(`/warehouse/routes/${routeId}/tracking`);
    if (snap.lat != null && snap.lng != null) {
      updateVehicleOnMap(routeId, snap.lat, snap.lng, snap.route_number);
    }
  } catch (e) {
    // sin posición todavía — normal si el conductor no inició navegación
  }
}

function updateVehicleOnMap(routeId, lat, lng, routeNumber) {
  if (!liveMapInstance) return;

  if (!vehicleMarkers[routeId]) {
    const icon = L.divIcon({
      className: '', html: `<div style="width:16px;height:16px;background:#F47B20;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(244,123,32,0.3)"></div>`,
      iconSize: [16, 16], iconAnchor: [8, 8],
    });
    vehicleMarkers[routeId] = L.marker([lat, lng], { icon })
      .addTo(liveMapInstance)
      .bindPopup(`<b>${routeNumber || routeId}</b><br>Posición en vivo`);
    routePolylines[routeId] = L.polyline([[lat, lng]], { color: '#F47B20', weight: 2, opacity: 0.6 }).addTo(liveMapInstance);
    liveMapInstance.setView([lat, lng], 13);
  } else {
    vehicleMarkers[routeId].setLatLng([lat, lng]);
    const path = routePolylines[routeId].getLatLngs();
    path.push([lat, lng]);
    routePolylines[routeId].setLatLngs(path);
  }

  const infoEl = document.getElementById('trackingInfo');
  if (infoEl) {
    infoEl.innerHTML = `<strong style="color:var(--white)">${routeNumber || routeId}</strong> · ${lat.toFixed(5)}, ${lng.toFixed(5)} · ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
  }
}

function connectTrackingWS() {
  if (!useRealData || !REAL_DASHBOARD) return;
  disconnectTrackingWS();

  // El company_id viaja en el snapshot de tracking de cada ruta; lo
  // resolvemos a partir de la primera ruta activa disponible.
  const active = getActiveRoutes().filter(r => r.status === 'in_progress');
  if (active.length === 0) return;

  apiGet(`/warehouse/routes/${active[0].id}/tracking`).then(snap => {
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProtocol}//${location.host}/ws/tracking/${snap.ws_channel}`;
    trackingWS = new WebSocket(wsUrl);

    trackingWS.onopen = () => {
      const badge = document.getElementById('wsStatusBadge');
      if (badge) { badge.textContent = '● En vivo'; badge.style.background = 'var(--green-dim)'; badge.style.color = 'var(--green)'; }
    };
    trackingWS.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'driver_location') {
          updateVehicleOnMap(msg.route_id, msg.lat, msg.lng, msg.route_number);
        }
      } catch (e) {}
    };
    trackingWS.onclose = () => {
      const badge = document.getElementById('wsStatusBadge');
      if (badge) { badge.textContent = '○ Sin conexión'; badge.style.background = 'var(--card2)'; badge.style.color = 'var(--muted)'; }
    };
    trackingWS.onerror = () => {};
  }).catch(() => {});
}

function disconnectTrackingWS() {
  if (trackingWS) {
    trackingWS.close();
    trackingWS = null;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
// Este portal requiere haber pasado por login.html primero. Si no hay
// token válido en sessionStorage, redirige automáticamente.
(function tryAutoLogin() {
  const savedToken = sessionStorage.getItem('muevo_token');
  if (!savedToken) {
    window.location.href = '/login.html';
    return;
  }
  authToken = savedToken;
  useRealData = true;
  // Update sidebar with active company info
  const savedCompany = sessionStorage.getItem('muevo_company');
  if (savedCompany) {
    try {
      const c = JSON.parse(savedCompany);
      const nameEl = document.getElementById('sidebarCompanyName');
      const roleEl = document.getElementById('sidebarUserRole');
      if (nameEl) nameEl.textContent = c.name || 'Compañía';
      if (roleEl) roleEl.textContent = c.is_super_admin ? 'Super Admin' : c.can_operate ? 'Operador' : 'Solo lectura';
      const avatarEl = document.getElementById('sidebarAvatar');
      if (avatarEl && c.name) avatarEl.textContent = c.name.substring(0,2).toUpperCase();
      const navUsers = document.getElementById('navUsuarios');
      if (navUsers && (c.is_admin || c.is_super_admin)) navUsers.style.display = '';
    } catch(e) {}
  }
  loadRealData().then(() => showView('dashboard'));
})();
