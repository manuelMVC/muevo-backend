<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muevo Drive — Portal Warehouse</title>
<style>
  /* ── Reset & base ──────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0D0D0D;
    --surface:   #151515;
    --card:      #1C1C1C;
    --card2:     #222222;
    --orange:    #F47B20;
    --orange-dim: rgba(244,123,32,0.10);
    --orange-bdr: rgba(244,123,32,0.25);
    --white:     #F8FAFB;
    --muted:     #8A8A8A;
    --border:    rgba(255,255,255,0.07);
    --green:     #27AE60;
    --green-dim: rgba(39,174,96,0.10);
    --green-bdr: rgba(39,174,96,0.25);
    --red:       #E74C3C;
    --red-dim:   rgba(231,76,60,0.10);
    --blue:      #2E86DE;
    --blue-dim:  rgba(46,134,222,0.10);
    --blue-bdr:  rgba(46,134,222,0.25);
    --yellow:    #F1C40F;
    --yellow-dim:rgba(241,196,15,0.10);
    --radius:    10px;
    --radius-lg: 14px;
    --font:      -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
  }

  /* ── Light mode overrides ───────────────────────────────────────────────── */
  [data-theme="light"] {
    --bg:        #F4F4F2;
    --surface:   #FFFFFF;
    --card:      #FFFFFF;
    --card2:     #F0EFE8;
    --white:     #1A1A1A;
    --muted:     #6B6B6B;
    --border:    rgba(0,0,0,0.09);
    --orange-dim: rgba(244,123,32,0.08);
    --orange-bdr: rgba(244,123,32,0.20);
    --green-dim: rgba(39,174,96,0.08);
    --green-bdr: rgba(39,174,96,0.20);
    --red-dim:   rgba(231,76,60,0.08);
    --blue-dim:  rgba(46,134,222,0.08);
    --blue-bdr:  rgba(46,134,222,0.20);
    --yellow-dim:rgba(241,196,15,0.08);
  }

  [data-theme="light"] body { color: var(--white); }

  [data-theme="light"] .sidebar,
  [data-theme="light"] .topbar {
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  [data-theme="light"] table th {
    background: #EEECEA;
    color: #444;
  }

  [data-theme="light"] .kpi-card {
    border: 1px solid rgba(0,0,0,0.07);
  }

  [data-theme="light"] input,
  [data-theme="light"] select {
    background: #FAFAF8 !important;
    border-color: rgba(0,0,0,0.12) !important;
    color: #1A1A1A !important;
  }


  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ── Sidebar ──────────────────────────────────────────────────────────── */
  .sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    transition: transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s;
  }

  .sidebar-logo {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--orange);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .logo-text { font-size: 15px; font-weight: 600; color: var(--white); letter-spacing: -.3px; }
  .logo-sub  { font-size: 10px; color: var(--orange); font-weight: 500; letter-spacing: .5px; }

  .sidebar-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }

  .nav-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    padding: 10px 8px 4px;
  }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--muted); transition: all .15s;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--card); color: var(--white); }
  .nav-item.active { background: var(--orange-dim); color: var(--orange); }
  .nav-item .nav-icon { width: 16px; text-align: center; font-size: 14px; }
  .nav-badge {
    margin-left: auto;
    background: var(--orange); color: #111;
    font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 10px;
  }

  .sidebar-bottom {
    padding: 12px 10px;
    border-top: 1px solid var(--border);
  }

  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    cursor: pointer;
  }
  .user-card:hover { background: var(--card); }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #111; flex-shrink: 0;
  }
  .user-name  { font-size: 12px; font-weight: 500; color: var(--white); }
  .user-role  { font-size: 10px; color: var(--muted); }


  /* ── Sidebar — floating mode ──────────────────────────────────────────── */
  /* When body has .sidebar-floating, sidebar slides off-canvas by default   */
  body.sidebar-floating .sidebar {
    transform: translateX(-100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s;
    box-shadow: none;
    z-index: 200;
  }
  body.sidebar-floating .sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 32px rgba(0,0,0,0.35);
  }
  body.sidebar-floating .main {
    margin-left: 0 !important;
    transition: margin-left .22s cubic-bezier(.4,0,.2,1);
  }
  /* Overlay behind floating sidebar */
  #sidebarOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 199;
    backdrop-filter: blur(2px);
  }
  body.sidebar-floating #sidebarOverlay { display: block; opacity: 0; pointer-events: none; transition: opacity .22s; }
  body.sidebar-floating .sidebar.open ~ #sidebarOverlay,
  body.sidebar-floating #sidebarOverlay.visible { opacity: 1; pointer-events: auto; }

  /* Hamburger button — only visible in floating mode */
  #hamburgerBtn {
    display: none;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font-size: 18px;
    color: var(--muted); transition: color .15s; margin-right: 4px;
  }
  body.sidebar-floating #hamburgerBtn { display: inline-flex; align-items: center; }

  /* Sidebar pin toggle button — always visible in topbar */
  #sidebarPinBtn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font-size: 15px;
    color: var(--muted); transition: all .15s; margin-right: 4px;
    title: "Fijar / soltar panel";
  }
  #sidebarPinBtn:hover { color: var(--white); }

  /* ── Main ─────────────────────────────────────────────────────────────── */
  .main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Topbar ───────────────────────────────────────────────────────────── */
  .topbar {
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    position: sticky; top: 0; z-index: 50;
  }

  .topbar-title { font-size: 15px; font-weight: 600; color: var(--white); }
  .topbar-sub   { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
  }
  .btn-primary { background: var(--orange); color: #111; }
  .btn-primary:hover { background: #f08c3a; }
  .btn-ghost {
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--white); border-color: rgba(255,255,255,0.15); }

  /* ── Content ──────────────────────────────────────────────────────────── */
  .content { padding: 28px; flex: 1; }

  /* ── KPI row ──────────────────────────────────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .kpi-label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .3px; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 600; letter-spacing: -1px; color: var(--white); }
  .kpi-value.orange { color: var(--orange); }
  .kpi-value.green  { color: var(--green);  }
  .kpi-sub {
    font-size: 11px; color: var(--muted); margin-top: 6px;
    display: flex; align-items: center; gap: 4px;
  }
  .kpi-sub.up   { color: var(--green); }
  .kpi-sub.down { color: var(--red);   }

  /* ── Section header ───────────────────────────────────────────────────── */
  .section-hdr {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--white); }
  .section-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Table ────────────────────────────────────────────────────────────── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .table-filters {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
  }

  .search-box {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px;
  }
  .search-box input {
    background: none; border: none; outline: none;
    color: var(--white); font-size: 12px; font-family: var(--font);
    flex: 1;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-icon { color: var(--muted); font-size: 13px; }

  .filter-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--white); }
  .filter-btn.active { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 10px 18px;
    text-align: left; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--card2); }
  tbody td { padding: 13px 18px; font-size: 13px; color: var(--white); vertical-align: middle; }

  /* ── Badges ───────────────────────────────────────────────────────────── */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .badge-green  { background: var(--green-dim);  color: var(--green);  border: 1px solid var(--green-bdr); }
  .badge-orange { background: var(--orange-dim); color: var(--orange); border: 1px solid var(--orange-bdr); }
  .badge-blue   { background: var(--blue-dim);   color: var(--blue);   border: 1px solid var(--blue-bdr); }
  .badge-red    { background: var(--red-dim);     color: var(--red);    border: 1px solid rgba(231,76,60,.25); }
  .badge-muted  { background: var(--card2);       color: var(--muted);  border: 1px solid var(--border); }
  .badge-yellow { background: var(--yellow-dim);  color: var(--yellow); border: 1px solid rgba(241,196,15,.25); }

  /* ── Upload zone ──────────────────────────────────────────────────────── */
  .upload-zone {
    border: 2px dashed var(--orange-bdr);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    background: var(--orange-dim);
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 16px;
  }
  .upload-zone:hover { border-color: var(--orange); background: rgba(244,123,32,0.15); }
  .upload-icon { font-size: 32px; margin-bottom: 10px; }
  .upload-title { font-size: 14px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
  .upload-sub   { font-size: 12px; color: var(--muted); }
  .upload-link  { color: var(--orange); text-decoration: underline; cursor: pointer; }

  /* ── Grid layouts ─────────────────────────────────────────────────────── */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 24px; }

  /* ── Card ─────────────────────────────────────────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
  }
  .card-title { font-size: 13px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
  .card-sub   { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* ── Route detail panel ───────────────────────────────────────────────── */
  .detail-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 420px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 200;
    transform: translateX(100%);
    transition: transform .2s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .detail-panel.open { transform: translateX(0); }

  .panel-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .panel-close {
    width: 28px; height: 28px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; font-size: 16px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 10px;
  }
  .panel-close:hover { color: var(--white); }
  .panel-body { flex: 1; overflow-y: auto; padding: 20px; }

  .stop-timeline { display: flex; flex-direction: column; gap: 0; }
  .stop-item {
    display: flex; gap: 12px;
    position: relative; padding-bottom: 16px;
  }
  .stop-item:last-child { padding-bottom: 0; }
  .stop-item::before {
    content: '';
    position: absolute; left: 13px; top: 28px; bottom: 0;
    width: 1px; background: var(--border);
  }
  .stop-item:last-child::before { display: none; }
  .stop-dot {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; z-index: 1;
  }
  .stop-dot.done    { background: var(--green);  color: #fff; }
  .stop-dot.active  { background: var(--orange); color: #111; }
  .stop-dot.pending { background: var(--card2);  color: var(--muted); border: 1px solid var(--border); }
  .stop-content { flex: 1; }
  .stop-company { font-size: 13px; font-weight: 500; color: var(--white); margin-bottom: 2px; }
  .stop-address { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .stop-meta    { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── Map placeholder ──────────────────────────────────────────────────── */
  .map-box {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    height: 180px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .map-box::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent, transparent 20px,
      rgba(255,255,255,0.015) 20px, rgba(255,255,255,0.015) 21px
    );
  }
  .map-label { font-size: 12px; color: var(--muted); z-index: 1; }

  /* ── Progress bar ─────────────────────────────────────────────────────── */
  .prog-wrap { margin-bottom: 16px; }
  .prog-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 11px; color: var(--muted); }
  .prog-track { height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .prog-fill  { height: 100%; border-radius: 3px; background: var(--orange); transition: width .25s ease; }
  .prog-fill.green { background: var(--green); }

  /* ── Cost row ─────────────────────────────────────────────────────────── */
  .cost-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .cost-row:last-child { border: none; }
  .cost-label { color: var(--muted); }
  .cost-value { font-weight: 500; color: var(--white); }
  .cost-value.orange { color: var(--orange); }
  .cost-value.green  { color: var(--green); }

  /* ── CSV preview table ────────────────────────────────────────────────── */
  .csv-preview {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden; margin-bottom: 16px;
  }
  .csv-preview table { font-size: 11px; font-family: var(--font-mono); }
  .csv-preview thead th { background: var(--card); font-size: 10px; letter-spacing: .3px; }
  .csv-preview tbody td { padding: 8px 14px; color: var(--muted); }
  .csv-preview tbody tr:hover { background: rgba(255,255,255,0.03); }

  /* ── Metric mini ──────────────────────────────────────────────────────── */
  .metric-row {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .metric {
    flex: 1; background: var(--card2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px;
    text-align: center;
  }
  .metric-val { font-size: 18px; font-weight: 600; color: var(--white); }
  .metric-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; }

  /* ── Alert banner ─────────────────────────────────────────────────────── */
  .alert {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: var(--radius);
    margin-bottom: 16px; font-size: 12px;
  }
  .alert-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
  .alert-body { flex: 1; line-height: 1.5; }
  .alert-title { font-weight: 600; margin-bottom: 2px; }
  .alert.warn { background: var(--yellow-dim); border: 1px solid rgba(241,196,15,.25); color: var(--yellow); }
  .alert.info { background: var(--blue-dim);   border: 1px solid var(--blue-bdr);     color: var(--blue); }
  .alert.ok   { background: var(--green-dim);  border: 1px solid var(--green-bdr);    color: var(--green); }
  .alert.danger { background: var(--red-dim);  border: 1px solid rgba(231,76,60,.25); color: var(--red); }

  /* ── Tabs ─────────────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    padding: 10px 18px; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer; border: none; background: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all .15s;
  }
  .tab:hover { color: var(--white); }
  .tab.active { color: var(--orange); border-bottom-color: var(--orange); }

  /* ── Empty state ──────────────────────────────────────────────────────── */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--white); margin-bottom: 6px; }
  .empty-sub   { font-size: 12px; line-height: 1.6; }

  /* ── Overlay ──────────────────────────────────────────────────────────── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 150;
  }
  .overlay.show { display: block; }

  /* ── Scrollbar ────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--card2); border-radius: 3px; }

  /* ── Toast ────────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 13px;
    display: flex; align-items: center; gap: 10px;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all .25s ease;
    max-width: 320px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.info    { border-left: 3px solid var(--orange); }

  #liveMap { width: 100%; height: 320px; border-radius: var(--radius); background: var(--card2); }
  .leaflet-container { background: #1c1c1c !important; border-radius: var(--radius); }

// ── API layer ─────────────────────────────────────────────────────────────
const API_BASE = '/api/v1'; // ruta relativa — warehouse.html se sirve desde el mismo origen que la API
let authToken = null;
let useRealData = false;

async function apiLogin(email, password) {
  const body = new URLSearchParams({ username: email, password });
  const res = await fetch(`${API_BASE}/auth/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body,
  });
  if (!res.ok) throw new Error('Login fallido');
  const data = await res.json();
  authToken = data.access_token;
  return data;
}

function getActiveCompanyId() {
  try {
    const c = sessionStorage.getItem('muevo_company');
    return c ? JSON.parse(c).id : null;
  } catch { return null; }
}

function getActiveCompanyName() {
  try {
    const c = sessionStorage.getItem('muevo_company');
    return c ? JSON.parse(c).name : null;
  } catch { return null; }
}

function buildHeaders(extra = {}) {
  const h = { 'Authorization': `Bearer ${authToken}`, ...extra };
  const cid = getActiveCompanyId();
  if (cid) h['X-Company-ID'] = cid;
  return h;
}

async function apiGet(path) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: buildHeaders(),
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  return res.json();
}

async function apiPatch(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: 'PATCH',
    headers: buildHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`API error ${res.status}: ${errText}`);
  }
  return res.status === 204 ? null : res.json();
}

async function apiPost(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: 'POST',
    headers: buildHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`API error ${res.status}: ${errText}`);
  }
  return res.json();
}

async function apiDelete(path) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: 'DELETE',
    headers: buildHeaders(),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`API error ${res.status}: ${errText}`);
  }
  return res.status === 204 ? null : res.json();
}

// ── Helpers ───────────────────────────────────────────────────────────────

function batchStatusBadge(status) {
  const map = {
    draft:                ['badge-muted',   '📝 Borrador'],
    approved:             ['badge-blue',    '✅ Aprobado'],
    partially_accepted:   ['badge-yellow',  '⚡ Parcialmente aceptado'],
    fully_accepted:       ['badge-green',   '✅ Aceptado'],
    partially_completed:  ['badge-orange',  '🔄 En curso'],
    completed:            ['badge-green',   '✓ Completado'],
    closed_with_incidents:['badge-red',     '⚠️ Con incidencias'],
    cancelled:            ['badge-red',     '✕ Cancelado'],
    expired:              ['badge-muted',   '⏱ Expirado'],
  };
  const [cls, label] = map[status] || ['badge-muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function batchRouteStats(batch) {
  const routes = batch.routes || [];
  const total     = routes.length;
  const completed = routes.filter(r => r.status === 'completed').length;
  const active    = routes.filter(r => r.status === 'in_progress').length;
  const pending   = routes.filter(r => ['draft','published','scheduled','assigned'].includes(r.status)).length;
  const rejected  = routes.filter(r => r.status === 'cancelled').length;
  return { total, completed, active, pending, rejected };
}

function statusBadge(status) {
  const map = {
    in_progress: ['badge-orange','En curso'],
    scheduled:   ['badge-blue',  'Programada'],
    completed:   ['badge-green', 'Completada'],
    cancelled:   ['badge-red',   'Cancelada'],
    pending:     ['badge-muted', 'Pendiente'],
  };
  const [cls, label] = map[status] || ['badge-muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function modeBadge(mode) {
  const map = {
    'Mensajería': ['badge-blue',   '📦'],
    'Empleados':  ['badge-green',  '👥'],
    'Logística':  ['badge-yellow', '🏭'],
  };
  const [cls, icon] = map[mode] || ['badge-muted','📋'];
  return `<span class="badge ${cls}">${icon} ${mode}</span>`;
}

function stopDot(status) {
  if (status === 'done')    return 'done';
  if (status === 'active')  return 'active';
  return 'pending';
}

function stopIcon(status) {
  if (status === 'done')    return '✓';
  if (status === 'active')  return '⬤';
  return '○';
}

function pct(a, b) { return b > 0 ? Math.round(a/b*100) : 0; }
function fmt$(n)    { return '$' + n.toFixed(2); }

function shadeColor(hex, percent) {
  // percent negativo oscurece, positivo aclara
  const f = parseInt(hex.slice(1), 16);
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent);
  const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
  const nR = Math.round((t - R) * p) + R;
  const nG = Math.round((t - G) * p) + G;
  const nB = Math.round((t - B) * p) + B;
  return `#${(0x1000000 + nR*0x10000 + nG*0x100 + nB).toString(16).slice(1)}`;
}

// ── Torta interactiva: ilumina la porción bajo el cursor ─────────────────────
function setupPieChart(canvas, DATA, borderColor, mutedColor, legendId) {
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const rx = Math.min(W/2, H/2) - 8;
  const ry = rx * 0.55;
  const tot = DATA.reduce((s,d)=>s+d.count,0);

  let a0 = -Math.PI/2;
  const slices = DATA.map(d => {
    const a1 = a0 + (d.count/tot)*2*Math.PI;
    const seg = { ...d, a0, a1 };
    a0 = a1;
    return seg;
  });

  function draw(hoverIdx) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,W,H);

    // Disco plano (sin extrusión) — solo la tapa con gradiente de iluminación
    slices.forEach((s, i) => {
      const isHover = hoverIdx === i;
      const dim = hoverIdx !== null && !isHover;
      // Explode sutil hacia afuera al hacer hover
      let ox = 0, oy = 0;
      if (isHover) {
        const mid = (s.a0 + s.a1) / 2;
        ox = Math.cos(mid) * 4;
        oy = Math.sin(mid) * 2;
      }
      ctx.save();
      ctx.translate(ox, oy);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.ellipse(cx, cy, rx, ry, 0, s.a0, s.a1);
      ctx.closePath();

      if (isHover) {
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 14;
      }
      const grad = ctx.createRadialGradient(cx - rx*0.3, cy - ry*0.3, 2, cx, cy, rx);
      grad.addColorStop(0, shadeColor(s.color, dim ? 0.05 : (isHover ? 0.4 : 0.25)));
      grad.addColorStop(1, dim ? shadeColor(s.color, -0.15) : s.color);
      ctx.fillStyle = grad;
      ctx.globalAlpha = dim ? 0.55 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.strokeStyle = isHover ? '#fff' : borderColor;
      ctx.lineWidth = isHover ? 2 : 1.5;
      ctx.stroke();
      ctx.restore();
    });
  }

  function updateLegend(hoverIdx) {
    const legEl = document.getElementById(legendId);
    if (!legEl) return;
    legEl.innerHTML = slices.map((d, i) => `
      <span style="display:flex;align-items:center;gap:3px;font-size:10px;color:${hoverIdx===i?d.color:mutedColor};
                   font-weight:${hoverIdx===i?'700':'400'};transition:color .1s">
        <span style="width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,${shadeColor(d.color,0.2)},${d.color});
                     flex-shrink:0;display:inline-block;box-shadow:0 1px 2px rgba(0,0,0,.3)"></span>
        ${d.label} <b style="color:${d.color}">${d.count}</b>
      </span>`).join('');
  }

  function hitTest(mx, my) {
    const dx = (mx - cx) / rx, dy = (my - cy) / ry;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 1.15) return null;
    let ang = Math.atan2(my - cy, mx - cx);
    for (const s of slices) {
      let a0 = s.a0, a1 = s.a1, a = ang;
      while (a < a0) a += 2*Math.PI;
      while (a1 < a0) a1 += 2*Math.PI;
      if (a >= a0 && a <= a1) return slices.indexOf(s);
    }
    return null;
  }

  let currentHover = null;
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top)  * scaleY;
    const idx = hitTest(mx, my);
    if (idx !== currentHover) {
      currentHover = idx;
      canvas.style.cursor = idx !== null ? 'pointer' : 'default';
      draw(currentHover);
      updateLegend(currentHover);
    }
  });
  canvas.addEventListener('mouseleave', () => {
    if (currentHover !== null) {
      currentHover = null;
      canvas.style.cursor = 'default';
      draw(null);
      updateLegend(null);
    }
  });

  draw(null);
  updateLegend(null);
}

// ── Barras interactivas: ilumina la barra bajo el cursor ─────────────────────
function setupBarChart(canvas, DATA, mutedColor, legendId) {
  const W = canvas.width, H = canvas.height;
  const depth  = 6;
  const maxVal = Math.max(...DATA.map(d=>d.count), 1);
  const padL=6, padB=20, padT=14, padR=10;
  const chartH = H - padB - padT;
  const chartW = W - padL - padR - depth;
  const n = DATA.length;
  const barW = Math.max(8, Math.floor(chartW/n) - 6);
  const spacing = (chartW - barW*n) / (n+1);

  const bars = DATA.map((d, i) => {
    const bH = (d.count/maxVal) * chartH;
    const bX = padL + spacing + i*(barW+spacing);
    const bY = padT + chartH - bH;
    return { ...d, bX, bY, barW, bH };
  });

  function draw(hoverIdx) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(128,128,128,.3)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(padL, H-padB); ctx.lineTo(W-padR, H-padB); ctx.stroke();

    bars.forEach((b, i) => {
      const isHover = hoverIdx === i;
      const dim = hoverIdx !== null && !isHover;
      const lift = isHover ? 3 : 0;               // eleva la barra al hacer hover
      const bY = b.bY - lift;
      const top   = shadeColor(b.color, dim ? 0.05 : (isHover ? 0.42 : 0.28));
      const front = dim ? shadeColor(b.color, -0.1) : b.color;
      const side  = shadeColor(b.color, dim ? -0.45 : (isHover ? -0.15 : -0.30));

      ctx.globalAlpha = dim ? 0.45 : 1;

      // Sombra en el piso
      ctx.fillStyle = 'rgba(0,0,0,.15)';
      ctx.beginPath();
      ctx.ellipse(b.bX+barW/2+depth/2, H-padB+2, barW/2+2, 2.5, 0, 0, Math.PI*2);
      ctx.fill();

      if (isHover) { ctx.shadowColor = b.color; ctx.shadowBlur = 12; }

      // Cara lateral
      ctx.fillStyle = side;
      ctx.beginPath();
      ctx.moveTo(b.bX+barW, bY);
      ctx.lineTo(b.bX+barW+depth, bY-depth);
      ctx.lineTo(b.bX+barW+depth, H-padB-depth);
      ctx.lineTo(b.bX+barW, H-padB);
      ctx.closePath(); ctx.fill();

      // Cara frontal
      const grad = ctx.createLinearGradient(0, bY, 0, H-padB);
      grad.addColorStop(0, shadeColor(front, isHover ? 0.2 : 0.12));
      grad.addColorStop(1, shadeColor(front, -0.08));
      ctx.fillStyle = grad;
      ctx.fillRect(b.bX, bY, barW, H-padB-bY);

      // Cara superior
      ctx.fillStyle = top;
      ctx.beginPath();
      ctx.moveTo(b.bX, bY);
      ctx.lineTo(b.bX+depth, bY-depth);
      ctx.lineTo(b.bX+barW+depth, bY-depth);
      ctx.lineTo(b.bX+barW, bY);
      ctx.closePath(); ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = isHover ? 'rgba(255,255,255,.6)' : 'rgba(255,255,255,.25)';
      ctx.lineWidth = isHover ? 1.3 : 0.8;
      ctx.beginPath(); ctx.moveTo(b.bX, bY); ctx.lineTo(b.bX+depth, bY-depth); ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.fillStyle = isHover ? '#fff' : mutedColor;
      ctx.font = isHover ? 'bold 10px system-ui' : 'bold 9px system-ui';
      ctx.textAlign = 'center';
      if (b.count > 0) ctx.fillText(b.count, b.bX+barW/2+depth/2, bY-depth-3);
    });
  }

  function updateLegend(hoverIdx) {
    const legEl = document.getElementById(legendId);
    if (!legEl) return;
    legEl.innerHTML = bars.map((d, i) => `
      <span style="display:flex;align-items:center;gap:3px;font-size:10px;color:${hoverIdx===i?d.color:mutedColor};
                   font-weight:${hoverIdx===i?'700':'400'};transition:color .1s">
        <span style="width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,${shadeColor(d.color,0.2)},${d.color});
                     flex-shrink:0;display:inline-block;box-shadow:0 1px 2px rgba(0,0,0,.3)"></span>
        ${d.label} <b style="color:${d.color}">${d.count}</b>
      </span>`).join('');
  }

  function hitTest(mx, my) {
    for (let i = 0; i < bars.length; i++) {
      const b = bars[i];
      if (mx >= b.bX - 2 && mx <= b.bX + barW + depth + 2 && my >= padT - 10 && my <= H - padB + 4) {
        return i;
      }
    }
    return null;
  }

  let currentHover = null;
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top)  * scaleY;
    const idx = hitTest(mx, my);
    if (idx !== currentHover) {
      currentHover = idx;
      canvas.style.cursor = idx !== null ? 'pointer' : 'default';
      draw(currentHover);
      updateLegend(currentHover);
    }
  });
  canvas.addEventListener('mouseleave', () => {
    if (currentHover !== null) {
      currentHover = null;
      canvas.style.cursor = 'default';
      draw(null);
      updateLegend(null);
    }
  });

  draw(null);
  updateLegend(null);
}

    const route = REAL_ROUTES.find(r => r.id === batchId);
    if (route) {
      batch = {
        id:             route.id,
        numero:         route.route_number || batchId.substring(0,8).toUpperCase(),
        nombre:         route.title || 'Sin nombre',

        fecha_estado:   (route.updated_at||route.scheduled_date||'').split('T')[0] || '—',

function renderBatchDetailChart(routes) {
  const isDark      = document.documentElement.getAttribute('data-theme') !== 'light';
  const borderColor = isDark ? '#1C1C1C' : '#fff';
  const mutedColor  = isDark ? '#666' : '#aaa';

  const RUTA_STATES = [
    { key:'draft',             label:'Borrad.',   color:'#888780' },
    { key:'published',         label:'Public.',   color:'#2E86DE' },
    { key:'assigned',          label:'Asignada',  color:'#3498DB' },
    { key:'scheduled',         label:'Progr.',    color:'#3498DB' },
    { key:'in_progress',       label:'En curso',  color:'#F47B20' },
    { key:'completed',         label:'Complet.',  color:'#27AE60' },
    { key:'incident_reported', label:'Incid.',    color:'#D85A30' },
    { key:'cancelled',         label:'Cancelad.', color:'#555'    },
  ].map(s => ({
    ...s,

  })).filter(s => s.count > 0);

  if (!pie || RUTA_STATES.length === 0) return;

  setupPieChart(pie, RUTA_STATES, borderColor, mutedColor, 'legendBatchDetail');
}

function initBatchMap(batch, routeColors) {
  const container = document.getElementById('batchMapContainer');
  if (!container || typeof L === 'undefined') return;

  // Mock stop coordinates per route for demo
  const mockCoords = {
    'R-2024-001': [[40.7589,-73.9851],[40.7536,-73.9775],[40.7599,-73.9807],[40.7527,-73.9742]],
    'R-2024-002': [[28.5469,-81.3705],[28.5415,-81.3793],[28.5398,-81.3770]],
    'R-2024-003': [[40.7580,-73.8855],[40.6951,-73.8165],[40.7282,-73.8601],[40.6892,-73.8550],[40.6961,-73.7946],[40.6931,-73.8092]],
    'R-2024-004': [[40.8448,-73.8648],[40.8186,-73.8926],[40.8379,-73.9257],[40.7957,-73.9319]],
    'R-2024-005': [[40.6892,-73.9901],[40.6917,-73.9882],[40.7069,-74.0090]],
    'R-2024-006': [[40.7145,-74.0140],[40.7571,-73.9771],[40.7268,-74.0040],[40.7606,-73.9745],[40.7590,-73.9855]],
  };

  const routes  = batch.routes || [];
  const allCoords = routes.flatMap((r,ri) => (mockCoords[r.id]||[]).map(c=>c));
  if (!allCoords.length) return;

  const avgLat = allCoords.reduce((s,c)=>s+c[0],0)/allCoords.length;
  const avgLng = allCoords.reduce((s,c)=>s+c[1],0)/allCoords.length;

  const map = L.map('batchMapContainer').setView([avgLat, avgLng], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO', maxZoom: 19
  }).addTo(map);

  routes.forEach((r, ri) => {
    const color  = routeColors[ri % routeColors.length];
    const coords = mockCoords[r.id] || [];
    if (!coords.length) return;

    // Draw route line
    L.polyline(coords, { color, weight: 2.5, opacity: 0.8 }).addTo(map);

    // Draw stop markers
    coords.forEach((c, si) => {
      L.circleMarker(c, {
        radius: 7, fillColor: color, color: '#fff',
        weight: 2, opacity: 1, fillOpacity: 0.9
      }).addTo(map)
        .bindPopup(`<b>${r.num} — Parada ${si+1}</b><br>${r.stops[si]?.company || ''}`);
    });

    // Route label at centroid
    const cLat = coords.reduce((s,c)=>s+c[0],0)/coords.length;
    const cLng = coords.reduce((s,c)=>s+c[1],0)/coords.length;
    L.marker([cLat, cLng], {
      icon: L.divIcon({
        className: '',
        html: `<div style="background:${color};color:#111;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)">${r.num}</div>`,
        iconAnchor: [20, 10],
      })
    }).addTo(map);
  });
}

function updateVehicleDefaults() {
  const code = document.getElementById('bVehicleType').value;
  const vt   = getVehicleTypeByCode(code);
  if (!vt) return;
  document.getElementById('bPesoMax').value = vt.peso_max_lbs;
  document.getElementById('bVolMax').value  = vt.volumen_max_ft3;
  // Show unidades_max hint if vehicle handles units
  const maxStopsEl = document.getElementById('bMaxStops');
  if (maxStopsEl && vt.maneja_unidades && vt.unidades_max) {
    maxStopsEl.max = vt.unidades_max;
    if (parseInt(maxStopsEl.value) > vt.unidades_max) maxStopsEl.value = vt.unidades_max;
  }
}

function batchNext0() {

function switchStopTab(tab) {
  ['panelCsv','panelManual','panelScan'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  const panel = document.getElementById('panel' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (panel) panel.style.display = '';

  ['tabCsv','tabManual','tabScan'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const isActive = id === 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1);
    el.style.borderBottomColor = isActive ? 'var(--orange)' : 'transparent';
    el.style.color             = isActive ? 'var(--orange)' : 'var(--muted)';
    el.style.fontWeight        = isActive ? '600' : '400';
  });

  if (tab === 'scan') setTimeout(() => document.getElementById('scanInput')?.focus(), 100);
}

// Mismas reglas que StopInput en el backend (main.py) — para avisar en el
// momento en vez de que la fila se pierda en silencio o reviente más tarde.
const HORA_PATTERN = /^([01]\d|2[0-3]):[0-5]\d$/;

function validateStopFields({ destino, direccion, lat, lng, peso, vol, valor, hora }) {
  const errors = [];
  if (!destino || !String(destino).trim()) errors.push('destino vacío');
  if (!direccion || !String(direccion).trim()) errors.push('dirección vacía');

  const isBlank = v => v === undefined || v === null || v === '';
  const latNum = parseFloat(lat), lngNum = parseFloat(lng);
  if (isBlank(lat) || isNaN(latNum) || latNum < -90 || latNum > 90) {
    errors.push(`lat inválida${isBlank(lat) ? ' (vacía)' : ` ("${lat}")`}`);
  }
  if (isBlank(lng) || isNaN(lngNum) || lngNum < -180 || lngNum > 180) {
    errors.push(`lng inválida${isBlank(lng) ? ' (vacía)' : ` ("${lng}")`}`);
  }
  if (!isBlank(peso) && (isNaN(parseFloat(peso)) || parseFloat(peso) < 0)) {
    errors.push(`peso_lbs inválido ("${peso}")`);
  }
  if (!isBlank(vol) && (isNaN(parseFloat(vol)) || parseFloat(vol) < 0)) {
    errors.push(`volumen_ft3 inválido ("${vol}")`);
  }
  if (!isBlank(valor) && (isNaN(parseFloat(valor)) || parseFloat(valor) < 0)) {
    errors.push(`valor_declarado inválido ("${valor}")`);
  }
  if (!isBlank(hora) && !HORA_PATTERN.test(hora)) {
    errors.push(`hora_limite inválida ("${hora}")`);
  }
  return errors;
}

// Defaults globales — se sobreescriben con el límite configurado para la
// compañía (Company.max_csv_rows/max_csv_file_size_mb) al cargar datos reales.
let MAX_CSV_FILE_SIZE_MB = 5;
let MAX_CSV_ROWS         = 2000;

function parseCsvFile(input) {
  const file = input.files[0];
  if (!file) return;

  const maxBytes = MAX_CSV_FILE_SIZE_MB * 1024 * 1024;
  if (file.size > maxBytes) {
    showToast(
      `El archivo pesa ${(file.size / 1024 / 1024).toFixed(1)} MB — el máximo permitido es ${MAX_CSV_FILE_SIZE_MB} MB. Dividilo en archivos más chicos.`,
      'warn'
    );
    input.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const lines = e.target.result.trim().split('\n');

    const dataRowCount = lines.length - 1; // sin contar el header
    if (dataRowCount > MAX_CSV_ROWS) {
      showToast(
        `El CSV tiene ${dataRowCount} filas — el máximo permitido es ${MAX_CSV_ROWS}. Dividilo en archivos más chicos.`,
        'warn'
      );
      input.value = '';
      return;
    }

    const header = lines[0].split(',').map(h => h.trim().toLowerCase());
    const col = (name) => header.indexOf(name);

    // Filas con el mismo destino+dirección son paquetes distintos de la MISMA
    // parada — se agrupan en un único stop con varios items en vez de crear
    // una parada por fila.
    const stopsByKey = new Map();
    const rowErrors  = [];
    let validRowCount = 0;

    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue; // línea en blanco
      const vals = lines[i].split(',');
      const get = (name) => (vals[col(name)] || '').trim();

      const destino   = get('destino');
      const direccion = get('direccion');
      const latStr    = get('lat');
      const lngStr    = get('lng');
      const pesoStr   = get('peso_lbs');
      const volStr    = get('volumen_ft3');
      const valorStr  = get('valor_declarado');
      const horaStr   = get('hora_limite');

      const errors = validateStopFields({
        destino, direccion, lat: latStr, lng: lngStr,
        peso: pesoStr, vol: volStr, valor: valorStr, hora: horaStr,
      });
      if (errors.length > 0) {
        rowErrors.push({ row: i + 1, errors });
        continue;
      }

      const peso  = parseFloat(pesoStr) || 0;
      const vol   = parseFloat(volStr) || 0;
      const valor = parseFloat(valorStr) || 0;
      const item = {
        package_code:   get('codigo_paquete'),
        barcode:        get('codigo_barras'),
        qr_code:        get('codigo_qr'),
        weight_lbs:     peso,
        volume_ft3:     vol,
        declared_value: valor,
      };

      const key = `${destino.toLowerCase()}|${direccion.toLowerCase()}`;
      const existing = stopsByKey.get(key);
      if (existing) {
        existing.items.push(item);
        existing.peso_lbs += peso;
        existing.volumen_ft3 += vol;
        existing.valor_declarado += valor;
      } else {
        stopsByKey.set(key, {
          destino, direccion,
          codigo_postal: get('codigo_postal'),
          lat: parseFloat(latStr), lng: parseFloat(lngStr),
          peso_lbs: peso, volumen_ft3: vol,
          hora_limite: horaStr || '17:00',
          contacto: get('contacto'), telefono: get('telefono'),
          codigo_cliente: get('codigo_cliente'),
          codigo_paquete: get('codigo_paquete'),
          codigo_barras: get('codigo_barras'),
          codigo_qr: get('codigo_qr'),
          notas: get('notas'),
          valor_declarado: valor,
          source: 'csv',
          items: [item],
        });
      }
      validRowCount++;
    }

    stopsByKey.forEach(stop => batchStops.push(stop));
    csvImportErrors = rowErrors;

    const stopCount = stopsByKey.size;
    if (rowErrors.length === 0) {
      showToast(
        validRowCount === stopCount
          ? `${stopCount} parada${stopCount===1?'':'s'} importada${stopCount===1?'':'s'} del CSV`
          : `${validRowCount} paquetes agrupados en ${stopCount} parada${stopCount===1?'':'s'} del CSV`,
        'success'
      );
    } else {
      showToast(`${stopCount} parada${stopCount===1?'':'s'} importada${stopCount===1?'':'s'}, ${rowErrors.length} fila${rowErrors.length===1?'':'s'} con errores — mirá el detalle`, 'warn');
    }
    document.getElementById('content').innerHTML = renderBatchPlanner();
  };
  reader.readAsText(file);
}

function addManualStop() {
  const codigoCliente = document.getElementById('mCodigoCliente').value.trim();
  const destino   = document.getElementById('mDestino').value.trim();
  const direccion = document.getElementById('mDireccion').value.trim();
  const latVal    = document.getElementById('mLat').value;
  const lngVal    = document.getElementById('mLng').value;
  const lat     = parseFloat(latVal);
  const lng     = parseFloat(lngVal);
  const peso    = parseFloat(document.getElementById('mPeso').value) || 0;
  const vol     = parseFloat(document.getElementById('mVol').value) || 0;
  const codigo  = document.getElementById('mCodigo').value.trim();
  if (!codigoCliente) {
    showToast('El código de cliente es obligatorio', 'warn'); return;
  }
  const fieldErrors = validateStopFields({ destino, direccion, lat: latVal, lng: lngVal });
  if (fieldErrors.length > 0) {
    showToast(fieldErrors.join(' · '), 'warn'); return;
  }

  // El paquete cargado ahora mismo en el formulario (si tiene datos) se suma
  // a los que ya se agregaron con "+ Agregar otro paquete a esta parada"
  const items = [...currentStopItems];
  if (peso > 0 || vol > 0 || codigo) {
    items.push({
      package_code:   codigo,
      barcode:        document.getElementById('mBarcode')?.value.trim() || '',
      qr_code:        document.getElementById('mQR')?.value.trim() || '',
      weight_lbs:     peso,
      volume_ft3:     vol,
      declared_value: 0,
    });
  }
  if (items.length === 0) {
    showToast('Completá peso y volumen del paquete', 'warn'); return;
  }

  const totalPeso = items.reduce((s,it) => s + it.weight_lbs, 0);
  const totalVol  = items.reduce((s,it) => s + it.volume_ft3, 0);

  batchStops.push({
    destino, direccion: document.getElementById('mDireccion').value.trim(),
    codigo_postal: document.getElementById('mZip').value.trim(),
    lat, lng, peso_lbs: totalPeso, volumen_ft3: totalVol,
    hora_limite: document.getElementById('mHora').value || '17:00',
    contacto: '', telefono: '',
    codigo_cliente: codigoCliente,
    codigo_paquete: items[0].package_code || '',
    codigo_barras:  items[0].barcode || '',
    codigo_qr:      items[0].qr_code || '',
    notas: document.getElementById('mNotas').value.trim(),
    valor_declarado: 0, source: 'manual',
    items,
  });

  currentStopItems = [];

  // Limpiar solo los campos del formulario — NO re-renderizar todo
  ['mCodigoCliente','mDestino','mDireccion','mZip','mLat','mLng','mPeso','mVol',
   'mCodigo','mBarcode','mQR','mNotas'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const horaEl = document.getElementById('mHora');
  if (horaEl) horaEl.value = '17:00';

  refreshCurrentStopItems();
  // Actualizar solo el panel derecho de la tabla de paradas
  refreshStopsList();
  showToast(`Parada agregada${items.length > 1 ? ` con ${items.length} paquetes` : ''}`, 'success');
}

async function batchRunPlan() {
  if (batchStops.length < 2) return;

  const btn = document.getElementById('generatePlanBtn');
  if (btn) btn.disabled = true;
  startFakeProgress('planProgressWrap', 'planProgressFill', estimateProgressMs(batchStops.length), 'planProgressPct');

  if (!useRealData) {
    // Simulación demo
    batchPlan = simulatePlan(batchStops, batchConfig);
    finishFakeProgress('planProgressWrap', 'planProgressFill', 'planProgressPct');
    setTimeout(() => {
      batchStep = 2;
      document.getElementById('content').innerHTML = renderBatchPlanner();
    }, 350);
    return;
  }

  try {
    const res = await apiPost('/warehouse/batches/plan', {
      vehicle_type:        batchConfig.vehicle_type,
      service_type:        batchConfig.service_type,
      peso_max_lbs:        batchConfig.peso_max,
      volumen_max_ft3:     batchConfig.vol_max,
      max_stops_per_route: batchConfig.max_stops,
      paradas:             batchStops,
    });
    batchPlan = res;
    finishFakeProgress('planProgressWrap', 'planProgressFill', 'planProgressPct');
    setTimeout(() => {
      batchStep = 2;
      document.getElementById('content').innerHTML = renderBatchPlanner();
    }, 350);
  } catch (e) {
    resetFakeProgress('planProgressWrap', 'planProgressFill');
    if (btn) btn.disabled = false;
    showToast('Error al calcular: ' + e.message, 'warn');
  }
}

function simulatePlan(stops, cfg) {
  // Agrupamiento simple para demo (sin sklearn)
  const routeColors = ['#F47B20','#3498DB','#2ECC71','#E74C3C','#9B59B6','#F1C40F'];
  const k = Math.max(1, Math.ceil(stops.length / cfg.max_stops));
  const groups = Array.from({length: k}, () => []);
  stops.forEach((s, i) => groups[i % k].push(s));
  return {
    total_paradas: stops.length, total_rutas: k,
    vehicle_type: cfg.vehicle_type,
    rutas: groups.map((g, idx) => ({
      route_index: idx, color: routeColors[idx % routeColors.length],
      earliest_limit: g.reduce((min, s) => s.hora_limite < min ? s.hora_limite : min, '23:59'),
      total_peso_lbs: g.reduce((s, p) => s + p.peso_lbs, 0).toFixed(1),
      total_vol_ft3:  g.reduce((s, p) => s + p.volumen_ft3, 0).toFixed(1),
      stop_count: g.length,
      centroid_lat: g.reduce((s, p) => s + p.lat, 0) / g.length,
      centroid_lng: g.reduce((s, p) => s + p.lng, 0) / g.length,
      stops: g,
    })),
  };
}

// Render el mapa de la vista previa cuando el DOM esté listo
function renderPlanMap() {
  const container = document.getElementById('planMapContainer');
  if (!container || typeof L === 'undefined' || !batchPlan) return;
  const map = L.map('planMapContainer').setView(
    [batchPlan.rutas[0].centroid_lat, batchPlan.rutas[0].centroid_lng], 11
  );
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO', maxZoom: 19
  }).addTo(map);

  batchPlan.rutas.forEach(r => {
    const line_coords = r.stops.map(s => [s.lat, s.lng]);
    L.polyline(line_coords, { color: r.color, weight: 2, opacity: 0.7 }).addTo(map);
    r.stops.forEach((s, idx) => {
      L.circleMarker([s.lat, s.lng], {
        radius: 7, fillColor: r.color, color: '#fff',
        weight: 2, opacity: 1, fillOpacity: 0.9
      }).addTo(map).bindPopup(`<b>${idx+1}. ${s.destino}</b><br>${s.peso_lbs} lbs · hasta ${s.hora_limite}`);
    });
  });
}

async function batchConfirm() {
  const btn = document.getElementById('btnConfirm');
  btn.disabled = true;
  btn.textContent = 'Creando...';
  startFakeProgress(
    'confirmProgressWrap', 'confirmProgressFill',
    estimateProgressMs(batchPlan?.total_paradas), 'confirmProgressPct'
  );

  if (!useRealData) {
    finishFakeProgress('confirmProgressWrap', 'confirmProgressFill', 'confirmProgressPct');
    showToast(`Lote "${batchConfig.nombre}" creado en demo (${batchPlan.total_rutas} rutas)`, 'success');
    batchStep = 0; batchStops = []; batchPlan = null; batchConfig = { nombre:'', fecha:'', vehicle_type:'furgoneta', service_type:'mensajeria', client_id:'', peso_max:1800, vol_max:200, max_stops:10 };
    document.getElementById('content').innerHTML = renderBatchPlanner();
    return;
  }

  try {
    const res = await apiPost('/warehouse/batches/confirm', {
      nombre:          batchConfig.nombre,
      fecha:           batchConfig.fecha,
      vehicle_type:    batchConfig.vehicle_type,
      service_type:    batchConfig.service_type,
      client_id:       batchConfig.client_id || null,
      scheduled_start: document.getElementById('bSchedStart').value,
      scheduled_end:   document.getElementById('bSchedEnd').value,
      grupos:          batchPlan.rutas,
    });
    finishFakeProgress('confirmProgressWrap', 'confirmProgressFill', 'confirmProgressPct');
    showToast(`Lote creado: ${res.routes} rutas en la DB`, 'success');
    batchStep = 0; batchStops = []; batchPlan = null;
    batchConfig = { nombre:'', fecha:'', vehicle_type:'furgoneta', service_type:'mensajeria', client_id:'', peso_max:1800, vol_max:200, max_stops:10 };
    await loadRealData();
    showView('rutas');
  } catch (e) {
    resetFakeProgress('confirmProgressWrap', 'confirmProgressFill');
    document.getElementById('confirmError').textContent = 'Error: ' + e.message;
    document.getElementById('confirmError').style.display = 'block';
    btn.disabled = false;
    btn.textContent = `✓ Crear lote`;
  }
}

function openRoute(id, fromBatchId) {
  const r = getActiveRoutes().find(x => x.id === id);
  if (!r) return;

  const pctDone = pct(r.stops_done, r.stops_total);
  const fromView = currentView;

  // Botón volver: si venimos de un lote específico, volvemos a su detalle
  const backAction = fromBatchId
    ? `openBatch('${fromBatchId}')`
    : `showView('${fromView}')`;

  // Estados de las paradas
  const stopsPending   = (r.stops||[]).filter(s => s.status==='pending').length;
  const stopsActive    = (r.stops||[]).filter(s => s.status==='active'||s.status==='in_progress').length;

  // Costo de paradas pendientes (proporcional al peso o distribuido equitativamente)
  const totalStops = r.stops_total || (r.stops||[]).length || 1;
  const costPerStop = (r.gross || 0) / totalStops;

function initRouteDetailMap(r) {
  const containerId = `routeMapDetail_${r.id}`;
  const container   = document.getElementById(containerId);
  if (!container) return;

  window._routeDetailMarkers = {};

  // Filtrar paradas con coordenadas válidas
  const stopsWithCoords = (r.stops || []).filter(s => s.lat && s.lng);

  if (!stopsWithCoords.length) {
    container.innerHTML = '<div style="font-size:28px">🗺</div><div style="font-size:12px;color:var(--muted)">Sin coordenadas disponibles</div>';
    return;
  }

  // Limpiar placeholder y crear div limpio para Leaflet
  container.innerHTML = '';
  container.style.display = 'block';

  const ROUTE_COLORS = ['#F47B20','#3498DB','#2ECC71','#E74C3C','#9B59B6','#F1C40F'];
  const color = ROUTE_COLORS[0];

  try {
    if (window._routeDetailMap) {
      window._routeDetailMap.remove();
      window._routeDetailMap = null;
    }

    const map = L.map(containerId, { zoomControl: true, attributionControl: false });
    window._routeDetailMap = map;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const latLngs = [];
    stopsWithCoords.forEach((s, idx) => {
      const ll = [s.lat, s.lng];
      latLngs.push(ll);

      const marker = L.marker(ll, { icon: routeStopIcon(idx + 1, color, false) })
        .addTo(map)
        .bindPopup(`<b>#${idx + 1} — ${s.company || ''}</b><br>${s.address || ''}`);

      window._routeDetailMarkers[s.order] = { marker, num: idx + 1, color };
    });

    // Dibujar línea de ruta
    if (latLngs.length > 1) {
      L.polyline(latLngs, { color, weight: 2.5, opacity: 0.8, dashArray: '6 4' }).addTo(map);
    }

    map.fitBounds(L.latLngBounds(latLngs), { padding: [20, 20] });

  } catch(e) {
    console.error('Error inicializando mapa de ruta:', e);
    container.innerHTML = '<div style="font-size:28px">🗺</div><div style="font-size:12px;color:var(--muted)">Error cargando mapa</div>';
  }
}

function routeStopIcon(num, color, highlighted) {
  const size = highlighted ? 32 : 22;
  return L.divIcon({
    className: '',
    html: `<div style="background:${highlighted ? '#F47B20' : color};color:#111;width:${size}px;height:${size}px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;font-size:${highlighted ? 12 : 10}px;font-weight:700;
            border:2px solid #fff;
            box-shadow:${highlighted ? '0 0 0 5px rgba(244,123,32,.35), 0 2px 8px rgba(0,0,0,.5)' : '0 1px 4px rgba(0,0,0,.4)'}">${num}</div>`,
    iconSize: [size, size], iconAnchor: [size / 2, size / 2],
  });
}

// Resalta la parada en el mapa cuando se pasa el mouse sobre su fila en la matriz
function highlightRouteStop(order) {
  const entry = window._routeDetailMarkers && window._routeDetailMarkers[order];
  if (!entry) return;
  entry.marker.setIcon(routeStopIcon(entry.num, entry.color, true));
  entry.marker.setZIndexOffset(1000);
  entry.marker.openPopup();
}

function unhighlightRouteStop(order) {
  const entry = window._routeDetailMarkers && window._routeDetailMarkers[order];
  if (!entry) return;
  entry.marker.setIcon(routeStopIcon(entry.num, entry.color, false));
  entry.marker.setZIndexOffset(0);
  entry.marker.closePopup();
}

// ── Barra de progreso simulada ───────────────────────────────────────────────
// El servidor no reporta progreso real (es un único request/response), así que
// se anima hasta un tope (92%) durante una duración estimada según la cantidad
// de paradas, y se completa al 100% recién cuando la respuesta llega — nunca
// promete un % que no se puede sostener si el servidor tarda más de lo esperado.
let _fakeProgressTimers = {};

function estimateProgressMs(stopCount) {
  return Math.min(Math.max((stopCount || 1) * 15, 600), 8000);
}

function startFakeProgress(wrapId, fillId, estimatedMs, pctLabelId) {
  const wrap = document.getElementById(wrapId);
  const fill = document.getElementById(fillId);
  const label = pctLabelId ? document.getElementById(pctLabelId) : null;
  if (!wrap || !fill) return;
  wrap.style.display = 'block';

  clearInterval(_fakeProgressTimers[fillId]);
  let pct = 5;
  fill.style.width = pct + '%';
  if (label) label.textContent = Math.round(pct) + '%';
  const stepMs = 120;
  const steps = Math.max(estimatedMs / stepMs, 4);
  const increment = 87 / steps; // deja el resto para el salto final a 100%
  _fakeProgressTimers[fillId] = setInterval(() => {
    pct = Math.min(pct + increment, 92);
    fill.style.width = pct + '%';
    if (label) label.textContent = Math.round(pct) + '%';
  }, stepMs);
}

function finishFakeProgress(wrapId, fillId, pctLabelId) {
  clearInterval(_fakeProgressTimers[fillId]);
  delete _fakeProgressTimers[fillId];
  const fill = document.getElementById(fillId);
  const label = pctLabelId ? document.getElementById(pctLabelId) : null;
  if (fill) fill.style.width = '100%';
  if (label) label.textContent = '100%';
  setTimeout(() => {
    const wrap = document.getElementById(wrapId);
    if (wrap) wrap.style.display = 'none';
    if (fill) fill.style.width = '0%';
  }, 350);
}

function resetFakeProgress(wrapId, fillId) {
  clearInterval(_fakeProgressTimers[fillId]);
  delete _fakeProgressTimers[fillId];
  const wrap = document.getElementById(wrapId);
  const fill = document.getElementById(fillId);
  if (wrap) wrap.style.display = 'none';
  if (fill) fill.style.width = '0%';
}

// ── Cambio manual de estado de lote ──────────────────────────────────────────
async function changeBatchStatus(batchId, newStatus) {
  const batch = getActiveBatches().find(b => b.id === batchId);
  if (!batch) return;

  // Anular un lote ya aprobado es más serio que cancelar un borrador — exige motivo
  if (newStatus === 'cancelled' && batch.status === 'approved') {
    openAnularLoteModal(batchId, batch.numero);
    return;
  }

  const labels = { approved: 'aprobar', cancelled: 'cancelar' };
  const label  = labels[newStatus] || newStatus;

  if (!confirm(`¿Seguro que querés ${label} el lote ${batch.numero}?`)) return;

  await applyBatchStatusChange(batchId, newStatus, null);
}

function openAnularLoteModal(batchId, numero) {
  document.getElementById('stopModalTitle').textContent = '✕ Anular lote';
  document.getElementById('stopModalSub').textContent   = numero || '';
  document.getElementById('stopModalBody').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:13px;color:var(--muted)">
        Este lote ya fue aprobado y ofertado a transporte — indicá el motivo de la anulación.
      </div>
      <div>
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Motivo de la anulación *</label>
        <textarea id="anularReason" placeholder="Ej: el cliente canceló el pedido, cambio de fecha, error en la carga..."
          style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--border);
                 border-radius:8px;color:var(--white);font-size:14px;resize:vertical;min-height:80px;box-sizing:border-box"></textarea>
      </div>
      <div id="anularError" style="color:var(--red,#D85A30);font-size:13px;display:none"></div>
      <button class="btn btn-primary" style="width:100%;background:var(--red,#D85A30);border-color:var(--red,#D85A30)"
        id="anularSubmitBtn" onclick="submitAnularLote('${batchId}')">✕ Anular lote</button>
    </div>
  `;
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';
}

async function submitAnularLote(batchId) {
  const reason = document.getElementById('anularReason')?.value.trim();
  const errEl  = document.getElementById('anularError');
  if (!reason) {
    errEl.textContent = 'El motivo de la anulación es obligatorio';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const btn = document.getElementById('anularSubmitBtn');
  btn.disabled = true; btn.textContent = 'Anulando...';

  const ok = await applyBatchStatusChange(batchId, 'cancelled', reason);
  if (ok) {
    closeStopModal();
  } else {
    btn.disabled = false; btn.textContent = '✕ Anular lote';
  }
}

async function applyBatchStatusChange(batchId, newStatus, reason) {
  const batch = getActiveBatches().find(b => b.id === batchId);
  if (!batch) return false;

  if (!useRealData) {
    batch.status = newStatus;
    batch.fecha_estado = new Date().toISOString().split('T')[0];
    if (reason) { batch.cancellation_reason = reason; batch.cancelled_at = new Date().toISOString(); }
    showToast(
      newStatus === 'approved' ? `Lote ${batch.numero} aprobado`
        : (reason ? `Lote ${batch.numero} anulado` : `Lote ${batch.numero} cancelado`),
      newStatus === 'cancelled' ? 'info' : 'success'
    );
    document.getElementById('content').innerHTML = renderDashboard();
    return true;
  }

  try {
    await apiPost(`/warehouse/batches/${batchId}/status`, { status: newStatus, reason: reason || null });
    showToast(
      newStatus === 'approved' ? `Lote aprobado` : (reason ? `Lote anulado` : `Lote cancelado`),
      newStatus === 'cancelled' ? 'info' : 'success'
    );
    await loadRealData();
    document.getElementById('content').innerHTML = renderDashboard();
    return true;
  } catch (e) {
    showToast('Error: ' + e.message, 'warn');
    return false;
  }
}

function addStopToAddRouteList() {
  const destino   = document.getElementById('arDestino').value.trim();
  const direccion = document.getElementById('arDireccion').value.trim();
  const latVal    = document.getElementById('arLat').value;
  const lngVal    = document.getElementById('arLng').value;
  const lat       = parseFloat(latVal);
  const lng       = parseFloat(lngVal);
  const peso      = parseFloat(document.getElementById('arPeso').value) || 0;
  const vol       = parseFloat(document.getElementById('arVol').value) || 0;
  const fieldErrors = validateStopFields({ destino, direccion, lat: latVal, lng: lngVal });
  if (fieldErrors.length > 0) {
    showToast(fieldErrors.join(' · '), 'warn'); return;
  }
  addRouteState.stops.push({ destino, direccion, lat, lng, peso_lbs: peso, volumen_ft3: vol, hora_limite: '17:00', source: 'manual' });
  ['arDestino','arDireccion','arLat','arLng','arPeso','arVol'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('arStopsList').innerHTML = renderAddRouteStopsList();
}

function removeAddRouteStop(i) {
  addRouteState.stops.splice(i, 1);
  document.getElementById('arStopsList').innerHTML = renderAddRouteStopsList();
}

async function submitAddRoute() {
  if (!useRealData) {
    showToast('Agregar rutas requiere estar conectado a datos reales', 'info');
    closeStopModal();
    return;
  }

  const title = document.getElementById('arTitle').value.trim();
  const fecha = document.getElementById('arFecha').value;
  const errEl = document.getElementById('arError');
  errEl.style.display = 'none';

  if (!title || !fecha) {
    errEl.textContent = 'Completá el título y la fecha'; errEl.style.display = 'block'; return;
  }
  if (addRouteState.stops.length === 0) {
    errEl.textContent = 'Agregá al menos una parada'; errEl.style.display = 'block'; return;
  }

  const btn = document.getElementById('arSubmitBtn');
  btn.disabled = true; btn.textContent = 'Creando...';
  try {
    await apiPost(`/warehouse/batches/${addRouteState.batchId}/routes`, {
      title,
      service_mode: document.getElementById('arServiceMode').value,
      required_vehicle_type: document.getElementById('arVehicleType').value,
      scheduled_date: fecha,
      scheduled_start: document.getElementById('arStart').value,
      scheduled_end: document.getElementById('arEnd').value,
      stops: addRouteState.stops,
    });
    closeStopModal();
    showToast('Ruta agregada al lote', 'success');
    await loadRealData();
    openBatch(addRouteState.batchId);
  } catch (e) {
    errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Crear ruta';
  }
}

async function deleteRouteFromBatch(batchId, routeId) {
  if (!useRealData) {
    showToast('Eliminar rutas requiere estar conectado a datos reales', 'info');
    return;
  }
  if (!confirm('¿Eliminar esta ruta del lote? Esta acción no se puede deshacer.')) return;
  try {
    await apiDelete(`/warehouse/batches/${batchId}/routes/${routeId}`);
    showToast('Ruta eliminada', 'success');
    await loadRealData();
    openBatch(batchId);
  } catch (e) {
    showToast('Error: ' + e.message, 'warn');
  }
}

// ── Editar datos generales de una ruta en borrador ──────────────────────────
let editRouteState = null;

async function openEditRouteModal(routeId) {
  document.getElementById('stopModalTitle').textContent = '✏️ Editar ruta';
  document.getElementById('stopModalSub').textContent   = '';
  document.getElementById('stopModalBody').innerHTML = `
    <div style="text-align:center;padding:24px;color:var(--muted)">⏳ Cargando...</div>
  `;
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';

  let route;
  if (useRealData) {
    try {
      route = await apiGet(`/warehouse/routes/${routeId}`);
    } catch (e) {
      document.getElementById('stopModalBody').innerHTML = `<div style="color:var(--red,#D85A30)">Error: ${e.message}</div>`;
      return;
    }
  } else {
    const r = getActiveRoutes().find(x => x.id === routeId);

    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">

        <input id="erFecha" type="date" value="${dateVal}" style="width:100%;padding:7px 9px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:13px;box-sizing:border-box">
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">Hora inicio</label>
        <input id="erStart" type="time" value="${startVal}" style="width:100%;padding:7px 9px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:13px;box-sizing:border-box">
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">Hora fin</label>
        <input id="erEnd" type="time" value="${endVal}" style="width:100%;padding:7px 9px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:13px;box-sizing:border-box">
      </div>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:2px">Tipo de vehículo</label>
      <select id="erVehicleType" style="width:100%;padding:7px 9px;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--white);font-size:13px;box-sizing:border-box">
        ${getVehicleTypes().map(vt => `<option value="${vt.code}" ${vt.code===route.required_vehicle_type?'selected':''}>${vt.name}</option>`).join('')}
      </select>
    </div>
    <div id="erError" style="color:var(--red,#D85A30);font-size:13px;display:none;margin-bottom:8px"></div>
    <button id="erSubmitBtn" class="btn btn-primary" style="width:100%" onclick="submitEditRoute()">Guardar cambios</button>
  `;
}

async function submitEditRoute() {
  if (!useRealData) {
    showToast('Editar rutas requiere estar conectado a datos reales', 'info');
    closeStopModal();
    return;
  }
  const btn = document.getElementById('erSubmitBtn');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    await apiPatch(`/warehouse/routes/${editRouteState.id}`, {
      title: document.getElementById('erTitle').value.trim(),
      scheduled_date: document.getElementById('erFecha').value || null,
      scheduled_start: document.getElementById('erStart').value || null,
      scheduled_end: document.getElementById('erEnd').value || null,
      required_vehicle_type: document.getElementById('erVehicleType').value,
    });
    const routeId = editRouteState.id;
    closeStopModal();
    showToast('Ruta actualizada', 'success');
    await loadRealData();
    openRoute(routeId);
  } catch (e) {
    document.getElementById('erError').textContent = 'Error: ' + e.message;
    document.getElementById('erError').style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar cambios';
  }
}

// ── Agregar / editar / eliminar paradas de una ruta en borrador ─────────────
async function openAddStopModal(routeId) {
  document.getElementById('stopModalTitle').textContent = '+ Agregar parada';
  document.getElementById('stopModalSub').textContent   = '';
  document.getElementById('stopModalBody').innerHTML = renderStopForm(routeId, null);
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';
}

function openEditStopModal(routeId, stopOrder) {
  const r = getActiveRoutes().find(x => x.id === routeId);
  const stop = r?.stops.find(s => String(s.order) === String(stopOrder));
  if (!stop) return;
  document.getElementById('stopModalTitle').textContent = '✏️ Editar parada';
  document.getElementById('stopModalSub').textContent   = stop.company || '';
  document.getElementById('stopModalBody').innerHTML = renderStopForm(routeId, stop);
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';
}

async function submitAddStop(routeId) {
  if (!useRealData) {
    showToast('Agregar paradas requiere estar conectado a datos reales', 'info');
    closeStopModal();
    return;
  }
  const destino   = document.getElementById('stDestino').value.trim();
  const direccion = document.getElementById('stDireccion').value.trim();
  const latVal    = document.getElementById('stLat').value;
  const lngVal    = document.getElementById('stLng').value;
  const lat       = parseFloat(latVal);
  const lng       = parseFloat(lngVal);
  const peso      = parseFloat(document.getElementById('stPeso').value) || 0;
  const vol       = parseFloat(document.getElementById('stVol').value) || 0;
  const errEl     = document.getElementById('stError');
  errEl.style.display = 'none';
  const fieldErrors = validateStopFields({ destino, direccion, lat: latVal, lng: lngVal, peso, vol });
  if (fieldErrors.length > 0) {
    errEl.textContent = fieldErrors.join(' · '); errEl.style.display = 'block'; return;
  }
  const btn = document.getElementById('stSubmitBtn');
  btn.disabled = true; btn.textContent = 'Agregando...';
  try {
    await apiPost(`/warehouse/routes/${routeId}/stops`, {
      destino, direccion, lat, lng, peso_lbs: peso, volumen_ft3: vol,
      codigo_postal: document.getElementById('stZip').value.trim(),
      hora_limite: document.getElementById('stHora').value || '17:00',
      codigo_paquete: document.getElementById('stCodigo').value.trim(),
      notas: document.getElementById('stNotas').value.trim(),
    });
    closeStopModal();
    showToast('Parada agregada', 'success');
    await loadRealData();
    openRoute(routeId);
  } catch (e) {
    errEl.textContent = 'Error: ' + e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Agregar parada';
  }
}

async function submitEditStop(routeId, stopOrder) {
  if (!useRealData) {
    showToast('Editar paradas requiere estar conectado a datos reales', 'info');
    closeStopModal();
    return;
  }
  const r = getActiveRoutes().find(x => x.id === routeId);
  const stop = r?.stops.find(s => String(s.order) === String(stopOrder));
  if (!stop) { closeStopModal(); return; }

  const btn = document.getElementById('stSubmitBtn');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    await apiPatch(`/warehouse/routes/${routeId}/stops/${stop.id}`, {
      destino: document.getElementById('stDestino').value.trim(),
      direccion: document.getElementById('stDireccion').value.trim(),
      codigo_postal: document.getElementById('stZip').value.trim(),
      lat: parseFloat(document.getElementById('stLat').value) || null,
      lng: parseFloat(document.getElementById('stLng').value) || null,
      hora_limite: document.getElementById('stHora').value || null,
      notas: document.getElementById('stNotas').value.trim(),
    });
    closeStopModal();
    showToast('Parada actualizada', 'success');
    await loadRealData();
    openRoute(routeId);
  } catch (e) {
    document.getElementById('stError').textContent = 'Error: ' + e.message;
    document.getElementById('stError').style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar cambios';
  }
}

async function deleteStopFromRoute(routeId, stopOrder) {
  if (!useRealData) {
    showToast('Eliminar paradas requiere estar conectado a datos reales', 'info');
    return;
  }
  const r = getActiveRoutes().find(x => x.id === routeId);
  const stop = r?.stops.find(s => String(s.order) === String(stopOrder));
  if (!stop) return;
  if (!confirm('¿Eliminar esta parada?')) return;
  try {
    await apiDelete(`/warehouse/routes/${routeId}/stops/${stop.id}`);
    showToast('Parada eliminada', 'success');
    await loadRealData();
    openRoute(routeId);
  } catch (e) {
    showToast('Error: ' + e.message, 'warn');
  }
}
