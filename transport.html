<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muevo Drive — Portal Transportista</title>
<style>
  /* ── Reset & base ──────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0D0D0D;
    --surface:   #151515;
    --card:      #1C1C1C;
    --card2:     #222222;
    --orange:    #F47B20;
    --orange-dim: rgba(244,123,32,0.10);
    --orange-bdr: rgba(244,123,32,0.25);
    --white:     #F8FAFB;
    --muted:     #8A8A8A;
    --border:    rgba(255,255,255,0.07);
    --green:     #27AE60;
    --green-dim: rgba(39,174,96,0.10);
    --green-bdr: rgba(39,174,96,0.25);
    --red:       #E74C3C;
    --red-dim:   rgba(231,76,60,0.10);
    --blue:      #2E86DE;
    --blue-dim:  rgba(46,134,222,0.10);
    --blue-bdr:  rgba(46,134,222,0.25);
    --yellow:    #F1C40F;
    --yellow-dim:rgba(241,196,15,0.10);
    --radius:    10px;
    --radius-lg: 14px;
    --font:      -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
  }

  /* ── Light mode overrides ───────────────────────────────────────────────── */
  [data-theme="light"] {
    --bg:        #F4F4F2;
    --surface:   #FFFFFF;
    --card:      #FFFFFF;
    --card2:     #F0EFE8;
    --white:     #1A1A1A;
    --muted:     #6B6B6B;
    --border:    rgba(0,0,0,0.09);
    --orange-dim: rgba(244,123,32,0.08);
    --orange-bdr: rgba(244,123,32,0.20);
    --green-dim: rgba(39,174,96,0.08);
    --green-bdr: rgba(39,174,96,0.20);
    --red-dim:   rgba(231,76,60,0.08);
    --blue-dim:  rgba(46,134,222,0.08);
    --blue-bdr:  rgba(46,134,222,0.20);
    --yellow-dim:rgba(241,196,15,0.08);
  }

  [data-theme="light"] body { color: var(--white); }

  [data-theme="light"] .sidebar,
  [data-theme="light"] .topbar {
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  [data-theme="light"] table th {
    background: #EEECEA;
    color: #444;
  }

  [data-theme="light"] .kpi-card {
    border: 1px solid rgba(0,0,0,0.07);
  }

  [data-theme="light"] input,
  [data-theme="light"] select {
    background: #FAFAF8 !important;
    border-color: rgba(0,0,0,0.12) !important;
    color: #1A1A1A !important;
  }


  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ── Sidebar ──────────────────────────────────────────────────────────── */
  .sidebar {
    width: 220px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    transition: transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s;
  }

  .sidebar-logo {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--orange);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .logo-text { font-size: 15px; font-weight: 600; color: var(--white); letter-spacing: -.3px; }
  .logo-sub  { font-size: 10px; color: var(--orange); font-weight: 500; letter-spacing: .5px; }

  .sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }

  .nav-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    padding: 10px 8px 4px;
  }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--muted); transition: all .15s;
    border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--card); color: var(--white); }
  .nav-item.active { background: var(--orange-dim); color: var(--orange); }
  .nav-item .nav-icon { width: 16px; text-align: center; font-size: 14px; }
  .nav-badge {
    margin-left: auto;
    background: var(--orange); color: #111;
    font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 10px;
  }

  .sidebar-bottom {
    padding: 12px 10px;
    border-top: 1px solid var(--border);
  }

  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    cursor: pointer;
  }
  .user-card:hover { background: var(--card); }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #111; flex-shrink: 0;
  }
  .user-name  { font-size: 12px; font-weight: 500; color: var(--white); }
  .user-role  { font-size: 10px; color: var(--muted); }


  /* ── Sidebar — floating mode ──────────────────────────────────────────── */
  /* When body has .sidebar-floating, sidebar slides off-canvas by default   */
  body.sidebar-floating .sidebar {
    transform: translateX(-100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s;
    box-shadow: none;
    z-index: 200;
  }
  body.sidebar-floating .sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 32px rgba(0,0,0,0.35);
  }
  body.sidebar-floating .main {
    margin-left: 0 !important;
    transition: margin-left .22s cubic-bezier(.4,0,.2,1);
  }
  /* Overlay behind floating sidebar */
  #sidebarOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 199;
    backdrop-filter: blur(2px);
  }
  body.sidebar-floating #sidebarOverlay { display: block; opacity: 0; pointer-events: none; transition: opacity .22s; }
  body.sidebar-floating .sidebar.open ~ #sidebarOverlay,
  body.sidebar-floating #sidebarOverlay.visible { opacity: 1; pointer-events: auto; }

  /* Hamburger button — only visible in floating mode */
  #hamburgerBtn {
    display: none;
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font-size: 18px;
    color: var(--muted); transition: color .15s; margin-right: 4px;
  }
  body.sidebar-floating #hamburgerBtn { display: inline-flex; align-items: center; }

  /* Sidebar pin toggle button — always visible in topbar */
  #sidebarPinBtn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; cursor: pointer; font-size: 15px;
    color: var(--muted); transition: all .15s; margin-right: 4px;
    title: "Fijar / soltar panel";
  }
  #sidebarPinBtn:hover { color: var(--white); }

  /* ── Main ─────────────────────────────────────────────────────────────── */
  .main {
    margin-left: 220px;
    flex: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Topbar ───────────────────────────────────────────────────────────── */
  .topbar {
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    position: sticky; top: 0; z-index: 50;
  }

  .topbar-title { font-size: 15px; font-weight: 600; color: var(--white); }
  .topbar-sub   { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
  }
  .btn-primary { background: var(--orange); color: #111; }
  .btn-primary:hover { background: #f08c3a; }
  .btn-ghost {
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--white); border-color: rgba(255,255,255,0.15); }

  /* ── Content ──────────────────────────────────────────────────────────── */
  .content { padding: 28px; flex: 1; }

  /* ── KPI row ──────────────────────────────────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .kpi-label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .3px; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 600; letter-spacing: -1px; color: var(--white); }
  .kpi-value.orange { color: var(--orange); }
  .kpi-value.green  { color: var(--green);  }
  .kpi-sub {
    font-size: 11px; color: var(--muted); margin-top: 6px;
    display: flex; align-items: center; gap: 4px;
  }
  .kpi-sub.up   { color: var(--green); }
  .kpi-sub.down { color: var(--red);   }

  /* ── Section header ───────────────────────────────────────────────────── */
  .section-hdr {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--white); }
  .section-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Table ────────────────────────────────────────────────────────────── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .table-filters {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
  }

  .search-box {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px;
  }
  .search-box input {
    background: none; border: none; outline: none;
    color: var(--white); font-size: 12px; font-family: var(--font);
    flex: 1;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-icon { color: var(--muted); font-size: 13px; }

  .filter-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--white); }
  .filter-btn.active { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 10px 18px;
    text-align: left; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .6px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--card2); }
  tbody td { padding: 13px 18px; font-size: 13px; color: var(--white); vertical-align: middle; }

  /* ── Badges ───────────────────────────────────────────────────────────── */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .badge-green  { background: var(--green-dim);  color: var(--green);  border: 1px solid var(--green-bdr); }
  .badge-orange { background: var(--orange-dim); color: var(--orange); border: 1px solid var(--orange-bdr); }
  .badge-blue   { background: var(--blue-dim);   color: var(--blue);   border: 1px solid var(--blue-bdr); }
  .badge-red    { background: var(--red-dim);     color: var(--red);    border: 1px solid rgba(231,76,60,.25); }
  .badge-muted  { background: var(--card2);       color: var(--muted);  border: 1px solid var(--border); }
  .badge-yellow { background: var(--yellow-dim);  color: var(--yellow); border: 1px solid rgba(241,196,15,.25); }

  /* ── Upload zone ──────────────────────────────────────────────────────── */
  .upload-zone {
    border: 2px dashed var(--orange-bdr);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    background: var(--orange-dim);
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 16px;
  }
  .upload-zone:hover { border-color: var(--orange); background: rgba(244,123,32,0.15); }
  .upload-icon { font-size: 32px; margin-bottom: 10px; }
  .upload-title { font-size: 14px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
  .upload-sub   { font-size: 12px; color: var(--muted); }
  .upload-link  { color: var(--orange); text-decoration: underline; cursor: pointer; }

  /* ── Grid layouts ─────────────────────────────────────────────────────── */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 24px; }

  /* ── Card ─────────────────────────────────────────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
  }
  .card-title { font-size: 13px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
  .card-sub   { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* ── Route detail panel ───────────────────────────────────────────────── */
  .detail-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 420px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 200;
    transform: translateX(100%);
    transition: transform .2s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .detail-panel.open { transform: translateX(0); }

  .panel-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .panel-close {
    width: 28px; height: 28px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; font-size: 16px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 10px;
  }
  .panel-close:hover { color: var(--white); }
  .panel-body { flex: 1; overflow-y: auto; padding: 20px; }

  .stop-timeline { display: flex; flex-direction: column; gap: 0; }
  .stop-item {
    display: flex; gap: 12px;
    position: relative; padding-bottom: 16px;
  }
  .stop-item:last-child { padding-bottom: 0; }
  .stop-item::before {
    content: '';
    position: absolute; left: 13px; top: 28px; bottom: 0;
    width: 1px; background: var(--border);
  }
  .stop-item:last-child::before { display: none; }
  .stop-dot {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; z-index: 1;
  }
  .stop-dot.done    { background: var(--green);  color: #fff; }
  .stop-dot.active  { background: var(--orange); color: #111; }
  .stop-dot.pending { background: var(--card2);  color: var(--muted); border: 1px solid var(--border); }
  .stop-content { flex: 1; }
  .stop-company { font-size: 13px; font-weight: 500; color: var(--white); margin-bottom: 2px; }
  .stop-address { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .stop-meta    { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── Map placeholder ──────────────────────────────────────────────────── */
  .map-box {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    height: 180px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .map-box::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent, transparent 20px,
      rgba(255,255,255,0.015) 20px, rgba(255,255,255,0.015) 21px
    );
  }
  .map-label { font-size: 12px; color: var(--muted); z-index: 1; }

  /* ── Progress bar ─────────────────────────────────────────────────────── */
  .prog-wrap { margin-bottom: 16px; }
  .prog-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 11px; color: var(--muted); }
  .prog-track { height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .prog-fill  { height: 100%; border-radius: 3px; background: var(--orange); }
  .prog-fill.green { background: var(--green); }

  /* ── Cost row ─────────────────────────────────────────────────────────── */
  .cost-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .cost-row:last-child { border: none; }
  .cost-label { color: var(--muted); }
  .cost-value { font-weight: 500; color: var(--white); }
  .cost-value.orange { color: var(--orange); }
  .cost-value.green  { color: var(--green); }

  /* ── CSV preview table ────────────────────────────────────────────────── */
  .csv-preview {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden; margin-bottom: 16px;
  }
  .csv-preview table { font-size: 11px; font-family: var(--font-mono); }
  .csv-preview thead th { background: var(--card); font-size: 10px; letter-spacing: .3px; }
  .csv-preview tbody td { padding: 8px 14px; color: var(--muted); }
  .csv-preview tbody tr:hover { background: rgba(255,255,255,0.03); }

  /* ── Metric mini ──────────────────────────────────────────────────────── */
  .metric-row {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .metric {
    flex: 1; background: var(--card2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px;
    text-align: center;
  }
  .metric-val { font-size: 18px; font-weight: 600; color: var(--white); }
  .metric-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; }

  /* ── Alert banner ─────────────────────────────────────────────────────── */
  .alert {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 16px; border-radius: var(--radius);
    margin-bottom: 16px; font-size: 12px;
  }
  .alert-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
  .alert-body { flex: 1; line-height: 1.5; }
  .alert-title { font-weight: 600; margin-bottom: 2px; }
  .alert.warn { background: var(--yellow-dim); border: 1px solid rgba(241,196,15,.25); color: var(--yellow); }
  .alert.info { background: var(--blue-dim);   border: 1px solid var(--blue-bdr);     color: var(--blue); }
  .alert.ok   { background: var(--green-dim);  border: 1px solid var(--green-bdr);    color: var(--green); }

  /* ── Tabs ─────────────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    padding: 10px 18px; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer; border: none; background: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all .15s;
  }
  .tab:hover { color: var(--white); }
  .tab.active { color: var(--orange); border-bottom-color: var(--orange); }

  /* ── Empty state ──────────────────────────────────────────────────────── */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-title { font-size: 14px; font-weight: 500; color: var(--white); margin-bottom: 6px; }
  .empty-sub   { font-size: 12px; line-height: 1.6; }

  /* ── Overlay ──────────────────────────────────────────────────────────── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 150;
  }
  .overlay.show { display: block; }

  /* ── Scrollbar ────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--card2); border-radius: 3px; }

  /* ── Toast ────────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 13px;
    display: flex; align-items: center; gap: 10px;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all .25s ease;
    max-width: 320px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.info    { border-left: 3px solid var(--orange); }

  #liveMap { width: 100%; height: 320px; border-radius: var(--radius); background: var(--card2); }
  .leaflet-container { background: #1c1c1c !important; border-radius: var(--radius); }
  .leaflet-control-attribution { background: rgba(0,0,0,0.6) !important; color: var(--muted) !important; font-size: 9px !important; }

// ── API layer ─────────────────────────────────────────────────────────────
const API_BASE = '/api/v1'; // ruta relativa — transport.html se sirve desde el mismo origen que la API
let authToken = null;
let useRealData = false;

async function apiLogin(email, password) {
  const body = new URLSearchParams({ username: email, password });
  const res = await fetch(`${API_BASE}/auth/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body,
  });
  if (!res.ok) throw new Error('Login fallido');
  const data = await res.json();
  authToken = data.access_token;
  return data;
}

async function apiGet(path) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { 'Authorization': `Bearer ${authToken}` },
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${authToken}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`API error ${res.status}: ${errText}`);
  }
  return res.json();
}

// ── Helpers ───────────────────────────────────────────────────────────────
function statusBadge(status) {
  const map = {
    offered:     ['badge-yellow', '⏳ Ofrecida'],
    in_progress: ['badge-orange','En curso'],
    assigned:    ['badge-blue',  'Asignada'],
    scheduled:   ['badge-blue',  'Programada'],
    completed:   ['badge-green', 'Completada'],
    cancelled:   ['badge-red',   'Cancelada'],
    pending:     ['badge-muted', 'Pendiente'],
  };
  const [cls, label] = map[status] || ['badge-muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function modeBadge(mode) {
  const map = {
    'Mensajería': ['badge-blue',   '📦'],
    'Empleados':  ['badge-green',  '👥'],
    'Logística':  ['badge-yellow', '🏭'],
  };
  const [cls, icon] = map[mode] || ['badge-muted','📋'];
  return `<span class="badge ${cls}">${icon} ${mode}</span>`;
}

function stopDot(status) {
  if (status === 'done')    return 'done';
  if (status === 'active')  return 'active';
  return 'pending';
}

function stopIcon(status) {
  if (status === 'done')    return '✓';
  if (status === 'active')  return '⬤';
  return '○';
}

function pct(a, b) { return b > 0 ? Math.round(a/b*100) : 0; }
function fmt$(n)    { return '$' + n.toFixed(2); }

// ── Views ─────────────────────────────────────────────────────────────────
let currentView = 'dashboard';
let activeTab   = 'todas';

function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const idx = ['dashboard','rutas','negociacion','flota','tracking','facturacion'].indexOf(view);
  document.querySelectorAll('.nav-item')[idx]?.classList.add('active');

  const titles = {
    dashboard:   ['Dashboard', 'Resumen de operaciones · Hoy, 15 jun 2026'],
    rutas:       ['Rutas', 'Ofrecidas, en curso, y completadas'],
    negociacion: ['Negociación', 'Marketplace de rutas abiertas a pujas'],
    flota:       ['Mi flota', 'Vehículos y conductores de tu empresa'],
    tracking:    ['Tracking de flota', 'Posición en vivo de todos tus vehículos'],
    facturacion: ['Facturación', 'Pagos recibidos por rutas completadas'],
  };
  const [title, sub] = titles[view] || ['', ''];
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('topbarSub').textContent   = sub;

  const renders = {
    dashboard:   renderDashboard,
    rutas:       renderRutas,
    negociacion: renderNegociacion,
    flota:       renderFlota,
    tracking:    renderTracking,
    facturacion: renderFacturacion,
  };
  document.getElementById('content').innerHTML = (renders[view] || (() => ''))();
  updateOfferedBadge();

  if (view === 'tracking') {
    setTimeout(initLiveTracking, 0); // esperar a que el DOM tenga #liveMap
  } else {
    disconnectTrackingWS();
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg, type='info') {
  const el = document.getElementById('toast');
  const icons = { success:'✅', info:'ℹ️', warn:'⚠️' };
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}


// ── Theme (dark / light) ───────────────────────────────────────────────────
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('muevo_theme', next);
  applyTheme(next);
}

// Aplicar tema guardado lo antes posible (evita flash de tema incorrecto al cargar)
(function initTheme() {
  const saved = localStorage.getItem('muevo_theme') || 'dark';
  applyTheme(saved);
})();


// ── Sidebar pin / float ───────────────────────────────────────────────────
function applySidebarMode(mode) {
  // mode: 'fixed' | 'floating'
  const pinBtn = document.getElementById('sidebarPinBtn');
  if (mode === 'floating') {
    document.body.classList.add('sidebar-floating');
    if (pinBtn) { pinBtn.textContent = '📌'; pinBtn.title = 'Fijar panel'; pinBtn.style.opacity = '.5'; }
  } else {
    document.body.classList.remove('sidebar-floating');
    closeSidebar();
    if (pinBtn) { pinBtn.textContent = '📍'; pinBtn.title = 'Soltar panel'; pinBtn.style.opacity = '1'; }
  }
}

function toggleSidebarMode() {
  const isFloating = document.body.classList.contains('sidebar-floating');
  const next = isFloating ? 'fixed' : 'floating';
  localStorage.setItem('muevo_sidebar', next);
  applySidebarMode(next);
}

async function loadRealData() {

// Mapea una RouteHeader real (API) al shape que usa el resto del HTML/JS
function mapRealRoute(r) {
  // "offered" = el dispatcher asignó esta empresa pero todavía no hay
  // vehículo propio asignado — requiere aceptar/rechazar.
  let status = r.status;
  if (r.status === 'published' && !r.vehicle_id) status = 'offered';
  else if (r.status === 'published' || r.status === 'assigned') status = 'scheduled';

  return {
    id: r.id, num: r.route_number, title: r.title,
    client: r.company_name || 'Cliente corporativo',
    mode: r.service_mode === 'mensajeria' ? 'Mensajería' : r.service_mode === 'logistica' ? 'Logística' : 'Empleados',
    status: status,
    date: r.scheduled_date ? new Date(r.scheduled_date).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '',
    time: r.scheduled_start && r.scheduled_end
      ? `${new Date(r.scheduled_start).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})} – ${new Date(r.scheduled_end).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`
      : '',
    stops_total: r.total_stops || 0, stops_done: r.completed_stops || 0,
    km: r.total_km || 0,
    gross: r.gross_pay || 0, commission: (r.gross_pay||0) - (r.net_pay||0), net: r.net_pay || 0,
    vehicle: r.vehicle_plate || null, driver: r.driver_name || null,
    shipment: r.total_packages > 0 ? {
      total_packages: r.total_packages, total_weight_lbs: r.total_weight_lbs,
      total_volume_ft3: r.total_volume_ft3, stackable: true,
      fragile: r.has_fragile_items, hazmat: r.has_hazmat_items, temp_controlled: r.requires_temp_control,
      cargo_value: r.total_cargo_value, insurance_required: r.requires_insurance,
      special_instructions: r.driver_notes || '',
    } : null,
    stops: (r.stops || []).map(s => ({
      order: s.sequence_order, company: s.company_name || '', address: s.address || '',
      eta: s.eta_scheduled ? new Date(s.eta_scheduled).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '',
      status: s.status, code: s.items?.[0]?.package_code || '', pod: s.pod_required,
      packages: s.packages_count, weight_lbs: s.weight_lbs, volume_ft3: s.volume_ft3,
      dock: s.dock_number || '', wait_min: s.wait_minutes_estimated || 0, notes: s.access_notes || '',
    })),
  };
}

function getActiveRoutes() {
  if (useRealData && REAL_ROUTES) return REAL_ROUTES.map(mapRealRoute);
  return ROUTES;
}

  },

    service_mode: 'mensajeria', scheduled_date: '2026-09-02T10:30:00', total_stops: 3,
    total_weight_lbs: 40, total_volume_ft3: 6, current_ask: 62.00,
    my_thread: { transport_company_id: 'demo-tc', offers: [

function getMarketplaceRoutes() {
  if (useRealData && REAL_MARKETPLACE) return REAL_MARKETPLACE;
  return MARKETPLACE_DEMO;
}

async function refreshMarketplace() {
  if (useRealData) {
    REAL_MARKETPLACE = await apiGet('/transport/marketplace');
  }
  if (currentView === 'negociacion') document.getElementById('content').innerHTML = renderNegociacion();
  if (currentView === 'dashboard')   document.getElementById('content').innerHTML = renderDashboard();
}

function marketplaceDashboardWidget() {
  const routes = getMarketplaceRoutes();
  if (routes.length === 0) return '';
  const preview = routes.slice(0, 3);
  return `
    <div class="section-hdr" style="margin-top:8px">
      <div>
        <div class="section-title">💬 Rutas abiertas a pujas</div>
        <div class="section-sub">${routes.length} ruta${routes.length===1?'':'s'} del marketplace de negociación</div>
      </div>
      <button class="btn btn-ghost" onclick="showView('negociacion')">Ver todas →</button>
    </div>
    ${preview.map(r => marketplaceDashboardCard(r)).join('')}
  `;
}

function marketplaceDashboardCard(r) {
  const lastMine = r.my_thread ? r.my_thread.offers[r.my_thread.offers.length - 1] : null;
  const canBid   = !lastMine || lastMine.status !== 'pending';
  return `
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div style="flex:1">
          <div style="font-size:12px;color:var(--muted);font-family:var(--font-mono);margin-bottom:4px">${r.route_number}</div>
          <div class="card-title">${r.title}</div>
          <div class="card-sub">${r.total_stops} parada${r.total_stops===1?'':'s'} · ${r.total_weight_lbs} lbs</div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:16px">
          <div style="font-size:18px;font-weight:600;color:var(--orange)">${r.current_ask != null ? fmt$(r.current_ask) : '—'}</div>
          <div style="font-size:11px;color:var(--muted)">precio público</div>
        </div>
      </div>
      ${canBid ? `
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn btn-primary" style="font-size:12px" onclick="acceptMarketAsk('${r.route_id}')">✓ Aceptar precio</button>
          <input id="counterAmount-${r.route_id}" type="number" step="0.01" placeholder="Monto"
            style="width:90px;padding:6px 8px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:12px">
          <button class="btn btn-ghost" style="font-size:12px" onclick="sendMarketCounter('${r.route_id}')">Contraofertar</button>
        </div>
      ` : `<div style="font-size:12px;color:var(--muted)">⏳ Tu oferta de ${fmt$(lastMine.amount)} está pendiente de que el warehouse elija un ganador</div>`}
    </div>
  `;
}

      ${routes.length === 0 ? `
        <div style="text-align:center;padding:40px;color:var(--muted)">No hay rutas abiertas a pujas en este momento.</div>
      ` : routes.map(r => {
        const lastMine = r.my_thread ? r.my_thread.offers[r.my_thread.offers.length - 1] : null;
        const canBid = !lastMine || lastMine.status !== 'pending';
        return `
          <div class="table-wrap" style="padding:16px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
              <div>
                <div style="font-weight:600;color:var(--white)">${r.title}</div>
                <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono)">${r.route_number}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:4px">
                  ${r.total_stops} paradas · ${r.total_weight_lbs} lbs · ${r.total_volume_ft3} ft³
                  ${r.scheduled_date ? ' · ' + new Date(r.scheduled_date).toLocaleDateString('es-ES',{day:'numeric',month:'short'}) : ''}
                </div>
              </div>
              <div style="text-align:right">
                <div style="font-size:11px;color:var(--muted)">Precio público</div>
                <div style="font-size:20px;font-weight:700;color:var(--orange)">${r.current_ask != null ? fmt$(r.current_ask) : '—'}</div>
              </div>
            </div>

            ${r.my_thread ? `
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
                <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">Mi historial en esta ruta</div>
                ${r.my_thread.offers.map(o => `
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px">
                    <span style="color:var(--white)">${fmt$(o.amount)} ${o.note ? '· '+o.note : ''}</span>
                    <span class="badge ${o.status==='pending'?'badge-orange':o.status==='accepted'?'badge-green':'badge-muted'}" style="font-size:9px">
                      ${o.status==='pending' ? 'Pendiente' : o.status==='selected' ? 'Seleccionada — en holding' : o.status==='accepted' ? '✓ Aceptada' : o.status==='rejected' ? 'No seleccionada' : 'Reemplazada'}

                         border-radius:8px;color:var(--white);font-size:13px">
                <input id="counterNote-${r.route_id}" type="text" placeholder="Nota (opcional)"

async function acceptMarketAsk(routeId) {
  if (!useRealData) { showToast('Precio aceptado (demo)', 'success'); return; }
  try {
    await apiPost(`/transport/routes/${routeId}/accept-price`, {});
    showToast('Oferta enviada — esperando al warehouse', 'success');
    await refreshMarketplace();
  } catch (e) { showToast('Error: ' + e.message, 'warn'); }
}

async function sendMarketCounter(routeId) {
  const amount = parseFloat(document.getElementById(`counterAmount-${routeId}`)?.value);
  const note   = document.getElementById(`counterNote-${routeId}`)?.value.trim() || null;
  if (!amount || amount <= 0) { showToast('Ingresá un monto válido', 'warn'); return; }

  if (!useRealData) { showToast('Contraoferta enviada (demo)', 'success'); return; }
  try {
    await apiPost(`/transport/routes/${routeId}/counter-offer`, { amount, note });
    showToast('Contraoferta enviada', 'success');
    await refreshMarketplace();
  } catch (e) { showToast('Error: ' + e.message, 'warn'); }
}

function updateOfferedBadge() {
  const count = getActiveRoutes().filter(r => r.status === 'offered').length;
  const badge = document.getElementById('navOfferedBadge');
  if (!badge) return;
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

// ── Aceptar / rechazar rutas ofrecidas ──────────────────────────────────────
async function rejectRoute(routeId) {
  if (!confirm('¿Seguro que querés rechazar esta ruta? Pasará a otra empresa de transporte.')) return;
  if (useRealData) {
    try {
      await apiPost(`/transport/routes/${routeId}/reject`, {});
      await loadRealData();
      showToast('Ruta rechazada', 'info');
    } catch (e) {
      showToast('Error al rechazar: ' + e.message, 'warn');
      return;
    }
  } else {
    const idx = ROUTES.findIndex(r => r.id === routeId);
    if (idx >= 0) ROUTES.splice(idx, 1);
    showToast('Ruta rechazada (demo)', 'info');
  }
  document.getElementById('content').innerHTML = (currentView === 'rutas' ? renderRutas : renderDashboard)();
}

function openAcceptModal(routeId) {
  const r = getActiveRoutes().find(x => x.id === routeId);
  if (!r) return;
  const fleet = useRealData && REAL_FLEET ? REAL_FLEET : FLEET;
  const available = fleet.filter(v => v.is_active !== false && !v.active_route_id);

  document.getElementById('stopModalTitle').textContent = `Aceptar ${r.num}`;
  document.getElementById('stopModalSub').textContent = r.title;
  document.getElementById('stopModalBody').innerHTML = `
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Elegí qué vehículo de tu flota va a cubrir esta ruta.</p>
    ${available.length === 0 ? '<div class="alert warn"><div class="alert-icon">⚠️</div><div class="alert-body">No tenés vehículos disponibles en este momento.</div></div>' :
      available.map(v => `
        <div class="card" style="margin-bottom:8px;cursor:pointer" onclick="confirmAccept('${routeId}','${v.id}')">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-weight:500;font-size:13px">${v.plate} — ${v.make} ${v.model}</div>
              <div style="font-size:11px;color:var(--muted)">${v.driver_name || 'Sin conductor'} ${v.driver_rating ? '· ★ '+v.driver_rating : ''}</div>
            </div>
            <span class="badge badge-green">Elegir →</span>
          </div>
        </div>
      `).join('')}
  `;
  document.getElementById('stopModalOverlay').style.display = 'block';
  document.getElementById('stopModal').style.display = 'block';
}

async function confirmAccept(routeId, vehicleId) {
  closeStopModal();
  if (useRealData) {
    try {
      await apiPost(`/transport/routes/${routeId}/accept?vehicle_id=${vehicleId}`, {});
      await loadRealData();
      showToast('Ruta aceptada y vehículo asignado', 'success');
    } catch (e) {
      showToast('Error al aceptar: ' + e.message, 'warn');
      return;
    }
  } else {
    const r = ROUTES.find(x => x.id === routeId);
    const v = FLEET.find(x => x.id === vehicleId);
    if (r && v) {
      r.status = 'scheduled';
      r.vehicle = `${v.make} ${v.model} · ${v.plate}`;
      r.driver = v.driver_name;
    }
    showToast('Ruta aceptada (demo)', 'success');
  }
  document.getElementById('content').innerHTML = (currentView === 'rutas' ? renderRutas : renderDashboard)();
}

async function submitNewVehicle() {
  const plate = document.getElementById('newVehiclePlate').value.trim();
  const make  = document.getElementById('newVehicleMake').value.trim();
  const model = document.getElementById('newVehicleModel').value.trim();
  const year  = parseInt(document.getElementById('newVehicleYear').value);
  const color = document.getElementById('newVehicleColor').value.trim() || 'Blanco';
  const vehicle_type = document.getElementById('newVehicleType').value;
  const payload_kg = parseFloat(document.getElementById('newVehiclePayload').value) || null;
  const volume_m3  = parseFloat(document.getElementById('newVehicleVolume').value) || null;

  const errEl = document.getElementById('addVehicleError');
  errEl.style.display = 'none';

  if (!plate || !make || !model || !year) {
    errEl.textContent = 'Completá placa, marca, modelo y año.';
    errEl.style.display = 'block';
    return;
  }

  if (!useRealData) {
    FLEET.push({
      id: 'V-' + Date.now(), plate, make, model, year, vehicle_type, is_active: true,
      driver_name: null, driver_rating: null, driver_online: false,
      active_route_id: null, active_route_number: null,
    });
    closeStopModal();
    showToast('Vehículo agregado (demo)', 'success');
    document.getElementById('content').innerHTML = renderFlota();
    return;
  }

  try {
    await apiPost('/transport/fleet', { plate, make, model, year, color, vehicle_type, payload_kg, volume_m3 });
    closeStopModal();
    showToast('Vehículo agregado a la flota', 'success');
    await loadRealData();
    document.getElementById('content').innerHTML = renderFlota();
  } catch (e) {
    errEl.textContent = 'Error al agregar: ' + e.message;
    errEl.style.display = 'block';
  }
}

// ── Live tracking — Leaflet map + WebSocket ─────────────────────────────────
let liveMapInstance = null;
let vehicleMarkers = {};     // route_id -> L.marker
let routePolylines = {};     // route_id -> L.polyline (rastro recorrido)
let trackingWS = null;

function initLiveTracking() {
  const mapEl = document.getElementById('liveMap');
  if (!mapEl || typeof L === 'undefined') return;

  // Crear el mapa una sola vez; si ya existe, solo lo redimensionamos
  if (!liveMapInstance) {
    liveMapInstance = L.map('liveMap', { zoomControl: true, attributionControl: true })
      .setView([28.5383, -81.3792], 11); // Orlando, FL por defecto
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap, © CARTO',
      maxZoom: 19,
    }).addTo(liveMapInstance);
  } else {
    setTimeout(() => liveMapInstance.invalidateSize(), 50);
  }

  if (!useRealData) {
    document.getElementById('trackingInfo').textContent = 'Conectate al backend real para ver tracking en vivo.';
    return;
  }

  loadFleetTrackingSnapshot();
}

async function loadFleetTrackingSnapshot() {
  try {
    const snap = await apiGet('/transport/fleet/tracking');
    (snap.vehicles || []).forEach(v => {
      if (v.lat != null && v.lng != null) {
        updateVehicleOnMap(v.vehicle_id, v.lat, v.lng, v.plate);
      }
    });
    connectFleetWS(snap.ws_channel);
    if (!snap.vehicles || snap.vehicles.length === 0) {
      document.getElementById('trackingInfo').textContent = 'Ningún vehículo reportando posición en este momento.';
    }
  } catch (e) {
    // sin posiciones todavía — normal si ningún conductor inició navegación
  }
}

function updateVehicleOnMap(vehicleId, lat, lng, plate) {
  if (!liveMapInstance) return;

  if (!vehicleMarkers[vehicleId]) {
    const icon = L.divIcon({
      className: '', html: `<div style="width:16px;height:16px;background:#F47B20;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(244,123,32,0.3)"></div>`,
      iconSize: [16, 16], iconAnchor: [8, 8],
    });
    vehicleMarkers[vehicleId] = L.marker([lat, lng], { icon })
      .addTo(liveMapInstance)
      .bindPopup(`<b>${plate || vehicleId}</b><br>Posición en vivo`);
    routePolylines[vehicleId] = L.polyline([[lat, lng]], { color: '#F47B20', weight: 2, opacity: 0.6 }).addTo(liveMapInstance);
    liveMapInstance.setView([lat, lng], 12);
  } else {
    vehicleMarkers[vehicleId].setLatLng([lat, lng]);
    const path = routePolylines[vehicleId].getLatLngs();
    path.push([lat, lng]);
    routePolylines[vehicleId].setLatLngs(path);
  }

  const infoEl = document.getElementById('trackingInfo');
  if (infoEl) {
    infoEl.innerHTML = `<strong style="color:var(--white)">${plate || vehicleId}</strong> · ${lat.toFixed(5)}, ${lng.toFixed(5)} · ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
  }
}

function connectFleetWS(wsChannel) {
  disconnectTrackingWS();
  if (!wsChannel) return;

  const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${wsProtocol}//${location.host}/ws/tracking/${wsChannel}`;
  trackingWS = new WebSocket(wsUrl);

  trackingWS.onopen = () => {
    const badge = document.getElementById('wsStatusBadge');
    if (badge) { badge.textContent = '● En vivo'; badge.style.background = 'var(--green-dim)'; badge.style.color = 'var(--green)'; }
  };
  trackingWS.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === 'vehicle_location') {
        updateVehicleOnMap(msg.vehicle_id, msg.lat, msg.lng, msg.plate);
      }
    } catch (e) {}
  };
  trackingWS.onclose = () => {
    const badge = document.getElementById('wsStatusBadge');
    if (badge) { badge.textContent = '○ Sin conexión'; badge.style.background = 'var(--card2)'; badge.style.color = 'var(--muted)'; }
  };
  trackingWS.onerror = () => {};
}

function disconnectTrackingWS() {
  if (trackingWS) {
    trackingWS.close();
    trackingWS = null;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
// Este portal requiere haber pasado por login.html primero. Si no hay
// token válido en sessionStorage, redirige automáticamente.
(function tryAutoLogin() {
  const savedToken = sessionStorage.getItem('muevo_token');
  if (!savedToken) {
    window.location.href = '/login.html';
    return;
  }
  authToken = savedToken;
  useRealData = true;
  loadRealData().then(() => showView('dashboard'));
})();
