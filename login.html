<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muevo — Iniciar sesión</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:#0D0D0D; color:#fff; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .login-card {
    width:340px; background:#1C1C1C; border:1px solid rgba(255,255,255,0.07);
    border-radius:14px; padding:28px;
  }
  .login-logo { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .login-logo img { width:36px; height:36px; border-radius:10px; object-fit:cover; }
  .login-logo .name { font-size:16px; font-weight:600; color:var(--white, #F8FAFB); }
  .login-sub { font-size:13px; color:#8A8A8A; margin-bottom:16px; }

  [data-theme="light"] {
    --bg:      #F4F4F2;
    --card:    #FFFFFF;
    --white:   #1A1A1A;
    --muted:   #6B6B6B;
    --border:  rgba(0,0,0,0.09);
    --input-bg: #FAFAF8;
    --input-border: rgba(0,0,0,0.12);
  }

  input {
    width:100%; padding:10px 12px; margin-bottom:8px; background:#222;
    border:1px solid var(--input-border, rgba(255,255,255,0.07)); border-radius:8px; color:#fff;
    font-size:13px; box-sizing:border-box;
  }
  input:last-of-type { margin-bottom:14px; }
  button.login-btn {
    width:100%; padding:10px; background:#F47B20; border:none; border-radius:8px;
    color:#111; font-weight:600; font-size:13px; cursor:pointer;
  }
  button.login-btn:disabled { opacity:0.6; cursor:not-allowed; }
  .login-error { color:#E74C3C; font-size:12px; margin-top:10px; display:none; }
  .login-redirect { color:#8A8A8A; font-size:12px; margin-top:10px; display:none; text-align:center; }
  .quick-access { text-align:center; margin-top:14px; font-size:11px; color:#5A5A5A; }

  [data-theme="light"] body {
    background: #F4F4F2;
    color: #1A1A1A;
  }
  [data-theme="light"] .login-card {
    background: #FFFFFF;
    border-color: rgba(0,0,0,0.08);
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  [data-theme="light"] input {
    background: #FAFAF8 !important;
    border-color: rgba(0,0,0,0.12) !important;
    color: #1A1A1A !important;
  }
  [data-theme="light"] .login-sub,
  [data-theme="light"] .quick-access { color: #888; }

</style>
</head>
<body>

    <div class="name">muevo</div>
  </div>
  <div class="login-sub">Inicia sesión para continuar</div>

  <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
  <input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password">

  <button class="login-btn" id="loginBtn" onclick="handleLogin()">Iniciar sesión</button>

  <div id="loginError" class="login-error"></div>
  <div id="loginRedirect" class="login-redirect"></div>

  <div style="text-align:right;margin-bottom:4px">
    <button id="themeToggleBtn" onclick="toggleTheme()" title="Cambiar tema"
      style="background:none;border:none;cursor:pointer;font-size:18px;opacity:.6">🌙</button>
  </div>
  <div class="quick-access">Portal warehouse, transportista, o conductor — el sistema te redirige automáticamente</div>
</div>

<script>
const API_BASE = '/api/v1';

document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLogin();
});

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const redirectEl = document.getElementById('loginRedirect');
  const btn = document.getElementById('loginBtn');

  errEl.style.display = 'none';
  redirectEl.style.display = 'none';

  if (!email || !password) {
    errEl.textContent = 'Completá email y contraseña.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verificando...';

  try {
    const body = new URLSearchParams({ username: email, password });
    const res = await fetch(`${API_BASE}/auth/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });

    if (!res.ok) {
      throw new Error('Email o contraseña incorrectos.');
    }

    const data = await res.json();

    // Guardamos el token en sessionStorage para que warehouse.html / transport.html
    // lo recojan al cargar, sin pedir login de nuevo.
    sessionStorage.setItem('muevo_token', data.access_token);
    sessionStorage.setItem('muevo_user', JSON.stringify(data.user));

    if (data.portal === 'driver') {
      errEl.textContent = 'Esta cuenta es de conductor — usá la app Muevo Drive, no el portal web.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
      return;
    }

    if (!data.redirect) {
      errEl.textContent = 'No pudimos determinar tu portal. Contactá al administrador.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
      return;
    }

    // Guardar token y datos de usuario
    sessionStorage.setItem('muevo_token', data.access_token);
    sessionStorage.setItem('muevo_user', JSON.stringify(data.user));

    // Si tiene más de 1 compañía → mostrar selector de contexto
    if (data.companies && data.companies.length > 1 && !data.auto_company) {
      showCompanySelector(data);
      return;
    }

    // Una sola compañía o auto-company → guardar y redirigir directo
    const company = data.auto_company || (data.companies && data.companies[0]);
    if (company) {
      sessionStorage.setItem('muevo_company', JSON.stringify(company));
    }
    redirectEl.textContent = 'Redirigiendo a tu portal...';
    redirectEl.style.display = 'block';
    setTimeout(() => { window.location.href = data.redirect; }, 400);
  } catch (e) {
    errEl.textContent = e.message || 'Error al conectar con el servidor.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('muevo_theme', next);
  applyTheme(next);
}
(function initTheme() {
  const saved = localStorage.getItem('muevo_theme') || 'dark';
  applyTheme(saved);
})();


// ── Company selector ─────────────────────────────────────────────────────────
let pendingPortalData = null;

function showCompanySelector(data) {
  pendingPortalData = data;
  document.getElementById('loginCard').style.display = 'none';

  const selector = document.getElementById('companySelector');
  selector.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <div style="width:36px;height:36px;border-radius:10px;background:#F47B20;display:flex;align-items:center;justify-content:center;font-size:18px">🏢</div>
      <div>
        <div style="font-size:15px;font-weight:600;color:var(--white, #F8FAFB)">Seleccioná una empresa</div>
        <div style="font-size:12px;color:#8A8A8A">Tenés acceso a ${data.companies.length} compañías</div>
      </div>
    </div>
    ${data.companies.map(c => `
      <button onclick="selectCompany('${c.id}', '${c.name}', '${data.redirect}')"
        style="width:100%;text-align:left;padding:14px 16px;background:#222;border:1px solid rgba(255,255,255,0.07);
               border-radius:10px;color:#fff;cursor:pointer;margin-bottom:8px;transition:border-color .15s"
        onmouseover="this.style.borderColor='#F47B20'" onmouseout="this.style.borderColor='rgba(255,255,255,0.07)'">
        <div style="font-size:14px;font-weight:500">${c.name}</div>
        <div style="font-size:11px;color:#8A8A8A;margin-top:2px">
          ${c.can_operate ? '✏️ Operación' : '👁 Solo lectura'}
          ${c.can_invoice ? ' · 💰 Facturación' : ''}
          ${c.is_admin    ? ' · 👑 Admin' : ''}
        </div>
      </button>
    `).join('')}
    <button onclick="document.getElementById('loginCard').style.display='';document.getElementById('companySelector').innerHTML=''"
      style="width:100%;padding:10px;background:none;border:none;color:#8A8A8A;cursor:pointer;font-size:12px;margin-top:4px">
      ← Volver al login
    </button>
  `;
  selector.style.display = 'block';
}

function selectCompany(companyId, companyName, redirect) {
  const company = pendingPortalData.companies.find(c => c.id === companyId);
  sessionStorage.setItem('muevo_company', JSON.stringify(company || { id: companyId, name: companyName }));
  window.location.href = redirect;
}

</script>

</body>
</html>
