<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muevo — Registro de conductor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0D0D0D; --card: #1C1C1C; --orange: #F47B20; --white: #F8FAFB; --muted: #8A8A8A;
    --border: rgba(255,255,255,0.10); --green: #27AE60; --red: #E74C3C;
    --font: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
  }
  [data-theme="light"] { --bg: #F4F4F2; --card: #FFFFFF; --white: #1A1A1A; --muted: #6B6B6B; --border: rgba(0,0,0,0.12); }
  body { background: var(--bg); color: var(--white); font-family: var(--font); font-size: 14px; line-height: 1.5; padding: 32px 16px 64px; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .brand { font-weight: 600; font-size: 18px; margin-bottom: 4px; }
  .brand small { color: var(--orange); font-size: 11px; letter-spacing: .5px; text-transform: uppercase; margin-left: 8px; }
  h1 { font-size: 22px; margin: 18px 0 6px; font-weight: 600; }
  p.lead { color: var(--muted); margin-bottom: 20px; }
  fieldset { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; min-width: 0; }
  legend { padding: 0 8px; font-weight: 600; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  input { font: inherit; background: transparent; color: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; width: 100%; }
  input[readonly] { opacity: .7; }
  input:focus, button:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
  .hint { font-size: 11px; color: var(--muted); }
  button.primary { font: inherit; cursor: pointer; background: var(--orange); border: 1px solid var(--orange); color: #fff; border-radius: 8px; padding: 11px 18px; font-weight: 600; width: 100%; }
  button.primary:disabled { opacity: .5; cursor: default; }
  .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border); }
  .msg.err { border-color: var(--red); color: var(--red); }
  .msg.ok { border-color: var(--green); color: var(--green); }
  a { color: var(--orange); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">muevo<small>Conductores</small></div>
  <h1>Completá tu registro</h1>
  <p class="lead" id="lead">Verificando tu invitación…</p>
  <div id="msg" class="msg" hidden></div>

  <form id="form" novalidate hidden>
    <fieldset>
      <legend>Tus datos</legend>
      <div class="grid">
        <label>Correo<input id="email" readonly autocomplete="username"></label>
        <label>Nombre completo<input id="full_name" required maxlength="255" autocomplete="name"></label>
        <label>Teléfono<input id="phone" type="tel" required maxlength="30" autocomplete="tel"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Licencia de conducir</legend>
      <div class="grid">
        <label>Estado que la emitió (2 letras)<input id="license_state" required maxlength="2" placeholder="FL" style="text-transform:uppercase"></label>
        <label>Vence el<input id="license_expires" type="date" required></label>
      </div>
      <p class="hint" style="margin-top:8px">Tu empresa revisa tu licencia antes de aprobarte.</p>
    </fieldset>
    <fieldset>
      <legend>Contraseña</legend>
      <div class="grid">
        <label>Contraseña<input id="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><span class="hint">Mínimo 8 caracteres.</span></label>
        <label>Repetila<input id="password2" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label>
      </div>
    </fieldset>
    <button class="primary" id="submitBtn" type="submit">Crear mi cuenta</button>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
try { document.documentElement.setAttribute('data-theme', localStorage.getItem('muevo_theme') || 'dark'); } catch (e) {}

const token = new URLSearchParams(location.search).get('token') || '';
// El token no tiene por qué quedar en la barra de direcciones ni en el historial
if (token) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }

function showMsg(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + kind; m.hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' }); }

function formatError(body) {
  if (!body) return 'No pudimos completar el registro. Probá de nuevo.';
  if (typeof body.detail === 'string') return body.detail;
  if (Array.isArray(body.detail)) {
    const labels = { full_name: 'Nombre', phone: 'Teléfono', password: 'Contraseña', license_state: 'Estado de la licencia', license_expires: 'Vencimiento de la licencia' };
    return 'Revisá estos campos: ' + [...new Set(body.detail.map(d => labels[d.loc[d.loc.length - 1]] || d.loc[d.loc.length - 1]))].join(', ') + '.';
  }
  return 'No pudimos completar el registro.';
}

(async function load() {
  if (!token) { $('lead').textContent = ''; showMsg('Falta el enlace de invitación. Abrí el enlace que te envió tu empresa.', 'err'); return; }
  try {
    const res = await fetch('/api/v1/driver-invitations/' + encodeURIComponent(token));
    const data = await res.json().catch(() => null);
    if (!res.ok) { $('lead').textContent = ''; showMsg(formatError(data), 'err'); return; }
    $('lead').textContent = data.company_name + ' te invitó a trabajar como conductor en Muevo.';
    $('email').value = data.email;
    if (data.full_name) $('full_name').value = data.full_name;
    $('form').hidden = false;
  } catch (e) {
    $('lead').textContent = '';
    showMsg('No pudimos conectar con el servidor. Probá de nuevo en unos minutos.', 'err');
  }
})();

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('msg').hidden = true;
  if ($('password').value !== $('password2').value) return showMsg('Las contraseñas no coinciden.', 'err');
  $('submitBtn').disabled = true;
  try {
    const res = await fetch('/api/v1/driver-invitations/' + encodeURIComponent(token) + '/accept', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_name: $('full_name').value.trim(), phone: $('phone').value.trim(), password: $('password').value,
        license_state: $('license_state').value.trim().toUpperCase(), license_expires: $('license_expires').value,
      }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) { showMsg(formatError(data), 'err'); return; }
    $('form').hidden = true;
    showMsg(data.message, 'ok');
  } catch (err) {
    showMsg('No pudimos conectar con el servidor. Probá de nuevo en unos minutos.', 'err');
  } finally {
    $('submitBtn').disabled = false;
  }
});
</script>
</body>
</html>
